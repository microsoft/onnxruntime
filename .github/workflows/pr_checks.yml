name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:  # set top-level default permissions as security best practice
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  auto-apply-fixes:
    name: Suggest fixes
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Keep in sync with lint.yml; must be a version cached on the runner pool.
          python-version: "3.12"
      - name: Update PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies and run lintrunner on all files
        run: |
          python -m pip install --user -r requirements-dev.txt
          python -m pip install --user lintrunner lintrunner-adapters
          lintrunner init
          set +e
          lintrunner f --all-files -v
          exit 0
      - uses: parkerbxyz/suggest-changes@e24c62a5a3235e6090721c7b0355b825a3a4ba9a # v3.1.2
        with:
          comment: 'You can commit the suggested changes from lintrunner.'
