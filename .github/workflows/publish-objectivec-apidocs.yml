name: Update Objective-C API Docs

# Run when the Objective-C API changes or every week so that the artifact does not expire.
# Also runs on pull requests that touch relevant files so doc generation errors
# are caught early. The artifact is only published on the main branch.
on:
  push:
    branches:
    - main
    paths:
    - objectivec/**
  pull_request:
    paths:
    - objectivec/**
  schedule:
  - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: "apidocs-objectivec-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    name: Generate Objective-C API docs
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: ./.github/actions/setup-build-tools

    - name: Install Jazzy and dependencies
      env:
        BUNDLE_GEMFILE: ./objectivec/docs/Gemfile
      run: bundle install

    - name: Generate Objective-C docs
      env:
        BUNDLE_GEMFILE: ./objectivec/docs/Gemfile
      run: |
        set -e

        # add commit info to main page of generated docs
        ORT_COMMIT_SHORT="$(git rev-parse --short HEAD)"
        printf "\n%s\n" \
               "This documentation was generated from the ONNX Runtime source at commit ${ORT_COMMIT_SHORT}." \
               >> ./objectivec/docs/main_page.md

        bundle exec jazzy --config ./objectivec/docs/jazzy_config.yaml \
              --clean --output ./_site/docs/api/objectivec
      shell: bash

    - name: Upload new site
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: onnxruntime-objectivec-apidocs
        path: ./_site
        retention-days: 10
