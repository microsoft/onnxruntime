# Validates the EP op conformance infrastructure on Windows using outputs from an existing ORT build.
# Tests generation/export/replay, builds the standalone source kit, and checks isolated plugin/minimum-runtime execution.
name: EP Op Conformance Infrastructure

on:
  workflow_call:
    inputs:
      build-id:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  checks:
    name: Infrastructure Tests And Packaging
    runs-on: [
      "self-hosted",
      "1ES.Pool=onnxruntime-github-vs2022-latest",
      "JobId=ep-op-conformance-infrastructure-checks-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
      ]
    timeout-minutes: 20
    outputs:
      source-id: ${{ steps.source.outputs.artifact-id }}
      cases-id: ${{ steps.cases.outputs.artifact-id }}
      fixture-id: ${{ steps.fixture.outputs.artifact-id }}
    steps:
      - name: Checkout Infrastructure Sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: false

      - name: Download Main-Build Infrastructure Inputs By Immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.build-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ep-op-conformance-inputs

      - name: Setup Infrastructure Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Infrastructure Test Dependencies
        run: |
          python -m pip install -r tools/ci_build/github/windows/python/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Infrastructure And Package Source Kit
        run: |
          $root = "$env:RUNNER_TEMP/ep-op-conformance-inputs"
          $tools = 'onnxruntime/test/ep_op_conformance/tools'
          $python = (Get-Command python.exe).Source
          & $python "$tools/test_infrastructure.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python "$tools/test_package_cases.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ORT_EP_OP_CONFORMANCE_EXPORT_DIR = "$root/cpp-cases"
          Push-Location "$root/bin"
          try {
            & ./onnxruntime_ep_op_conformance_export_test.exe --gtest_filter=EpOpConformanceExportTest.MulFloat32Vector
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
          & $python "$tools/test_runner.py" --runner "$root/bin/onnxruntime_ep_op_conformance_test.exe" `
            --runtime "$root/bin/onnxruntime.dll" --plugin-library "$root/bin/example_plugin_ep.dll" `
            --exported-cases $env:ORT_EP_OP_CONFORMANCE_EXPORT_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python "$tools/ci/package_artifacts.py" create --generated "$root/generated" `
            --runner "$root/bin/onnxruntime_ep_op_conformance_test.exe" --runtime "$root/bin/onnxruntime.dll" `
            --plugin "$root/bin/example_plugin_ep.dll" --output "$env:RUNNER_TEMP/ep-op-conformance-packages" `
            --revision $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish EP Op Conformance Source Kit
        id: source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep-op-conformance-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ep-op-conformance-packages/source-kit
          if-no-files-found: error
          retention-days: 7

      - name: Publish Exact EP Op Conformance Cases
        id: cases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep-op-conformance-cases-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ep-op-conformance-packages/cases
          if-no-files-found: error
          retention-days: 7

      - name: Publish Matching EP Op Conformance Native Fixture
        id: fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep-op-conformance-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ep-op-conformance-packages/fixture
          if-no-files-found: error
          retention-days: 7

  prepare:
    name: Build Standalone Source Kit And Prepare Fixtures
    needs: checks
    runs-on: [
      "self-hosted",
      "1ES.Pool=onnxruntime-github-vs2022-latest",
      "JobId=ep-op-conformance-infrastructure-prepare-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
      ]
    timeout-minutes: 40
    outputs:
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - name: Download Source Kit By Immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.checks.outputs.source-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ep-op-conformance/source

      - name: Download Exact Main-Build Cases By Immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.checks.outputs.cases-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ep-op-conformance/cases

      - name: Download Matching Runtime And Plugin By Immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.checks.outputs.fixture-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ep-op-conformance/fixture

      - name: Setup Preparation Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Isolated Preparation Dependencies
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE/.git") { throw 'Consumer must not have a source checkout' }
          python -m venv "$env:RUNNER_TEMP/ep-op-conformance-venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/python.exe" -m pip install `
            cmake==3.31.6 numpy==2.2.6 onnx==1.17.0 protobuf==3.20.3 onnxruntime==1.24.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Source Case And Fixture Provenance
        run: |
          $root = "$env:RUNNER_TEMP/ep-op-conformance"
          & "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/python.exe" -B "$root/source/tools/ci/package_artifacts.py" verify `
            --source "$root/source" --cases "$root/cases" --fixture "$root/fixture" --revision $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Standalone Packaged Public API Consumer
        run: |
          $root = "$env:RUNNER_TEMP/ep-op-conformance"
          $cmake = "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/cmake.exe"
          $python = "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/python.exe"
          New-Item -ItemType Directory -Force "$root/diagnostics" | Out-Null
          & $cmake -S "$root/source" -B "$root/build" -G 'Visual Studio 17 2022' -A x64 `
            -DEP_OP_CONFORMANCE_FETCH_DEPS=ON "-DPYTHON_EXECUTABLE=$python" *> "$root/diagnostics/configure.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$root/diagnostics/configure.log" -Tail 80; exit 1 }
          & $cmake --build "$root/build" --config RelWithDebInfo `
            --target onnxruntime_ep_op_conformance_test ep_op_conformance_comparison_test --parallel 4 *> "$root/diagnostics/build.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$root/diagnostics/build.log" -Tail 80; exit 1 }
          & "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/ctest.exe" --test-dir "$root/build" `
            -C RelWithDebInfo --output-on-failure *> "$root/diagnostics/test.log"
          if ($LASTEXITCODE -ne 0) { Get-Content "$root/diagnostics/test.log"; exit 1 }

      - name: Stage Matching Plugin And Separate Minimum-Runtime CPU Bundles
        run: |
          $root = "$env:RUNNER_TEMP/ep-op-conformance"
          $python = "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/python.exe"
          $runtime = & $python -I -c "import onnxruntime; from pathlib import Path; assert onnxruntime.__version__ == '1.24.4'; print(Path(onnxruntime.__file__).parent / 'capi' / 'onnxruntime.dll')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $common = @('--source', "$root/source", '--cases', "$root/cases", '--fixture', "$root/fixture", `
                      '--runner', "$root/build/RelWithDebInfo/onnxruntime_ep_op_conformance_test.exe", '--revision', $env:GITHUB_SHA)
          & $python -B "$root/source/tools/ci/package_artifacts.py" stage @common --output "$root/native/matching"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -B "$root/source/tools/ci/package_artifacts.py" stage @common --output "$root/native/minimum" --minimum-runtime $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Immutable Native Bundles
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep-op-conformance-native-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ep-op-conformance/native
          if-no-files-found: error
          retention-days: 7

      - name: Preserve Source-Kit Build Diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep-op-conformance-source-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ep-op-conformance/diagnostics
          if-no-files-found: warn
          retention-days: 14

  consume:
    name: Isolated Native Infrastructure Checks
    needs: prepare
    runs-on: [
      "self-hosted",
      "1ES.Pool=onnxruntime-github-vs2022-latest",
      "JobId=ep-op-conformance-infrastructure-consume-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
      ]
    timeout-minutes: 10
    steps:
      - name: Download Prepared Bundles By Immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.bundle-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ep-op-conformance-native

      - name: Execute Matching Plugin And Minimum-Runtime Compatibility Checks
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE/.git") { throw 'Consumer must not have a source checkout' }
          if (Test-Path "$env:RUNNER_TEMP/ep-op-conformance/source") { throw 'Source kit must be unavailable' }
          if (Test-Path "$env:RUNNER_TEMP/ep-op-conformance/build") { throw 'Build tree must be unavailable' }
          & "$env:RUNNER_TEMP/ep-op-conformance-native/matching/run_bundle_checks.ps1"
          & "$env:RUNNER_TEMP/ep-op-conformance-native/minimum/run_bundle_checks.ps1" -ExpectedRuntimeVersion '1.24.4'

      - name: Preserve Infrastructure Reports Even On Failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep-op-conformance-infrastructure-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ep-op-conformance-native/**/reports
          if-no-files-found: warn
          retention-days: 14