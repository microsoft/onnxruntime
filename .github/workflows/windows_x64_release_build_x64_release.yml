name: windows_x64_release

on:
  push:
    branches: [main, 'rel-*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark_sccache:
        description: Compare clean uncached, cold-cache and warm-cache runtime builds after the normal tests
        type: boolean
        default: false
      e2e_cache:
        description: Full CI cache experiment (seed publishes only an isolated temporary branch snapshot)
        type: choice
        options: [none, uncached, seed, warm]
        default: none
      e2e_cache_id:
        description: Unique experiment ID shared by uncached, seed and warm dispatches on the same commit
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ inputs.e2e_cache || 'none' }}-${{ inputs.e2e_cache_id }}
  cancel-in-progress: true

jobs:
  build_x64_release:
    runs-on: [ort-github-win-16-amd-scus-ss]
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Validate E2E cache experiment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_cache != 'none' }}
        shell: python
        env:
          EXPERIMENT_ID: ${{ inputs.e2e_cache_id }}
          TARGET_BENCHMARK: ${{ inputs.benchmark_sccache }}
        run: |
          import os
          import re

          if not re.fullmatch(r"[A-Za-z0-9-]{1,64}", os.environ["EXPERIMENT_ID"]):
              raise ValueError("Provide a unique alphanumeric/hyphen e2e_cache_id (1-64 characters)")
          if not os.environ["GITHUB_REF"].startswith("refs/heads/") or os.environ["GITHUB_REF"] == "refs/heads/main":
              raise ValueError("Temporary cache experiments must run on a working branch, not main or a tag")
          if os.environ["TARGET_BENCHMARK"] == "true":
              raise ValueError("Do not combine full CI timing with the extra target-only benchmark")

      - name: Locate vcvarsall and Setup Env
        uses: ./.github/actions/locate-vcvarsall-and-setup-env
        with:
          architecture: x64

      - name: Test OneCore Spectre library selection
        shell: cmd
        run: python tools\ci_build\test_onecore_spectre.py

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: windows-x64-build-relwithdebinfo
          path: ${{ runner.temp }}/vcpkg-binary-cache

      - name: Install python modules
        shell: cmd
        run: python -m pip install -r "${{ github.workspace }}\tools\ci_build\github\windows\python\requirements.txt"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: x64

      - name: API Documentation Check and generate
        shell: cmd
        run: |
          set ORT_DOXY_SRC=${{ github.workspace }}
          set ORT_DOXY_OUT=${{ github.workspace }}\build\RelWithDebInfo\RelWithDebInfo
          mkdir %ORT_DOXY_SRC%
          mkdir %ORT_DOXY_OUT%
          "C:\Program Files\doxygen\bin\doxygen.exe" ${{ github.workspace }}\tools\ci_build\github\Doxyfile_csharp.cfg
        working-directory: ${{ github.workspace }}

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Use Nuget 6.x
        uses: nuget/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2.0.2
        with:
          nuget-version: '6.x'

      - name: NuGet restore
        shell: cmd
        run: |
          nuget restore ${{ github.workspace }}\packages.config -PackagesDirectory ${{ github.workspace }}\build\RelWithDebInfo -ConfigFile ${{ github.workspace }}\NuGet.config

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: onnx-node-tests-cache
        with:
          path: ${{ github.workspace }}/js/test/
          key: onnxnodetests-${{ hashFiles('js/scripts/prepare-onnx-node-tests.ts') }}

      - name: Setup compiler cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.e2e_cache == 'none' }}
        id: sccache
        uses: ./.github/actions/setup-sccache
        with:
          key: ${{ github.workflow }}-${{ github.job }}

      - name: Configure E2E cache experiment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_cache != 'none' }}
        id: e2e_cache
        shell: python
        env:
          EXPERIMENT_MODE: ${{ inputs.e2e_cache }}
          EXPERIMENT_ID: ${{ inputs.e2e_cache_id }}
          CACHE_VARIANT: e2e-${{ inputs.e2e_cache_id }}-${{ github.workflow }}-${{ github.job }}
          CACHE_SIZE: 10G
          CACHE_REF: ${{ github.ref }}
        run: |
          import os
          import runpy
          from pathlib import Path

          cache = runpy.run_path(".github/actions/setup-sccache/cache.py")
          mode = os.environ["EXPERIMENT_MODE"]
          enabled = mode in ("seed", "warm")
          if enabled:
              cache["detect"]()
              cache["configure"]()
              # actions/cache includes the path in its archive version; keep it stable across jobs.
              directory = Path(os.environ["RUNNER_TEMP"]) / f"sccache-e2e-{os.environ['EXPERIMENT_ID']}"
              directory.mkdir(exist_ok=False)
              cache["append_values"](os.environ["GITHUB_ENV"], {
                  "SCCACHE_DIR": directory,
                  "SCCACHE_LOCAL_RW_MODE": "READ_WRITE" if mode == "seed" else "READ_ONLY",
                  "SCCACHE_LOG": "sccache::compiler::c=trace",
                  "SCCACHE_ERROR_LOG": str(Path(os.environ["RUNNER_TEMP"]) / "sccache-key-debug.log"),
                  "MSBUILDPRESERVETOOLTEMPFILES": "1",
              })
          cache["append_values"](os.environ["GITHUB_ENV"], {"SCCACHE_ENABLED": str(enabled).lower()})
          cache["append_values"](os.environ["GITHUB_OUTPUT"], {
              "build-flags": "--use_cache --cache_tool sccache" if enabled else "",
          })

      - name: Restore temporary E2E compiler snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e_cache == 'warm' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-e2e-${{ inputs.e2e_cache_id }}-${{ steps.e2e_cache.outputs.prefix }}${{ github.sha }}
          fail-on-cache-miss: true

      - name: Start E2E compiler cache
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.e2e_cache == 'seed' || inputs.e2e_cache == 'warm') }}
        id: e2e_start
        shell: python
        run: |
          import subprocess

          subprocess.run(["sccache", "--start-server"], check=True)
          subprocess.run(["sccache", "--zero-stats"], check=True)

      - name: Build and Test
        id: sccache_build
        shell: pwsh
        run: |
          python.exe "${{ github.workspace }}\tools\ci_build\build.py" ${{ steps.sccache.outputs.build-flags }} ${{ steps.e2e_cache.outputs.build-flags }} --update --build --config RelWithDebInfo --build_dir "${{ github.workspace }}\build" --skip_submodule_sync --build_csharp --parallel --use_binskim_compliant_compile_flags --cmake_generator "Visual Studio 17 2022" --build_shared_lib --enable_onnx_tests --build_wheel --build_java --build_nodejs --msbuild_extra_options "IncludeMobileTargets=false" --build_nuget --use_vcpkg --use_vcpkg_ms_internal_asset_cache
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Remove-Item "${{ github.workspace }}\build\RelWithDebInfo" -Include "*.obj" -Recurse
        env:
          ALLOW_RELEASED_ONNX_OPSET_ONLY: '0'
          DocUpdateNeeded: 'false'

      - name: Record E2E compiler-cache evidence
        if: ${{ always() && steps.e2e_cache.outcome == 'success' && (inputs.e2e_cache == 'uncached' || steps.e2e_start.outcome == 'success') }}
        id: e2e_evidence
        shell: python
        env:
          EXPERIMENT_MODE: ${{ inputs.e2e_cache }}
          EXPERIMENT_ID: ${{ inputs.e2e_cache_id }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          mode = os.environ["EXPERIMENT_MODE"]
          result = {
              "mode": mode,
              "experiment_id": os.environ["EXPERIMENT_ID"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "runner": os.environ["RUNNER_NAME"],
              "processor_count": os.cpu_count(),
              "image_version": os.environ.get("ImageVersion", ""),
              "msvc": os.environ.get("VCToolsVersion", ""),
          }
          if mode != "uncached":
              result["cache"] = json.loads(subprocess.check_output(
                  ["sccache", "--show-stats", "--stats-format=json"], text=True
              ))
          path = Path(os.environ["RUNNER_TEMP"]) / "sccache-e2e-results.json"
          path.write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          if mode != "uncached":
              stats = result["cache"]["stats"]
              counts = stats["cache_misses" if mode == "seed" else "cache_hits"]["counts"]
              if sum(counts.values()) == 0:
                  raise RuntimeError("Experiment requires cold misses / warm hits")
              expected = "ReadWrite" if mode == "seed" else "ReadOnly"
              if result["cache"]["effective_cache_mode"] != expected:
                  raise RuntimeError(f"Expected {expected} cache mode")

      - name: Finish compiler cache
        if: ${{ always() && (steps.sccache.outcome == 'success' || steps.e2e_start.outcome == 'success') }}
        uses: ./.github/actions/finish-sccache
        with:
          cache-primary-key: ${{ steps.sccache.outputs.cache-primary-key || 'unused-e2e-snapshot' }}
          cache-hit: ${{ steps.sccache.outputs.cache-hit }}
          save: ${{ steps.sccache_build.outcome == 'success' && steps.sccache.outcome == 'success' }}

      - name: Save temporary E2E compiler snapshot
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.e2e_cache == 'seed' && steps.e2e_evidence.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-e2e-${{ inputs.e2e_cache_id }}-${{ steps.e2e_cache.outputs.prefix }}${{ github.sha }}

      - name: Capture E2E compiler-key inputs
        if: ${{ always() && steps.e2e_start.outcome == 'success' && steps.sccache_build.outcome == 'success' }}
        shell: pwsh
        run: |
          python tools\ci_build\diagnose_windows_sccache.py `
            --build-dir "${{ github.workspace }}\build\RelWithDebInfo" `
            --output-dir "${{ runner.temp }}\sccache-key-inputs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        shell: pwsh
        run: |
          python.exe "${{ github.workspace }}\tools\ci_build\build.py" --test --config RelWithDebInfo --build_dir "${{ github.workspace }}\build" --skip_submodule_sync --build_csharp --parallel --use_binskim_compliant_compile_flags --cmake_generator "Visual Studio 17 2022" --build_shared_lib --enable_onnx_tests --build_wheel --build_java --build_nodejs --msbuild_extra_options "IncludeMobileTargets=false" --build_nuget --use_vcpkg --use_vcpkg_ms_internal_asset_cache
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          ALLOW_RELEASED_ONNX_OPSET_ONLY: '0'
          DocUpdateNeeded: 'false'

      - name: Run onnxruntime_provider_test with example_plugin_ep
        shell: pwsh
        run: |
          # Note on skipped tests:
          # The skipped tests are either:
          # - relying on CPU EP fallback for BFloat16 which is not supported
          # - testing the LayerNormalization contrib op with mixed input/output types (only supported by a few EPs)
          # Some other hardcoded EP types are skipped in these tests. For a plugin EP, we skip these tests by
          # specifying them in the dynamic plugin EP configuration.

          $env:ORT_UNIT_TEST_MAIN_DYNAMIC_PLUGIN_EP_CONFIG_JSON = @"
          {
            "ep_library_registration_name": "example_ep",
            "ep_library_path": "./example_plugin_ep.dll",
            "selected_ep_name": "example_ep",
            "tests_to_skip": [
              "LayerNormTest.LayerNorm_BFloat16Input",
              "LayerNormTest.LayerNorm_Scale_Float16Input",
              "LayerNormTest.LayerNorm_Scale_Float16ScaleOutput",
              "LayerNormTest.LayerNorm_Scale_Bias_Float16Input",
              "LayerNormTest.LayerNorm_Scale_Bias_Float16ScaleBiasOutput"
            ]
          }
          "@

          .\onnxruntime_provider_test.exe
        working-directory: ${{ github.workspace }}\build\RelWithDebInfo\RelWithDebInfo

      - name: Validate C# native delegates
        shell: cmd
        run: python tools\ValidateNativeDelegateAttributes.py
        working-directory: ${{ github.workspace }}\\csharp

      - name: Install onnxruntime wheel
        shell: pwsh
        run: |
          python -m pip uninstall -y onnxruntime onnxruntime-gpu onnxruntime-training onnxruntime-directml -qq
          Get-ChildItem -Path dist/*.whl | foreach {pip --disable-pip-version-check install --upgrade $_.fullname}
        working-directory: "${{ github.workspace }}\\build\\RelWithDebInfo\\RelWithDebInfo"

      - name: Publish OperatorKernels.md (Conditional)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && env.DocUpdateNeeded == 'true'
        with:
          name: OperatorKernels.md
          path: ${{ github.workspace }}/docs/OperatorKernels.md

      - name: Publish ContribOperators.md (Conditional)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && env.DocUpdateNeeded == 'true'
        with:
          name: ContribOperators.md
          path: ${{ github.workspace }}/docs/ContribOperators.md

      - name: Benchmark compiler cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_sccache }}
        shell: pwsh
        run: |
          python tools\ci_build\benchmark_windows_sccache.py `
            --build-dir "${{ github.workspace }}\build\RelWithDebInfo" `
            --output-dir "${{ runner.temp }}\sccache-benchmark"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload E2E compiler-cache evidence
        if: ${{ always() && steps.e2e_evidence.outcome != 'skipped' && steps.e2e_cache.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sccache-e2e
          path: |
            ${{ runner.temp }}/sccache-e2e-results.json
            ${{ runner.temp }}/sccache-key-inputs
            ${{ runner.temp }}/sccache-key-debug.log
          if-no-files-found: error

      - name: Upload compiler-cache benchmark results
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.benchmark_sccache }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sccache-benchmark
          path: ${{ runner.temp }}/sccache-benchmark

    env:
      OrtPackageId: Microsoft.ML.OnnxRuntime
      OnnxRuntimeBuildDirectory: ${{ github.workspace }}\build
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
