name: Linux CUDA CI

on:
  push:
    branches: [main, 'rel-*']
  # Use the base branch's workflow definition so a fork cannot remove the runner admission checks.
  pull_request_target:
    branches: [main, 'rel-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-source:
    name: Select source revision
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Select immutable source revision
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          source_sha="$EVENT_SHA"
          if [[ "$EVENT_NAME" == "pull_request_target" && "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
            source_sha="$HEAD_SHA"
          fi

          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The triggering event does not contain an immutable source revision."
            exit 1
          fi

          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

  build-linux-cuda-x64-release:
    name: Build Linux CUDA x64 Release
    needs: prepare-source
    # This condition is evaluated from the trusted base-branch workflow on pull_request_target.
    if: >-
      needs.prepare-source.result == 'success' &&
      (github.event_name != 'pull_request_target' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    # This job runs on a CPU node using the reusable build workflow
    uses: ./.github/workflows/reusable_linux_build.yml
    with:
      pool_name: "onnxruntime-github-Ubuntu2204-AMD-CPU" # Build pool
      build_config: Release
      architecture: x64
      dockerfile_path: tools/ci_build/github/linux/docker/Dockerfile.manylinux2_28_cuda
      docker_build_args: '--build-arg BASEIMAGE=onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cuda13_x64_almalinux8_gcc14:20251107.1'
      docker_image_repo: onnxruntimecuda13manylinuxbuild
      extra_build_flags: >-
        --use_binskim_compliant_compile_flags
        --build_wheel
        --parallel
        --build_java
        --nvcc_threads 4
        --flash_nvcc_threads 4
        --cuda_version=13.0
        --cuda_home=/usr/local/cuda-13.0
        --cudnn_home=/usr/local/cuda-13.0
        --enable_cuda_profiling
        --cmake_extra_defines CMAKE_CUDA_ARCHITECTURES=86
        --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=ON
        --cmake_extra_defines onnxruntime_ENABLE_CUDA_EP_INTERNAL_TESTS=ON
        --cmake_extra_defines onnxruntime_BUILD_CUDA_QUANT_PREPROCESS=ON
      python_path_prefix: 'PATH=/opt/python/cp310-cp310/bin:$PATH'
      run_tests: false            # <<< Do not run tests in this job
      upload_build_output: true   # <<< Upload the build/Release directory
      execution_providers: 'cuda'
      job_identifier: build-linux-cuda-x64-release
      checkout_ref: ${{ needs.prepare-source.outputs.source_sha }}
      push_docker_image: ${{ github.event_name != 'pull_request_target' }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Pass token for reusable workflow needs (e.g., docker build action)

  test-linux-cuda-x64-release:
    name: Test Linux CUDA x64 Release
    if: >-
      needs.prepare-source.result == 'success' &&
      needs.build-linux-cuda-x64-release.result == 'success' &&
      (github.event_name != 'pull_request_target' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - prepare-source
      - build-linux-cuda-x64-release
    runs-on:
      - self-hosted
      - "1ES.Pool=onnxruntime-github-linux-a10"
      - "JobId=test-linux-cuda-x64-release-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
    timeout-minutes: 210
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare-source.outputs.source_sha }}

      - uses: microsoft/onnxruntime-github-actions/build-docker-image@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        id: build_docker_image_step
        with:
          dockerfile: ${{ github.workspace }}/tools/ci_build/github/linux/docker/Dockerfile.manylinux2_28_cuda
          image-name: ghcr.io/microsoft/onnxruntime/onnxruntimecuda13manylinuxbuild
          build-args: '--build-arg BASEIMAGE=onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cuda13_x64_almalinux8_gcc14:20251107.1'
          push: ${{ github.event_name != 'pull_request_target' }}
          azure-container-registry-name: onnxruntimebuildcache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Pass token to action

      # --- Download Build Artifact to Runner Temp Directory ---
      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output-x64-Release # Must match the upload name
          path: ${{ runner.temp }}/Release # Download contents into temp dir structure

      # --- Restore Permissions in the Temp Directory ---
      - name: Restore Executable Permissions
        if: success() # Only run if download succeeded
        working-directory: ${{ runner.temp }}/Release
        run: |
          if [ -f perms.txt ]; then
            echo "Restoring executable permissions in ${{ runner.temp }}/Release ..."
            while IFS= read -r file; do
              # Check relative path existence within the current directory
              if [ -f "$file" ]; then
                chmod +x "$file"
              else
                echo "Warning: File '$file' listed in perms.txt not found."
              fi
            done < perms.txt
            echo "Permissions restored."
          else
            echo "Warning: perms.txt not found in artifact."
          fi

      # Verify the GPU is accessible inside Docker before running the full test suite.
      # If the NVIDIA Container Toolkit fails to expose /dev/nvidia* devices,
      # tests will fail with "CUDA failure 100" and waste 10+ minutes.
      - name: Verify GPU access in Docker
        run: |
          docker run --rm --gpus all \
            "${{ steps.build_docker_image_step.outputs.full-image-name }}" \
            nvidia-smi

      # --- Run Tests using the downloaded build ---
      # The run-build-script-in-docker action mounts ${{ runner.temp }} to /onnxruntime_src/build
      # So build.py --build_dir build/Release inside the container correctly finds the artifacts.
      - name: Test ONNX Runtime
        id: test_step
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: Release
          mode: 'test' # Set mode to test
          execution_providers: 'cuda'
          extra_build_flags: >-
            --enable_pybind
            --use_binskim_compliant_compile_flags
            --cuda_version=13.0
            --cuda_home=/usr/local/cuda-13.0
            --cudnn_home=/usr/local/cuda-13.0
            --enable_cuda_profiling
            --cmake_extra_defines CMAKE_CUDA_ARCHITECTURES=86
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=ON
            --cmake_extra_defines onnxruntime_QUICK_BUILD=ON
            --cmake_extra_defines onnxruntime_ENABLE_CUDA_EP_INTERNAL_TESTS=ON
            --cmake_extra_defines onnxruntime_BUILD_CUDA_QUANT_PREPROCESS=ON
          python_path_prefix: 'export ORT_RUN_CUDA_TACTIC_CACHE_TESTS=1 PATH=/opt/python/cp310-cp310/bin:$PATH'
