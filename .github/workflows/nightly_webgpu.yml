name: Nightly ONNX Runtime WebGPU Builds

on:
  schedule:
  - cron: '0 9 * * *'  # Daily at 09:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webgpu_build:
    runs-on: [
      "self-hosted",
      "1ES.Pool=onnxruntime-github-vs2022-latest",
      "JobId=webgpu_build-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
      ]
    timeout-minutes: 60
    env:
      ALLOW_RELEASED_ONNX_OPSET_ONLY: "0"
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: none

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"
        architecture: x64

    - name: Locate vcvarsall and Setup Env
      uses: ./.github/actions/locate-vcvarsall-and-setup-env
      with:
        architecture: x64

    - name: Setup VCPKG Cache
      uses: ./.github/actions/setup-vcpkg-cache
      with:
        key: windows-x64-webgpu-relwithdebinfo
        path: ${{ runner.temp }}\vcpkg-binary-cache

    - name: Install python modules
      run: python -m pip install -r tools\ci_build\github\windows\python\requirements.txt
      shell: cmd
      working-directory: ${{ github.workspace }}

    - name: Build
      shell: pwsh
      run: |
        python.exe ${{ github.workspace }}\tools\ci_build\build.py `
          --config RelWithDebInfo `
          --build_dir ${{ github.workspace }} `
          --skip_submodule_sync `
          --use_binskim_compliant_compile_flags `
          --cmake_generator "Visual Studio 17 2022" `
          --build_shared_lib `
          --use_webgpu `
          --wgsl_template static `
          --use_vcpkg --use_vcpkg_ms_internal_asset_cache `
          --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=ON onnxruntime_BUILD_DAWN_SHARED_LIBRARY=ON `
          --update `
          --build --parallel
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: webgpu-nightly-build
        path: |
          ${{ github.workspace }}\RelWithDebInfo
          !${{ github.workspace }}\RelWithDebInfo\_deps\**
          !${{ github.workspace }}\RelWithDebInfo\**\*.obj
          !${{ github.workspace }}\RelWithDebInfo\**\*.pch
          !${{ github.workspace }}\RelWithDebInfo\**\*.lib
        if-no-files-found: error

  webgpu_shader_key_validation:
    needs: webgpu_build
    runs-on: [
      "self-hosted",
      "1ES.Pool=onnxruntime-github-Win2022-GPU-A10",
      "JobId=webgpu_shader_validation-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
      ]
    timeout-minutes: 30
    env:
      ALLOW_RELEASED_ONNX_OPSET_ONLY: "0"
      ONNXRUNTIME_TEST_GPU_DEVICE_ID: "0"
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        submodules: none

    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"
        architecture: x64

    - name: Locate vcvarsall and Setup Env
      uses: ./.github/actions/locate-vcvarsall-and-setup-env
      with:
        architecture: x64

    - name: Install python modules
      run: python -m pip install -r tools\ci_build\github\windows\python\requirements.txt
      shell: cmd
      working-directory: ${{ github.workspace }}

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"

    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: webgpu-nightly-build
        path: ${{ github.workspace }}\RelWithDebInfo

    - name: Verify GPU access
      shell: pwsh
      run: nvidia-smi

    - name: Run tests
      shell: pwsh
      run: |
        python.exe ${{ github.workspace }}\tools\python\update_ctest_path.py `
          "${{ github.workspace }}\RelWithDebInfo\CTestTestfile.cmake" `
          "${{ github.workspace }}\RelWithDebInfo"
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

        $env:ORT_WEBGPU_EP_SHADER_DUMP_FILE = "${{ github.workspace }}\RelWithDebInfo\RelWithDebInfo\shader_dump.log"

        python.exe ${{ github.workspace }}\tools\ci_build\build.py `
          --config RelWithDebInfo `
          --build_dir ${{ github.workspace }} `
          --test `
          --test_parallel 0
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: Check log file
      shell: cmd
      run: |
        dir ${{ github.workspace }}\RelWithDebInfo\RelWithDebInfo\shader_dump.log

    - name: Validate shader keys
      uses: ./.github/actions/webgpu-validate-shader-key
      with:
        log_file_path: ${{ github.workspace }}\RelWithDebInfo\RelWithDebInfo\shader_dump.log

    - name: Upload shader dump log
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: shader-dump-log
        path: ${{ github.workspace }}\RelWithDebInfo\RelWithDebInfo\shader_dump.log
        if-no-files-found: warn
