name: QMoE Packed Reference Tests

on:
  push:
    branches:
      - main
      - rel-*
    paths:
      - .github/workflows/qmoe_packed_reference.yml
      - onnxruntime/test/python/quantization/qmoe_packed_reference/**
  pull_request:
    paths:
      - .github/workflows/qmoe_packed_reference.yml
      - onnxruntime/test/python/quantization/qmoe_packed_reference/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qmoe-packed-reference-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install numpy onnx pytest ml_dtypes
      - name: Run packed reference tests
        working-directory: onnxruntime/test/python/quantization/qmoe_packed_reference
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider --rootdir=. --confcutdir=. test_reference.py
