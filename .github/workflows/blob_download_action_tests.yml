name: Blob Download Action Tests

on:
  pull_request:
    paths:
      - '.github/actions/download-azure-blob/**'
      - '.github/workflows/blob_download_action_tests.yml'
      - '.github/workflows/windows_cuda*.yml'
      - '.github/workflows/windows_gpu_doc_gen.yml'
      - '.github/workflows/windows_tensorrt.yml'
      - 'tools/ci_build/test_download_azure_blob.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Run offline action tests
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools\ci_build -p test_download_azure_blob.py -v
