name: ONNX Runtime WebGPU Builds

on:
  push:
    branches:
      - main
      - rel-*
      - plugin-ep-webgpu/rel-*
  pull_request:
    branches:
      - main
      - rel-*
      - plugin-ep-webgpu/rel-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  webgpu_build_x64_RelWithDebInfo:
    runs-on: [
      "self-hosted",
      "1ES.Pool=onnxruntime-github-Win2022-GPU-A10",
      "JobId=webgpu_build_x64_RelWithDebInfo-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}-${{ matrix.vcpkg_option }}-${{ matrix.wgsl_template }}"
      ]
    timeout-minutes: 300
    strategy:
      matrix:
        vcpkg_option: [novcpkg, vcpkg]
        wgsl_template: [static]
    env:
      OrtPackageId: Microsoft.ML.OnnxRuntime
      OnnxRuntimeBuildDirectory: ${{ github.workspace }}
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      setVcvars: true
      ALLOW_RELEASED_ONNX_OPSET_ONLY: "0"
      DocUpdateNeeded: false
      NVIDIA_TF32_OVERRIDE: "0"
      ONNXRUNTIME_TEST_GPU_DEVICE_ID: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          submodules: none

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Locate vcvarsall and Setup Env
        uses: ./.github/actions/locate-vcvarsall-and-setup-env
        with:
          architecture: x64

      - name: Install Visual Studio Spectre-mitigated libs
        uses: ./.github/actions/install-vs-spectre-libs
        with:
          architecture: x64

      - name: Install python modules
        run: python -m pip install -r tools\ci_build\github\windows\python\requirements.txt
        shell: cmd
        working-directory: ${{ github.workspace }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.x"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"
          architecture: x64

      - name: API Documentation Check and generate
        run: |
          set ORT_DOXY_SRC=${{ github.workspace }}
          set ORT_DOXY_OUT=${{ github.workspace }}\RelWithDebInfo\RelWithDebInfo
          mkdir %ORT_DOXY_SRC%
          mkdir %ORT_DOXY_OUT%
          "C:\Program Files\doxygen\bin\doxygen.exe" ${{ github.workspace }}\tools\ci_build\github\Doxyfile_csharp.cfg
        shell: cmd
        working-directory: ${{ github.workspace }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        env:
          PROCESSOR_ARCHITECTURE: x64
        with:
          dotnet-version: "8.x"

      - name: Use Nuget 6.x
        uses: nuget/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2.0.2
        with:
          nuget-version: "6.x"

      - name: NuGet restore
        run: |
          nuget restore packages.config -ConfigFile NuGet.config -PackagesDirectory ${{ github.workspace }}\RelWithDebInfo
        shell: cmd
        working-directory: ${{ github.workspace }}

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: onnx-node-tests-cache
        with:
          path: ${{ github.workspace }}/js/test/
          key: onnxnodetests-${{ hashFiles('js/scripts/prepare-onnx-node-tests.ts') }}

      - name: Build and Test
        shell: pwsh
        run: |
          python.exe ${{ github.workspace }}\tools\ci_build\build.py `
            --config RelWithDebInfo `
            --build_dir ${{ github.workspace }} `
            --skip_submodule_sync `
            --build_csharp `
            --parallel `
            --use_binskim_compliant_compile_flags `
            --cmake_generator "Visual Studio 17 2022" `
            --build_shared_lib `
            --enable_onnx_tests `
            --build_nodejs `
            --build_java `
            --use_webgpu `
            --wgsl_template ${{ matrix.wgsl_template }} `
            ${{ matrix.vcpkg_option == 'vcpkg' && '--use_vcpkg --use_vcpkg_ms_internal_asset_cache' || '' }} `
            --cmake_extra_defines `
            onnxruntime_BUILD_UNIT_TESTS=ON `
            onnxruntime_BUILD_DAWN_SHARED_LIBRARY=ON
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }
          Remove-Item "${{ github.workspace }}\RelWithDebInfo" -Include "*.obj" -Recurse

      # SplitKConfig only enables Split-K on Intel adapters, so the run above takes the non-Split-K
      # path on this pool. Rerun the Split-K tests with the override on, and confirm from the shader
      # dump that the reduction dispatched: the tests pass either way, so running them is not by
      # itself evidence that they exercised Split-K.
      - name: Run Split-K tests with the path forced on
        shell: pwsh
        working-directory: ${{ github.workspace }}\RelWithDebInfo\RelWithDebInfo
        env:
          ORT_WEBGPU_SPLIT_K: "on"
        run: |
          $dump = Join-Path $PWD "splitk_shader_dump.log"
          # The dump is opened in append mode, so a stale file would be a false positive.
          Remove-Item $dump -ErrorAction SilentlyContinue
          $env:ORT_WEBGPU_EP_SHADER_DUMP_FILE = $dump
          .\onnxruntime_provider_test.exe "--gtest_filter=MatMul_SplitK.*:Gemm_SplitK.*"
          if ($LASTEXITCODE -ne 0) {
            throw "Split-K tests failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path $dump) -or
              -not (Select-String -Path $dump -Pattern 'MatMul_Split_K_Reduce' -SimpleMatch -Quiet)) {
            throw "MatMul_Split_K_Reduce never dispatched, so the tests did not exercise Split-K."
          }
          # The activation tests pass whichever path they take, so assert a fused activation reached
          # the reduction rather than the convolutions falling back to the non-Split-K path.
          if (-not (Select-String -Path $dump -Pattern 'MatMul_Split_K_Reduce\[[^\]]*ActivationKind: [1-9]' -Quiet)) {
            throw "No fused activation reached the Split-K reduction."
          }

      - name: Validate C# native delegates
        run: python tools\ValidateNativeDelegateAttributes.py
        shell: cmd
        working-directory: ${{ github.workspace }}\csharp
        continue-on-error: true

  webgpu_plugin_build_x64_RelWithDebInfo:
    runs-on: [
      "self-hosted",
      "1ES.Pool=onnxruntime-github-Win2022-GPU-A10",
      "JobId=webgpu_plugin_build_x64_RelWithDebInfo-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
      ]
    timeout-minutes: 300
    env:
      OnnxRuntimeBuildDirectory: ${{ github.workspace }}
      setVcvars: true
      ALLOW_RELEASED_ONNX_OPSET_ONLY: "0"
      DocUpdateNeeded: false
      NVIDIA_TF32_OVERRIDE: "0"
      ONNXRUNTIME_TEST_GPU_DEVICE_ID: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          submodules: none

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Locate vcvarsall and Setup Env
        uses: ./.github/actions/locate-vcvarsall-and-setup-env
        with:
          architecture: x64

      - name: Install Visual Studio Spectre-mitigated libs
        uses: ./.github/actions/install-vs-spectre-libs
        with:
          architecture: x64

      - name: Install python modules
        run: python -m pip install -r tools\ci_build\github\windows\python\requirements.txt
        shell: cmd
        working-directory: ${{ github.workspace }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.x"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: onnx-node-tests-cache
        with:
          path: ${{ github.workspace }}/js/test/
          key: onnxnodetests-${{ hashFiles('js/scripts/prepare-onnx-node-tests.ts') }}

      - name: Build and Test
        shell: pwsh
        run: |
          python.exe ${{ github.workspace }}\tools\ci_build\build.py `
            --config RelWithDebInfo `
            --build_dir ${{ github.workspace }} `
            --skip_submodule_sync `
            --parallel `
            --use_binskim_compliant_compile_flags `
            --cmake_generator "Visual Studio 17 2022" `
            --enable_onnx_tests `
            --use_webgpu shared_lib `
            --use_vcpkg --use_vcpkg_ms_internal_asset_cache `
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=ON onnxruntime_ENABLE_DAWN_BACKEND_D3D12=1 onnxruntime_ENABLE_DAWN_BACKEND_VULKAN=1 `
            --disable_rtti `
            --enable_lto

          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }

      - name: Publish artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webgpu-plugin-binaries
          path: |
            ${{ github.workspace }}/RelWithDebInfo/RelWithDebInfo/onnxruntime_providers_webgpu.dll
            ${{ github.workspace }}/RelWithDebInfo/RelWithDebInfo/onnxruntime_providers_webgpu.pdb
            ${{ github.workspace }}/RelWithDebInfo/RelWithDebInfo/dxcompiler.dll
            ${{ github.workspace }}/RelWithDebInfo/RelWithDebInfo/dxil.dll

  webgpu_external_dawn_build_x64_RelWithDebInfo:
    runs-on: [
        "self-hosted",
        "1ES.Pool=onnxruntime-github-Win2022-GPU-A10",
        "JobId=webgpu_external_dawn_build_x64_RelWithDebInfo-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
      ]
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          submodules: none

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Locate vcvarsall and Setup Env
        uses: ./.github/actions/locate-vcvarsall-and-setup-env
        with:
          architecture: x64

      - name: Install Visual Studio Spectre-mitigated libs
        uses: ./.github/actions/install-vs-spectre-libs
        with:
          architecture: x64

      - name: Install python modules
        run: python -m pip install -r tools\ci_build\github\windows\python\requirements.txt
        shell: cmd
        working-directory: ${{ github.workspace }}

      - name: Generate onnxruntime.sln
        shell: pwsh
        run: |
          python.exe ${{ github.workspace }}\tools\ci_build\build.py --config RelWithDebInfo --build_dir ${{ github.workspace }} --skip_submodule_sync --update --parallel --cmake_generator "Visual Studio 17 2022" --use_webgpu --use_external_dawn --skip_tests --target onnxruntime_webgpu_external_dawn_test

      - name: Build
        shell: pwsh
        run: |
          python.exe ${{ github.workspace }}\tools\ci_build\build.py --config RelWithDebInfo --build_dir ${{ github.workspace }} --skip_submodule_sync --build --parallel --cmake_generator "Visual Studio 17 2022" --use_webgpu --use_external_dawn --skip_tests --target onnxruntime_webgpu_external_dawn_test

      - name: Run tests (onnxruntime_webgpu_external_dawn_test)
        run: onnxruntime_webgpu_external_dawn_test.exe
        shell: cmd
        working-directory: ${{ github.workspace }}\RelWithDebInfo\RelWithDebInfo

      - name: Run tests (onnxruntime_webgpu_external_dawn_test) - no_proc_table
        run: onnxruntime_webgpu_external_dawn_test.exe --no_proc_table
        shell: cmd
        working-directory: ${{ github.workspace }}\RelWithDebInfo\RelWithDebInfo

  webgpu_minimal_build_edge_build_x64_RelWithDebInfo:
    runs-on: [
        "self-hosted",
        "1ES.Pool=onnxruntime-github-Win2022-GPU-A10",
        "JobId=webgpu_minimal_build_edge_build_x64_RelWithDebInfo-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
        ]
    timeout-minutes: 300
    env:
      OrtPackageId: Microsoft.ML.OnnxRuntime
      OnnxRuntimeBuildDirectory: ${{ github.workspace }}
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      ALLOW_RELEASED_ONNX_OPSET_ONLY: "0"
      DocUpdateNeeded: false
      ONNXRUNTIME_TEST_GPU_DEVICE_ID: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          submodules: none

      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Locate vcvarsall and Setup Env
        uses: ./.github/actions/locate-vcvarsall-and-setup-env
        with:
          architecture: x64

      - name: Install Visual Studio Spectre-mitigated libs
        uses: ./.github/actions/install-vs-spectre-libs
        with:
          architecture: x64

      - name: Install python modules
        run: python -m pip install -r tools\ci_build\github\windows\python\requirements.txt
        shell: cmd
        working-directory: ${{ github.workspace }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20.x"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: "temurin"
          java-version: "17"
          architecture: x64

      - name: API Documentation Check and generate
        run: |
          set ORT_DOXY_SRC=${{ github.workspace }}
          set ORT_DOXY_OUT=${{ github.workspace }}\RelWithDebInfo\RelWithDebInfo
          mkdir %ORT_DOXY_SRC%
          mkdir %ORT_DOXY_OUT%
          "C:\Program Files\doxygen\bin\doxygen.exe" ${{ github.workspace }}\tools\ci_build\github\Doxyfile_csharp.cfg
        shell: cmd
        working-directory: ${{ github.workspace }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        env:
          PROCESSOR_ARCHITECTURE: x64
        with:
          dotnet-version: "8.x"

      - name: Use Nuget 6.x
        uses: nuget/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2.0.2
        with:
          nuget-version: "6.x"

      - name: NuGet restore
        run: |
          nuget restore packages.config -ConfigFile NuGet.config -PackagesDirectory ${{ github.workspace }}\RelWithDebInfo
        shell: cmd
        working-directory: ${{ github.workspace }}

      - name: Build
        shell: pwsh
        run: |
          python.exe ${{ github.workspace }}\tools\ci_build\build.py --config RelWithDebInfo --build_dir ${{ github.workspace }} --skip_submodule_sync --build_csharp --parallel  --use_binskim_compliant_compile_flags --cmake_generator "Visual Studio 17 2022" --build_shared_lib --update --build --build_shared_lib --disable_exceptions --disable_rtti --enable_msvc_static_runtime --enable_reduced_operator_type_support --skip_tests --use_binskim_compliant_compile_flags --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF onnxruntime_DISABLE_SPARSE_TENSORS=ON onnxruntime_DISABLE_OPTIONAL_TYPE=ON --minimal_build extended --use_webgpu
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }
          Remove-Item "${{ github.workspace }}\RelWithDebInfo" -Include "*.obj" -Recurse

      - name: Validate C# native delegates
        run: python tools\ValidateNativeDelegateAttributes.py
        shell: cmd
        working-directory: ${{ github.workspace }}\csharp
