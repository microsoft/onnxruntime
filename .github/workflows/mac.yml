name: ACES GitHub pool smoke test

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3]
    runs-on:
      - self-hosted
      - 1ES.Pool=AcesSharedGitHubTrial
    timeout-minutes: 10
    steps:
      - name: Verify macOS ARM64 and Xcode
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          printf 'Runner: %s\n' "$RUNNER_NAME"
          sw_vers
          xcodebuild -version
          xcrun --find clang
          xcrun --find swift
          sleep 60
