name: "MacOS CI Pipeline"

on:
  push:
    branches:
      - main
      - rel-*
      - plugin-ep-webgpu/rel-*
  pull_request:
    branches:
      - main
      - rel-*
      - plugin-ep-webgpu/rel-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  python_version: "3.14"

jobs:
  cpu:
    uses: ./.github/workflows/macos-ci-build-and-test-workflow.yml
    with:
      # Only build arm64 for CPU
      # Also run a Release build on Xcode 16 for legacy-toolchain coverage.
      matrix_include: >-
        [
          {"machine": "arm64", "target": "arm64", "build_config": "Debug"},
          {"machine": "arm64", "target": "arm64", "build_config": "Release"},
          {"machine": "arm64", "target": "arm64", "build_config": "Release", "xcode_version": "16"}
        ]
      python_version: "3.14"

  coreml:
    uses: ./.github/workflows/macos-ci-build-and-test-workflow.yml
    with:
      use_coreml: true
      matrix_include: >-
        [
          {"machine": "arm64", "target": "x86_64", "build_config": "Release"},
          {"machine": "arm64", "target": "arm64", "build_config": "Debug"},
          {"machine": "arm64", "target": "arm64", "build_config": "Release"}
        ]
      python_version: "3.14"

  xnnpack:
    uses: ./.github/workflows/macos-ci-build-and-test-workflow.yml
    with:
      use_xnnpack: true
      # only build arm64/Debug for XNNPack
      matrix_include: >-
        [
          {"machine": "arm64", "target": "arm64", "build_config": "Debug"}
        ]
      python_version: "3.14"

  webgpu:
    uses: ./.github/workflows/macos-ci-build-and-test-workflow.yml
    with:
      use_webgpu: true
      matrix_include: >-
        [
          {"machine": "arm64", "target": "x86_64", "build_config": "Release"},
          {"machine": "arm64", "target": "arm64", "build_config": "Debug"},
          {"machine": "arm64", "target": "arm64", "build_config": "Release"}
        ]
      python_version: "3.14"

  iphone_simulator:
    runs-on: macos-15

    env:
      xcode_version: 26.3
      simulator_runtime_version: 26.2

    strategy:
      matrix:
        target_arch: [x86_64, arm64]

    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-tools

      - name: macOS CI pipeline prepare steps
        uses: ./.github/actions/macos-ci-setup
        with:
          platform_machine: "arm64"
          python_version: ${{ env.python_version }}
          xcode_version: ${{ env.xcode_version }}

      - name: Build for iphonesimulator ${{ matrix.target_arch }}
        shell: bash
        run: |
          python ./tools/ci_build/build.py \
            --build_dir ./build \
            --update \
            --build --parallel \
            --test \
            --build_apple_framework \
            --use_xcode \
            --use_coreml \
            --use_xnnpack \
            --use_binskim_compliant_compile_flags \
            --ios \
            --apple_deploy_target=15.1 \
            --apple_sysroot=iphonesimulator \
            --osx_arch=${{ matrix.target_arch }}
        env:
          ORT_GET_SIMULATOR_DEVICE_INFO_REQUESTED_RUNTIME_VERSION: ${{ env.simulator_runtime_version }}

  Objective-C-StaticAnalysis:
    runs-on: macos-15

    env:
      xcode_version: 26.3

    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build-tools

      - name: macOS CI pipeline prepare steps
        uses: ./.github/actions/macos-ci-setup
        with:
          platform_machine: "arm64"
          python_version: ${{ env.python_version }}
          xcode_version: ${{ env.xcode_version }}

      - name: Generate compile_commands.json and ONNX protobuf files
        shell: bash
        run: |
          python ./tools/ci_build/build.py \
            --build_dir ./build \
            --cmake_generator "Unix Makefiles" \
            --config Debug \
            --build_shared_lib \
            --use_coreml \
            --build_objc \
            --cmake_extra_defines CMAKE_EXPORT_COMPILE_COMMANDS=ON \
            --use_binskim_compliant_compile_flags \
            --update \
            --build --parallel \
            --target onnx_proto

      - name: Analyze Objective-C/C++ source code
        shell: bash
        run: |
          CLANG_TIDY_CHECKS="-*,clang-analyzer-*"

          # Match the inference-only Objective-C sources selected by CMake.
          OBJC_SOURCES=()
          for source in ./objectivec/*.mm; do
            case "$source" in
              ./objectivec/ort_checkpoint.mm|./objectivec/ort_training_session.mm) continue ;;
            esac
            OBJC_SOURCES+=("$source")
          done

          "$(brew --prefix llvm@18)/bin/clang-tidy" \
            -p=./build/Debug \
            --checks="${CLANG_TIDY_CHECKS}" \
            --warnings-as-errors="${CLANG_TIDY_CHECKS}" \
            --header-filter="objectivec/include|objectivec|onnxruntime/core" \
            "${OBJC_SOURCES[@]}" \
            ./onnxruntime/core/platform/apple/logging/apple_log_sink.mm \
            ./onnxruntime/core/providers/coreml/model/*.mm
