name: VALIDATION-ONLY MatMulNBits M1 A10 Perf (throwaway, for onnxruntime#31988)

# VALIDATION-ONLY: this workflow exists solely to gather real A10-hardware head-vs-base
# performance evidence for #31988 (nxrt/cuda-matmulnbits-sm-cols). It is a narrowly-scoped
# copy of windows_cuda.yml -- same pools, same build config -- with additional steps after
# the normal ctest "Run Tests" step: they generate small single-node MatMulNBits (M=1)
# ONNX models and drive them through the already-built onnxruntime_perf_test.exe tool,
# toggling the validation-only ORT_MATMULNBITS_M1_PERF_VALIDATION_FORCE_COLS_PER_BLOCK env
# var between unset ("head", the PR's occupancy-driven selection) and 8 ("base", the pre-PR
# unconditional cols_per_block==8), to get a confound-free A/B on the same binary/GPU. See
# tools/matmulnbits_m1_perf_validation/{gen_models,numerics_check,run_ab_sweep}.py. (An
# earlier iteration of this branch tried to piggyback new gtest cases onto the
# onnxruntime_providers_cuda_ut module used by #31988's own SelectColsPerBlock_*/
# ChooseColsPerBlockFromOccupancy_* unit tests; CI logs showed that module is never
# loaded/executed by ctest in this non-plugin pipeline, so that approach produced no data
# and was replaced by this one.)
#
# That session-level (onnxruntime_perf_test "Latency") signal turned out to be
# noise-dominated: head vs base A/B geomean (1.006) was statistically indistinguishable from
# the wide-n structural A/A controls' own run-to-run spread. A further step,
# run_kernel_ab_bench.py, goes one level deeper: a new validation-only hook in
# matmul_4bits_m1_impl.cuh (ORT_MATMULNBITS_M1_KERNEL_AB_BENCH=1) times *only* the kernel
# launch with CUDA events and interleaves cols_per_block arms within a single process,
# self-reporting per-shape/per-arm percentiles to stderr. See that script's module docstring
# for full methodology (numerics sanity check, A/A + wide-n structural controls, clock-rate
# drift snapshot).
#
# This file lives only on a throwaway validation branch/PR that will be closed, not merged,
# once the evidence has been folded into #31988's PR body.

on:
  pull_request:
    branches:
      - main
      - rel-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

#TODO: enable  --build_nodejs
jobs:
  build:
    name: Windows GPU CUDA CI Pipeline (perf validation)
    runs-on: [
        "self-hosted",
        "1ES.Pool=onnxruntime-github-vs2022-latest",
        "JobId=windows-cuda-perfval-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
        ]
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'none'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64

      - name: Locate vcvarsall and Setup Env
        uses: ./.github/actions/locate-vcvarsall-and-setup-env
        with:
          architecture: x64

      - name: Install Visual Studio Spectre-mitigated libs
        uses: ./.github/actions/install-vs-spectre-libs
        with:
          architecture: x64

      - name: Install python modules
        run: python -m pip install -r .\tools\ci_build\github\windows\python\requirements.txt
        working-directory: ${{ github.workspace }}
        shell: cmd

      - name: Download CUDA SDK v12.8
        working-directory: ${{ runner.temp }}
        run: |
          azcopy.exe cp --recursive "https://lotusscus.blob.core.windows.net/models/cuda_sdk/v12.8" .
          dir
        shell: pwsh

      - name: Add CUDA to PATH
        shell: powershell
        run: |
          Write-Host "Adding CUDA to PATH"
          Write-Host "CUDA Path: $env:RUNNER_TEMP\v12.8\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\v12.8\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\v12.8\extras\CUPTI\lib64"

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: x64

      - uses: actions/cache@v5
        id: onnx-node-tests-cache
        with:
          path: ${{ github.workspace }}/js/test/
          key: onnxnodetests-${{ hashFiles('js/scripts/prepare-onnx-node-tests.ts') }}

      - name: API Documentation Check and generate
        run: |
          set ORT_DOXY_SRC=${{ github.workspace }}
          set ORT_DOXY_OUT=${{ runner.temp }}\build\RelWithDebInfo\RelWithDebInfo
          mkdir %ORT_DOXY_SRC%
          mkdir %ORT_DOXY_OUT%
          "C:\Program Files\doxygen\bin\doxygen.exe" ${{ github.workspace }}\tools\ci_build\github\Doxyfile_csharp.cfg
        working-directory: ${{ github.workspace }}
        shell: cmd

      - uses: actions/setup-dotnet@v5
        env:
          PROCESSOR_ARCHITECTURE: x64
        with:
          dotnet-version: '8.x'

      - name: Use Nuget 6.x
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: '6.x'

      - name: NuGet restore
        run: nuget restore ${{ github.workspace }}\packages.config -ConfigFile ${{ github.workspace }}\NuGet.config -PackagesDirectory ${{ runner.temp }}\build\RelWithDebInfo
        shell: cmd

      - name: Set OnnxRuntimeBuildDirectory
        shell: pwsh
        run: |
          $buildDir = Join-Path ${{ runner.temp }} "build"
          echo "OnnxRuntimeBuildDirectory=$buildDir" >> $env:GITHUB_ENV

      - name: Build and Clean Binaries
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g typescript
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }
          # Execute the build process
          python.exe ${{ github.workspace }}\tools\ci_build\build.py --update --build --config RelWithDebInfo --build_dir build --skip_submodule_sync --build_csharp --parallel --nvcc_threads 4 --flash_nvcc_threads 4 --use_binskim_compliant_compile_flags --cmake_generator "Visual Studio 17 2022" --build_shared_lib --build_wheel --build_java --use_cuda --cuda_home="$env:RUNNER_TEMP\v12.8" --enable_cuda_profiling --use_vcpkg --use_vcpkg_ms_internal_asset_cache --enable_transformers_tool_test --cmake_extra_defines onnxruntime_QUICK_BUILD=ON --cmake_extra_defines CMAKE_CUDA_ARCHITECTURES=86 --cmake_extra_defines onnxruntime_ENABLE_CUDA_EP_INTERNAL_TESTS=ON
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }

          # Clean up the output directory before uploading artifacts
          $outputDir = "${{ runner.temp }}\build\RelWithDebInfo"
          Write-Host "Cleaning up files from $outputDir..."

          Remove-Item -Path "$outputDir\onnxruntime" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$outputDir\pybind11" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$outputDir\models" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$outputDir\vcpkg_installed" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$outputDir\_deps" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$outputDir\CMakeCache.txt" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$outputDir\CMakeFiles" -Recurse -Force -ErrorAction SilentlyContinue
          # Remove intermediate object files as in the original script
          Remove-Item -Path $outputDir -Include "*.obj" -Recurse
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: ${{ runner.temp }}\build
    env:
      OrtPackageId: Microsoft.ML.OnnxRuntime.Gpu
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      setVcvars: true
      ALLOW_RELEASED_ONNX_OPSET_ONLY: '0'
      DocUpdateNeeded: false
      ONNXRUNTIME_TEST_GPU_DEVICE_ID: '0'
      AZCOPY_AUTO_LOGIN_TYPE: MSI
      AZCOPY_MSI_CLIENT_ID: d712a4c7-a0cf-4e87-af75-31510eba0a8e

  test:
    name: Windows GPU CUDA CI Pipeline Test Job (perf validation)
    needs: build
    timeout-minutes: 300
    runs-on: [
      "self-hosted",
      "1ES.Pool=onnxruntime-github-Win2022-GPU-A10",
      "JobId=windows-cuda-test-perfval-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
    ]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'none'

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: ${{ runner.temp }}\build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: x64

      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: x64

      - name: Locate vcvarsall and Setup Env
        uses: ./.github/actions/locate-vcvarsall-and-setup-env
        with:
          architecture: x64

      - name: Install Visual Studio Spectre-mitigated libs
        uses: ./.github/actions/install-vs-spectre-libs
        with:
          architecture: x64

      - name: Install python modules
        run: python -m pip install -r .\tools\ci_build\github\windows\python\requirements.txt
        working-directory: ${{ github.workspace }}
        shell: cmd

      - name: Download CUDA SDK v12.8
        working-directory: ${{ runner.temp }}
        run: |
          azcopy.exe cp --recursive "https://lotusscus.blob.core.windows.net/models/cuda_sdk/v12.8" .
          dir
        shell: pwsh

      - name: Add CUDA to PATH
        shell: powershell
        run: |
          Write-Host "Adding CUDA to PATH"
          Write-Host "CUDA Path: $env:RUNNER_TEMP\v12.8\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\v12.8\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\v12.8\extras\CUPTI\lib64"

      - name: Set OnnxRuntimeBuildDirectory
        shell: pwsh
        run: |
          $buildDir = Join-Path ${{ runner.temp }} "build"
          echo "OnnxRuntimeBuildDirectory=$buildDir" >> $env:GITHUB_ENV

      - name: Install ONNX Runtime Wheel
        uses: ./.github/actions/install-onnxruntime-wheel
        with:
          whl-directory: ${{ runner.temp }}\build\RelWithDebInfo\RelWithDebInfo\dist

      # Verify the GPU is accessible before running the full test suite.
      # If the NVIDIA driver is not available, tests will fail with
      # "CUDA failure 100" and waste significant time.
      - name: Verify GPU access
        shell: pwsh
        run: nvidia-smi

      - name: Run Tests
        working-directory: ${{ runner.temp }}
        run: |
          npm install -g typescript
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }

          python.exe ${{ github.workspace }}\tools\python\update_ctest_path.py   "${{ runner.temp }}\build\RelWithDebInfo\CTestTestfile.cmake" "${{ runner.temp }}\build\RelWithDebInfo"
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }

          python.exe ${{ github.workspace }}\tools\ci_build\build.py --test --config RelWithDebInfo --build_dir build --skip_submodule_sync --build_csharp --parallel --nvcc_threads 4 --flash_nvcc_threads 4 --use_binskim_compliant_compile_flags --cmake_generator "Visual Studio 17 2022" --build_shared_lib --build_wheel --build_java --use_cuda --cuda_home="$env:RUNNER_TEMP\v12.8" --enable_cuda_profiling --use_vcpkg --use_vcpkg_ms_internal_asset_cache --enable_transformers_tool_test --cmake_extra_defines onnxruntime_QUICK_BUILD=ON --cmake_extra_defines CMAKE_CUDA_ARCHITECTURES=86 --cmake_extra_defines onnxruntime_ENABLE_CUDA_EP_INTERNAL_TESTS=ON
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }
        shell: pwsh

      # VALIDATION-ONLY: the head-vs-base A/B perf evidence for #31988. This does NOT rely
      # on ctest or the onnxruntime_providers_cuda_ut gtest module (empirically confirmed,
      # from an earlier iteration of this same throwaway workflow, to never be loaded/run by
      # ctest in this non-plugin pipeline -- see PR #32073 discussion). Instead it drives the
      # already-built, already-installed CUDA wheel directly through onnxruntime_perf_test.exe
      # (a standard ORT tool, already part of this build) against freshly generated
      # single-node MatMulNBits (M=1) models, toggling the validation-only
      # ORT_MATMULNBITS_M1_PERF_VALIDATION_FORCE_COLS_PER_BLOCK env var per-process between
      # "head" (unset -> PR's occupancy-driven selection) and "base" (8 -> pre-PR
      # unconditional cols_per_block==8).
      - name: Install perf-validation python deps
        run: python.exe -m pip install --quiet onnx onnx_ir
        shell: pwsh

      - name: Generate MatMulNBits M1 perf-validation models
        run: |
          python.exe "${{ github.workspace }}\tools\matmulnbits_m1_perf_validation\gen_models.py" --out-dir "${{ runner.temp }}\matmulnbits_m1_perf_models"
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }
        shell: pwsh

      - name: Run MatMulNBits M1 A10 head-vs-base perf sweep
        working-directory: ${{ runner.temp }}\build\RelWithDebInfo\RelWithDebInfo
        run: |
          python.exe "${{ github.workspace }}\tools\matmulnbits_m1_perf_validation\run_ab_sweep.py" --models-dir "${{ runner.temp }}\matmulnbits_m1_perf_models" --build-dir "${{ runner.temp }}\build\RelWithDebInfo\RelWithDebInfo" --repeats 200 --out-csv "${{ runner.temp }}\matmulnbits_m1_perf_models\results.csv"
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }
        shell: pwsh

      # VALIDATION-ONLY: one level deeper than the sweep above. The session-level
      # ("Latency") signal above was noise-dominated (A/A ~= A/B). This step times *only*
      # the kernel launch with CUDA events (new validation-only hook in
      # matmul_4bits_m1_impl.cuh, ORT_MATMULNBITS_M1_KERNEL_AB_BENCH=1), interleaving arms
      # within a single onnxruntime_perf_test.exe process, and self-reports to stderr. See
      # tools/matmulnbits_m1_perf_validation/run_kernel_ab_bench.py for full methodology
      # (numerics sanity check, A/A + wide-n structural controls, per-bucket percentiles,
      # clock-rate drift snapshot).
      - name: Run MatMulNBits M1 A10 kernel-level (CUDA event) A/B benchmark
        working-directory: ${{ runner.temp }}\build\RelWithDebInfo\RelWithDebInfo
        run: |
          python.exe "${{ github.workspace }}\tools\matmulnbits_m1_perf_validation\run_kernel_ab_bench.py" --models-dir "${{ runner.temp }}\matmulnbits_m1_perf_models" --build-dir "${{ runner.temp }}\build\RelWithDebInfo\RelWithDebInfo" --target-samples 4000 --repeats 4200 --out-csv "${{ runner.temp }}\matmulnbits_m1_perf_models\kernel_ab_results.csv"
          if ($lastExitCode -ne 0) {
            exit $lastExitCode
          }
        shell: pwsh

      - name: Upload MatMulNBits M1 perf-validation results
        uses: actions/upload-artifact@v6
        with:
          name: matmulnbits-m1-perf-results
          path: |
            ${{ runner.temp }}\matmulnbits_m1_perf_models\results.csv
            ${{ runner.temp }}\matmulnbits_m1_perf_models\kernel_ab_results.csv
            ${{ runner.temp }}\matmulnbits_m1_perf_models\_kernelbench_*\*.log

      - name: Validate C# native delegates
        run: python tools\ValidateNativeDelegateAttributes.py
        working-directory: ${{ github.workspace }}\csharp
        shell: cmd
    env:
      OrtPackageId: Microsoft.ML.OnnxRuntime.Gpu
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      setVcvars: true
      ALLOW_RELEASED_ONNX_OPSET_ONLY: '0'
      DocUpdateNeeded: false
      ONNXRUNTIME_TEST_GPU_DEVICE_ID: '0'
      AZCOPY_AUTO_LOGIN_TYPE: MSI
      AZCOPY_MSI_CLIENT_ID: d712a4c7-a0cf-4e87-af75-31510eba0a8e
