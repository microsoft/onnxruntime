name: EP Op Conformance CPU

on:
  pull_request:
    paths:
      - .github/workflows/ep-op-conformance-cpu.yml
      - onnxruntime/test/ep_op_conformance/**
      - include/onnxruntime/core/session/**
  push:
    branches: [main, rel-*]
    paths:
      - .github/workflows/ep-op-conformance-cpu.yml
      - onnxruntime/test/ep_op_conformance/**
      - include/onnxruntime/core/session/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  prepare:
    name: Build Public Runner And Prepare CPU Bundle
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: false
          persist-credentials: false

      - name: Setup Preparation Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install Isolated Preparation Dependencies
        run: |
          python -m venv "$env:RUNNER_TEMP/ep-op-conformance-venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/python.exe" -m pip install `
            cmake==3.31.6 numpy==2.2.6 onnx==1.17.0 protobuf==3.20.3 onnxruntime==1.24.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Standalone Public API Consumer
        run: |
          $cmake = "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/cmake.exe"
          $python = "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/python.exe"
          & $cmake -S onnxruntime/test/ep_op_conformance -B build/ep-op-conformance-ci `
            -G 'Visual Studio 17 2022' -A x64 -DCONFORMANCE_FETCH_DEPS=ON `
            "-DPYTHON_EXECUTABLE=$python"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cmake --build build/ep-op-conformance-ci --config RelWithDebInfo `
            --target onnxruntime_ep_op_conformance_test ep_op_conformance_comparison_test --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/ctest.exe" `
            --test-dir build/ep-op-conformance-ci -C RelWithDebInfo --output-on-failure `
            -R '^ep_op_conformance_comparison$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage Runtime And Generated Payloads
        run: |
          $python = "$env:RUNNER_TEMP/ep-op-conformance-venv/Scripts/python.exe"
          $runtime = & $python -I -c "import onnxruntime; from pathlib import Path; assert onnxruntime.__version__ == '1.24.4'; print(Path(onnxruntime.__file__).parent / 'capi' / 'onnxruntime.dll')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python onnxruntime/test/ep_op_conformance/tools/prepare_ci.py `
            --runner build/ep-op-conformance-ci/RelWithDebInfo/onnxruntime_ep_op_conformance_test.exe `
            --runtime $runtime --output "$env:RUNNER_TEMP/ep-op-conformance-bundle"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish Immutable CPU Bundle
        id: bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep-op-conformance-cpu-windows-x64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ep-op-conformance-bundle
          if-no-files-found: error
          retention-days: 7

  consume:
    name: Consume Native CPU Bundle Without Checkout Or Python
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download Prepared Bundle By Immutable ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.bundle-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ep-op-conformance-bundle

      - name: Execute Native CPU Conformance Checks
        working-directory: ${{ runner.temp }}/ep-op-conformance-bundle
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE/.git") { throw 'Consumer must not have a source checkout' }
          & ./run_ci.ps1 -ExpectedRuntimeVersion '1.24.4'

      - name: Upload CPU Reports Even On Failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ep-op-conformance-cpu-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ep-op-conformance-bundle/reports
          if-no-files-found: warn
          retention-days: 14