# This file should be used with a pytest invocation from the repository root.
# Paths are relative to the working directory (assumed to be the repository root).
# Use --rootdir=. to keep testpaths, test IDs, and the cache rooted at the repository.
# This configuration is opt-in via -c; it does not affect default discovery.

[pytest]
testpaths = tools
addopts =
    # CLI integration harness requiring Apple build artifacts, not a unit-test module.
    --ignore=tools/ci_build/github/apple/test_apple_packages.py
    # Creates files and runs benchmarks at import time.
    --ignore=tools/python/example_operator_perf_test.py
    # Requires ONNX, native ORT Python bindings, and testfixtures.
    --ignore=tools/python/util/mobile_helpers/test/test_usability_checker.py
    # Requires ONNX and native ORT Python bindings.
    --ignore=tools/python/util/test/test_onnx_model_utils.py
    # Requires PyTorch.
    --ignore=tools/python/util/test/test_pytorch_export_helpers.py
    # Covered by the separate WGSL Template Tests workflow.
    --ignore=tools/python/wgsl_template
