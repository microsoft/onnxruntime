name: ACR OIDC read pilot

on:
  push:
    branches:
      - eserscor-2026/11/09-acr-oidc-read-pilot
    paths:
      - .github/workflows/acr_oidc_read_pilot.yml
  workflow_dispatch:

permissions: {}

jobs:
  pull:
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 30
    permissions:
      id-token: write
    env:
      AZURE_CONFIG_DIR: ${{ runner.temp }}/acr-oidc-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/azure
      DOCKER_CONFIG: ${{ runner.temp }}/acr-oidc-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}/docker
      AZURE_CORE_OUTPUT: none
      ACR_SUBSCRIPTION_ID: 00c06639-6ee4-454e-8058-8d8b1703bd87
      ACR_IMAGE: onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cuda12_x64_almalinux8_gcc14:20261105.1
      EXPECTED_CLIENT_ID: ${{ vars.ACR_READ_CLIENT_ID }}
    steps:
      - name: Prepare isolated authentication directories
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPECTED_CLIENT_ID"
          mkdir -p "$AZURE_CONFIG_DIR" "$DOCKER_CONFIG"
          chmod 700 "$AZURE_CONFIG_DIR" "$DOCKER_CONFIG"

      - name: Authenticate to Azure using GitHub OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.ACR_READ_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ env.ACR_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Verify the authenticated identity
        shell: bash
        run: |
          set -euo pipefail
          client_id="$(az account show --query user.name --output tsv)"
          identity_type="$(az account show --query user.type --output tsv)"
          test "$client_id" = "$EXPECTED_CLIENT_ID"
          test "$identity_type" = servicePrincipal
          echo "Authenticated as the configured OIDC reader."

      - name: Authenticate Docker to ACR
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name onnxruntimebuildcache --subscription "$ACR_SUBSCRIPTION_ID" --output none

      - name: Pull the requested base image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ACR_IMAGE"
          docker image inspect "$ACR_IMAGE" --format '{{json .RepoDigests}}'

      - name: Clear isolated authentication state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf -- "$AZURE_CONFIG_DIR" "$DOCKER_CONFIG"' EXIT
          docker logout onnxruntimebuildcache.azurecr.io
          az account clear
