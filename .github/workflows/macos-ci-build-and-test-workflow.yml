name: "macOS CI Reusable Workflow for build and test"
description: "This is a reusable workflow for macOS CI pipelines to build and test"

on:
  workflow_call:
    inputs:
      use_webgpu:
        required: false
        type: boolean
        default: false
      use_xnnpack:
        required: false
        type: boolean
        default: false
      use_coreml:
        required: false
        type: boolean
        default: false
      use_apple_accelerate:
        required: false
        type: boolean
        default: false
      python_version:
        required: false
        type: string
        default: "3.14"
      matrix_include:
        required: false
        type: string
        description: "JSON string specifying combinations to include in the matrix"
        # we do not have enough resources to run all combinations
        # Include arm64 + Debug combination by default
        default: >-
          [
            {"machine": "arm64", "target": "arm64", "build_config": "Debug"}
          ]

jobs:
  build-and-test:
    strategy:
      matrix:
        # To avoid creating too many jobs, we explicitly specify the combinations to run.
        #
        # # Specify the machine architecture to run the build on.
        # machine: ["x86_64", "arm64"]
        #
        # # Specify the target architecture for the build.
        # target: ["x86_64", "arm64"]
        #
        # # Specify the build configuration for the build.
        # build_config: ["Debug", "Release"]
        #
        include: ${{ fromJSON(inputs.matrix_include) }}

    # "macos-15" is an arm64 image.
    # see also: https://github.com/actions/runner-images/blob/main/README.md
    runs-on: ${{ matrix.machine == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 120
    env:
      build_flags: >
        --build_dir ./build
        --skip_submodule_sync
        --parallel
        --use_binskim_compliant_compile_flags
        --build_shared_lib
        --build_nodejs
        --build_objc
        --build_java
        --build_wheel
        ${{ matrix.target == 'arm64' && '--enable_arm_neon_nchwc' || '' }}
        ${{ inputs.use_webgpu && '--use_webgpu' || '' }}
        ${{ inputs.use_xnnpack && '--use_xnnpack' || '' }}
        ${{ inputs.use_coreml && '--use_coreml --skip_onnx_tests' || '' }}
        ${{ inputs.use_apple_accelerate && '--use_apple_accelerate' || '' }}
        --use_vcpkg --use_vcpkg_ms_internal_asset_cache
        --config ${{ matrix.build_config }}
        --osx_arch ${{ matrix.target }}

      # A matrix entry may override the Xcode version via "xcode_version"; otherwise fall back to the default.
      # The Xcode version needs to be present on the image specified in the "runs-on" configuration.
      xcode_version: ${{ matrix.xcode_version || '26.3' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: microsoft/onnxruntime-github-actions/setup-build-tools@d19341fb036c43a947a2c0e4a53ad4d15e10bc5c # v0.0.9
        with:
          vcpkg-version: '2025.08.27'
          vcpkg-hash: 9a4b32849792e13bee1d24726f073b3881acae4165206ddf1a6378e44a4ddd05b3ee93f55ff46d8e8873b3cbcd06606212989e248f0bd615a5bf365070074079
          cmake-version: '3.31.8'
          cmake-hash: 99cc9c63ae49f21253efb5921de2ba84ce136018abf08632c92c060ba91d552e0f6acc214e9ba8123dee0cf6d1cf089ca389e321879fd9d719a60d975bcffcc8
          add-cmake-to-path: 'true'
          disable-terrapin: 'true'

      - name: macOS CI pipeline prepare steps
        uses: ./.github/actions/macos-ci-setup
        with:
          platform_machine: ${{ matrix.machine }}
          python_version: ${{ inputs.python_version }}
          xcode_version: ${{ env.xcode_version }}
          use_cache: true

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: onnx-node-tests-cache
        with:
          path: ${{ github.workspace }}/js/test/
          key: onnxnodetests-${{ hashFiles('js/scripts/prepare-onnx-node-tests.ts') }}

      - name: Setup environment variables
        shell: bash
        run: |
          set -e -x
          export PATH=${{ github.workspace }}/build/installed/bin:$PATH
          export ONNX_ML=1
          export CMAKE_ARGS="-DONNX_GEN_PB_TYPE_STUBS=ON -DONNX_WERROR=OFF"
          python -m pip install -r '${{ github.workspace }}/tools/ci_build/github/linux/docker/scripts/requirements.txt'

      - name: Configure Build (build.py --update)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ${{ github.workspace }}/build/${{ matrix.build_config }}
          python ./tools/ci_build/build.py --update ${{ env.build_flags }}

      - name: Build (build.py --build)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python ./tools/ci_build/build.py --build ${{ env.build_flags }}

      - name: Install
        shell: bash
        run: |
          set -e -x
          rm -rf ${{ github.workspace }}/build/installed
          cd ${{ github.workspace }}/build/${{ matrix.build_config }}
          make install DESTDIR=${{ github.workspace }}/build/installed

      - name: Running Tests (build.py --test)
        # Skip tests when cross-compiling
        if: ${{ matrix.machine == matrix.target }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python ./tools/ci_build/build.py --test ${{ env.build_flags }}

      - name: Running MLAS LayerNorm/RMSNorm tests (onnxruntime_mlas_test)
        # onnxruntime_mlas_test is a standalone gtest binary that is never
        # registered with add_test()/ctest (see cmake/onnxruntime_unittests.cmake),
        # so the ctest-driven "build.py --test" step above never runs it on
        # any macOS CI lane, including this one -- the only lane that builds
        # the Apple Accelerate LayerNorm/RMSNorm kernel and its gated
        # test_layernorm_apple_accelerate.cpp. Without this explicit
        # invocation those tests would never execute in CI at all. Guarded
        # to native arm64 (skip when cross-compiling, matching the step
        # above) and use_apple_accelerate, so this only runs on this job.
        # Runs on every native-arm64 entry in this matrix regardless of
        # build_config: Debug (assertion-rich, catches contract violations
        # that Release may optimize past) and Release (the same binary the
        # benchmark steps below build) are both intentional here -- unlike
        # the benchmark steps, correctness coverage is not config-gated.
        #
        # The filter is "*LayerNorm*", not just "LayerNormAppleAccelerate.*":
        # registering GetMlasPlatform().LayerNormF32Kernel on this job also
        # makes the pre-existing, platform-agnostic LayerNorm.* suite in
        # test_layernorm.cpp *actually execute* for the first time on ARM64
        # (it was previously a guaranteed no-op everywhere on this
        # architecture, since MlasLayerNormF32 returned false and every case
        # hit its own early `if (!used) return;`). That suite is a real,
        # independent correctness check of this kernel using a differently-
        # ordered reference formula, and must run here for the same "no
        # explicit ctest registration" reason as above -- a filter scoped to
        # only this PR's own new tests would let a regression in the shared
        # suite go completely uncaught by any CI lane.
        if: ${{ matrix.machine == matrix.target && matrix.target == 'arm64' && inputs.use_apple_accelerate }}
        shell: bash
        # build.py's --build_dir ./build + --config ${{ matrix.build_config }}
        # places test executables directly at build/<config>/, the same
        # layout the "Install" step above already relies on.
        working-directory: ${{ github.workspace }}/build/${{ matrix.build_config }}
        run: |
          set -e -x
          echo "Build config: ${{ matrix.build_config }}"
          ls -l ./onnxruntime_mlas_test

          # A gtest binary invoked with --gtest_filter that matches zero
          # tests still exits 0 -- it "ran" a suite of nothing and reports
          # success. That would make this whole step a silent no-op if either
          # suite were ever absent from this binary (e.g.
          # test_layernorm_apple_accelerate.cpp not compiled in because
          # MLAS_USE_APPLE_ACCELERATE/__APPLE__/MLAS_TARGET_ARM64 didn't all
          # evaluate true, or test_layernorm.cpp removed/renamed upstream),
          # and this CI lane would appear green while providing zero real
          # coverage. Enumerate the filtered suites first and fail loudly if
          # either is missing, instead of trusting the runner's own exit
          # code or a single substring match that could be satisfied by only
          # one of the two suites.
          listed_tests="$(./onnxruntime_mlas_test --gtest_filter="*LayerNorm*" --gtest_list_tests)"
          echo "${listed_tests}"
          if ! grep -q "LayerNormAppleAccelerate" <<< "${listed_tests}"; then
            echo "::error::onnxruntime_mlas_test --gtest_filter='*LayerNorm*' did not list the LayerNormAppleAccelerate suite (see --gtest_list_tests output above). This means test_layernorm_apple_accelerate.cpp was not compiled into onnxruntime_mlas_test on this job -- check that MLAS_USE_APPLE_ACCELERATE, __APPLE__, and MLAS_TARGET_ARM64 all evaluate true for this build -- so the Apple Accelerate LayerNorm/RMSNorm kernel has zero test coverage despite this step appearing to pass. Failing loudly instead of silently succeeding with 0 tests run." >&2
            exit 1
          fi
          if ! grep -q "^LayerNorm\.$" <<< "${listed_tests}"; then
            echo "::error::onnxruntime_mlas_test --gtest_filter='*LayerNorm*' did not list the pre-existing, platform-agnostic LayerNorm suite (see --gtest_list_tests output above). This suite (test_layernorm.cpp) is the primary cross-platform correctness check for the kernel this PR registers on ARM64 -- if it disappeared from the binary, this step would silently stop covering it. Failing loudly instead of silently succeeding with reduced coverage." >&2
            exit 1
          fi

          ./onnxruntime_mlas_test --gtest_filter="*LayerNorm*"

      - name: Build MLAS benchmark target (onnxruntime_mlas_benchmark)
        # Real performance evidence is a Ready blocker for this optimization
        # PR -- no numbers for the apple_accelerate_vdsp LayerNorm/RMSNorm
        # path have ever been produced. --build_micro_benchmarks turns on
        # the existing onnxruntime_BUILD_BENCHMARKS CMake option (see
        # cmake/onnxruntime_unittests.cmake), which also guards the general,
        # unrelated onnxruntime_benchmark target (modeltest/pooling/resize/
        # batchnorm/etc.).
        #
        # Gated to build_config == 'Release': a Debug/-O0 binary is not
        # meaningful performance evidence, so the benchmark is only ever
        # built/run on the Release entry of this matrix.
        #
        # This step intentionally does NOT call
        # "build.py --update --build ${{ env.build_flags }}" as one command.
        # env.build_flags includes --build_wheel (needed by the earlier
        # Configure/Build/Install steps for this job's normal build_flags
        # matrix), and build.py's main() unconditionally repackages the
        # Python wheel via build_python_wheel() whenever `args.build` is
        # set and `args.build_wheel` is set -- regardless of what
        # --target was passed to the underlying cmake --build invocation.
        # Rebuilding/repackaging the entire wheel on every CI run of this
        # job just to add one benchmark binary would be wasteful.
        #
        # Instead: reconfigure only (--update, no --build) to add
        # --build_micro_benchmarks into the existing CMakeCache in-place
        # (this preserves the cache/build tree from the earlier Configure
        # step -- no directory removal, unlike that step's initial `rm -rf`),
        # then invoke cmake directly with --target to build only
        # onnxruntime_mlas_benchmark and its dependencies. This never touches
        # the wheel-packaging code path at all.
        if: ${{ matrix.machine == matrix.target && matrix.target == 'arm64' && inputs.use_apple_accelerate && matrix.build_config == 'Release' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -e -x
          echo "Build config: ${{ matrix.build_config }}"
          python ./tools/ci_build/build.py --update --build_micro_benchmarks ${{ env.build_flags }}
          cmake --build "./build/${{ matrix.build_config }}" --config "${{ matrix.build_config }}" --target onnxruntime_mlas_benchmark --parallel

      - name: Running MLAS LayerNorm/RMSNorm benchmark A/B (onnxruntime_mlas_benchmark)
        # No performance claim is made by this step or anywhere else in this
        # PR -- this only ensures the LayerNorm/RMSNorm dispatch-vs-portable-
        # scalar-baseline A/B numbers are actually produced and printed to CI
        # logs on real Apple Silicon, so a human reviewer has real evidence
        # to read instead of none. BM_LayerNormDispatch/BM_RMSNormDispatch
        # call the public MlasLayerNormF32 entry point, which resolves to
        # the vDSP kernel on this job and is labeled "apple_accelerate_vdsp"
        # (see DispatchPathLabel in bench_layernorm_apple_accelerate.cpp);
        # BM_LayerNormPortableScalarBaseline/BM_RMSNormPortableScalarBaseline
        # call a standalone reproduction of the real ARM64 scalar fallback
        # (onnxruntime/core/providers/cpu/nn/layer_norm_impl.cc's
        # ComputeJob), labeled "portable_scalar_baseline" -- so the labels
        # in the printed output are what prove this ran the intended A/B
        # against the actual alternative ARM64 uses today, not two copies
        # of the same kernel.
        #
        # Gated to build_config == 'Release', matching the build step above
        # -- a Debug/-O0 run here would be reported as if it were
        # performance evidence, which it is not.
        if: ${{ matrix.machine == matrix.target && matrix.target == 'arm64' && inputs.use_apple_accelerate && matrix.build_config == 'Release' }}
        shell: bash
        # Same layout as onnxruntime_mlas_test above: build.py's
        # --build_dir ./build + --config ${{ matrix.build_config }} places
        # executables directly at build/<config>/.
        working-directory: ${{ github.workspace }}/build/${{ matrix.build_config }}
        run: |
          set -e -x
          echo "Build config: ${{ matrix.build_config }}"
          ls -l ./onnxruntime_mlas_benchmark

          # A benchmark binary invoked with --benchmark_filter that matches
          # zero benchmarks still exits 0 and prints an empty table -- it
          # would silently "run" nothing and this step would appear to pass
          # while producing zero real A/B evidence (e.g. if the filter
          # regex and the actual registered benchmark names ever drifted
          # apart). Enumerate the filtered set first via
          # --benchmark_list_tests=true and fail loudly if any expected
          # benchmark name is missing, instead of trusting the runner's own
          # exit code.
          listed_benchmarks="$(./onnxruntime_mlas_benchmark --benchmark_filter="BM_(LayerNorm|RMSNorm)(Dispatch|PortableScalarBaseline)" --benchmark_list_tests=true)"
          echo "${listed_benchmarks}"
          for name in BM_LayerNormDispatch BM_LayerNormPortableScalarBaseline BM_RMSNormDispatch BM_RMSNormPortableScalarBaseline; do
            if ! grep -q "^${name}" <<< "${listed_benchmarks}"; then
              echo "::error::onnxruntime_mlas_benchmark --benchmark_filter='BM_(LayerNorm|RMSNorm)(Dispatch|PortableScalarBaseline)' --benchmark_list_tests=true did not list ${name} (see listing above). This means the A/B benchmark did not register at all on this job -- failing loudly instead of silently producing zero evidence." >&2
              exit 1
            fi
          done

          benchmark_output="$(./onnxruntime_mlas_benchmark --benchmark_filter="BM_(LayerNorm|RMSNorm)(Dispatch|PortableScalarBaseline)")"
          echo "${benchmark_output}"

          # BM_LayerNormDispatch/BM_RMSNormDispatch must actually resolve to
          # the vDSP kernel (labeled "apple_accelerate_vdsp" by
          # DispatchPathLabel in bench_layernorm_apple_accelerate.cpp) on
          # this job. Without this check, a misconfigured build where the
          # dispatch benchmark silently fell back to "no_kernel_registered"
          # or some other path would still print numbers, and a reviewer
          # could easily mistake them for the intended vDSP measurement.
          if ! grep -q "apple_accelerate_vdsp" <<< "${benchmark_output}"; then
            echo "::error::BM_LayerNormDispatch/BM_RMSNormDispatch output did not contain the 'apple_accelerate_vdsp' label (see output above). This means MlasLayerNormF32 did not dispatch to MlasLayerNormKernelAppleAccelerate on this job -- check the registration in platform.cpp -- so the numbers above are NOT the intended A/B comparison." >&2
            exit 1
          fi
