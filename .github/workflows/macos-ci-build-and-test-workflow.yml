name: "macOS CI Reusable Workflow for build and test"
description: "This is a reusable workflow for macOS CI pipelines to build and test"

on:
  workflow_call:
    inputs:
      use_webgpu:
        required: false
        type: boolean
        default: false
      use_xnnpack:
        required: false
        type: boolean
        default: false
      use_coreml:
        required: false
        type: boolean
        default: false
      run_mlas_tests:
        required: false
        type: boolean
        default: false
        description: >-
          Explicitly execute onnxruntime_mlas_test on native (non-cross-compiled) arm64 runs.
          onnxruntime_mlas_test is a standalone gtest binary that is never registered with
          CTest's add_test(), so `build.py --test` (which drives ctest on this workflow) never
          runs it; see the "Run onnxruntime_mlas_test directly" step below. Opt-in per caller
          job to avoid running the same MLAS coverage redundantly across every macOS workflow
          (coreml/xnnpack/webgpu) that reuses this file.
      python_version:
        required: false
        type: string
        default: "3.14"
      matrix_include:
        required: false
        type: string
        description: "JSON string specifying combinations to include in the matrix"
        # we do not have enough resources to run all combinations
        # Include arm64 + Debug combination by default
        default: >-
          [
            {"machine": "arm64", "target": "arm64", "build_config": "Debug"}
          ]

jobs:
  build-and-test:
    strategy:
      matrix:
        # To avoid creating too many jobs, we explicitly specify the combinations to run.
        #
        # # Specify the machine architecture to run the build on.
        # machine: ["x86_64", "arm64"]
        #
        # # Specify the target architecture for the build.
        # target: ["x86_64", "arm64"]
        #
        # # Specify the build configuration for the build.
        # build_config: ["Debug", "Release"]
        #
        include: ${{ fromJSON(inputs.matrix_include) }}

    # "macos-15" is an arm64 image.
    # see also: https://github.com/actions/runner-images/blob/main/README.md
    runs-on: ${{ matrix.machine == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 120
    env:
      build_flags: >
        --build_dir ./build
        --skip_submodule_sync
        --parallel
        --use_binskim_compliant_compile_flags
        --build_shared_lib
        --build_nodejs
        --build_objc
        --build_java
        --build_wheel
        ${{ matrix.target == 'arm64' && '--enable_arm_neon_nchwc' || '' }}
        ${{ inputs.use_webgpu && '--use_webgpu' || '' }}
        ${{ inputs.use_xnnpack && '--use_xnnpack' || '' }}
        ${{ inputs.use_coreml && '--use_coreml --skip_onnx_tests' || '' }}
        --use_vcpkg --use_vcpkg_ms_internal_asset_cache
        --config ${{ matrix.build_config }}
        --osx_arch ${{ matrix.target }}

      # A matrix entry may override the Xcode version via "xcode_version"; otherwise fall back to the default.
      # The Xcode version needs to be present on the image specified in the "runs-on" configuration.
      xcode_version: ${{ matrix.xcode_version || '26.3' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: microsoft/onnxruntime-github-actions/setup-build-tools@d19341fb036c43a947a2c0e4a53ad4d15e10bc5c # v0.0.9
        with:
          vcpkg-version: '2025.08.27'
          vcpkg-hash: 9a4b32849792e13bee1d24726f073b3881acae4165206ddf1a6378e44a4ddd05b3ee93f55ff46d8e8873b3cbcd06606212989e248f0bd615a5bf365070074079
          cmake-version: '3.31.8'
          cmake-hash: 99cc9c63ae49f21253efb5921de2ba84ce136018abf08632c92c060ba91d552e0f6acc214e9ba8123dee0cf6d1cf089ca389e321879fd9d719a60d975bcffcc8
          add-cmake-to-path: 'true'
          disable-terrapin: 'true'

      - name: macOS CI pipeline prepare steps
        uses: ./.github/actions/macos-ci-setup
        with:
          platform_machine: ${{ matrix.machine }}
          python_version: ${{ inputs.python_version }}
          xcode_version: ${{ env.xcode_version }}
          use_cache: true

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: onnx-node-tests-cache
        with:
          path: ${{ github.workspace }}/js/test/
          key: onnxnodetests-${{ hashFiles('js/scripts/prepare-onnx-node-tests.ts') }}

      - name: Setup environment variables
        shell: bash
        run: |
          set -e -x
          export PATH=${{ github.workspace }}/build/installed/bin:$PATH
          export ONNX_ML=1
          export CMAKE_ARGS="-DONNX_GEN_PB_TYPE_STUBS=ON -DONNX_WERROR=OFF"
          python -m pip install -r '${{ github.workspace }}/tools/ci_build/github/linux/docker/scripts/requirements.txt'

      - name: Configure Build (build.py --update)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ${{ github.workspace }}/build/${{ matrix.build_config }}
          python ./tools/ci_build/build.py --update ${{ env.build_flags }}

      - name: Build (build.py --build)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python ./tools/ci_build/build.py --build ${{ env.build_flags }}

      - name: Install
        shell: bash
        run: |
          set -e -x
          rm -rf ${{ github.workspace }}/build/installed
          cd ${{ github.workspace }}/build/${{ matrix.build_config }}
          make install DESTDIR=${{ github.workspace }}/build/installed

      - name: Running Tests (build.py --test)
        # Skip tests when cross-compiling
        if: ${{ matrix.machine == matrix.target }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python ./tools/ci_build/build.py --test ${{ env.build_flags }}

      - name: Run onnxruntime_mlas_test directly
        # `build.py --test` above drives ctest, but onnxruntime_mlas_test is a standalone gtest
        # binary that is never wired up with CTest's add_test() (in
        # cmake/onnxruntime_unittests.cmake), so ctest silently runs zero MLAS tests on every
        # platform, including this one. Invoke the binary directly so this native arm64 lane
        # gets real MLAS coverage. Native-only (skipped when cross-compiling, same as the ctest
        # step above) and opt-in per caller job (see `run_mlas_tests` input) to avoid running
        # the same MLAS suite redundantly across every macOS workflow that reuses this file.
        if: ${{ matrix.machine == matrix.target && matrix.target == 'arm64' && inputs.run_mlas_tests }}
        shell: bash
        working-directory: ${{ github.workspace }}/build/${{ matrix.build_config }}
        run: |
          set -e -x
          test_bin="./onnxruntime_mlas_test"
          if [ ! -x "${test_bin}" ]; then
            echo "::error::${test_bin} was not found or is not executable. Expected it to be built by build.py --build alongside the other unit tests (onnxruntime_BUILD_UNIT_TESTS defaults ON)." >&2
            exit 1
          fi
          # Run the full default (short) suite, matching what build.py's own non-ctest fallback
          # path (`run_onnxruntime_tests` in tools/ci_build/build.py) already runs on platforms
          # without a resolved ctest binary.
          #
          # One narrow exclusion, Debug-only: HalfGemmPackB.PackBExitsEarlyForInvalidArguments
          # deliberately calls MlasHalfGemmPackB() with invalid arguments (null buffers / ldb < N)
          # to verify it exits early without touching PackedB. In a Debug build this hits an
          # `assert()` in onnxruntime/core/mlas/lib/halfgemm.cpp (MlasHalfGemmPackB) that
          # contradicts the very early-return null/ldb check on the next line and the test's own
          # intent, aborting the whole process (SIGABRT) before any later test suites can run.
          # Release builds compile asserts out (default -DNDEBUG), so the test passes cleanly
          # there and is only excluded in Debug to preserve that coverage. This is a pre-existing
          # product bug -- both the assert and the test were added together in the same upstream
          # commit, 01f0dba66cc5da8ad20ee81b1795b3b110ad913a ("[MLAS][KleidiAI] Add MLAS Arm64
          # half GEMM and convolution support", #28786) -- unrelated to this workflow change, and
          # only surfaced now because onnxruntime_mlas_test has never actually executed in CI --
          # exactly the gap this PR fixes. Fixing the assert itself is out of scope for a CI-only
          # change and belongs in a separate MLAS PR, so exclude only this one test by exact name
          # (not a suite-wide or wildcard exclusion), and only for the build config that actually
          # crashes, to keep the rest of the suite's coverage intact.
          test_args=()
          if [ "${{ matrix.build_config }}" = "Debug" ]; then
            test_args+=("--gtest_filter=-HalfGemmPackB.PackBExitsEarlyForInvalidArguments")
          fi
          output_xml="onnxruntime_mlas_test.${{ matrix.build_config }}.results.xml"
          rm -f "${output_xml}"
          "${test_bin}" "${test_args[@]}" --gtest_output="xml:${output_xml}"

          # Belt-and-suspenders: gtest's own RUN_ALL_TESTS() returns 0 even when zero tests ran
          # (e.g. every LongShortExecuteManager registrar in test_main.cpp declines because a
          # runtime CPU-feature check failed), so a passing exit code alone is not proof that any
          # MLAS coverage actually executed. Read the count gtest itself reports in the XML root
          # element (`<testsuites tests="N" ...>`) and fail loudly if it is missing or zero,
          # instead of letting that look identical to a real, non-vacuous pass.
          if [ ! -f "${output_xml}" ]; then
            echo "::error::${test_bin} did not produce ${output_xml}; cannot verify any MLAS tests actually ran." >&2
            exit 1
          fi
          if ! grep -Eq '<testsuites[^>]*[[:space:]]tests="[1-9][0-9]*"' "${output_xml}"; then
            echo "::error::${output_xml} reports zero MLAS tests were executed. A gtest binary that registers/matches zero tests still exits 0, so this is treated as a hard failure instead of a silent pass." >&2
            cat "${output_xml}" >&2
            exit 1
          fi
