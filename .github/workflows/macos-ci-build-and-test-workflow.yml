name: "macOS CI Reusable Workflow for build and test"
description: "This is a reusable workflow for macOS CI pipelines to build and test"

on:
  workflow_call:
    inputs:
      use_webgpu:
        required: false
        type: boolean
        default: false
      use_xnnpack:
        required: false
        type: boolean
        default: false
      use_coreml:
        required: false
        type: boolean
        default: false
      python_version:
        required: false
        type: string
        default: "3.14"
      matrix_include:
        required: false
        type: string
        description: "JSON string specifying combinations to include in the matrix"
        # we do not have enough resources to run all combinations
        # Include arm64 + Debug combination by default
        default: >-
          [
            {"machine": "arm64", "target": "arm64", "build_config": "Debug"}
          ]

jobs:
  build-and-test:
    strategy:
      matrix:
        # To avoid creating too many jobs, we explicitly specify the combinations to run.
        #
        # # Specify the machine architecture to run the build on.
        # machine: ["x86_64", "arm64"]
        #
        # # Specify the target architecture for the build.
        # target: ["x86_64", "arm64"]
        #
        # # Specify the build configuration for the build.
        # build_config: ["Debug", "Release"]
        #
        include: ${{ fromJSON(inputs.matrix_include) }}

    # "macos-15" is an arm64 image.
    # see also: https://github.com/actions/runner-images/blob/main/README.md
    runs-on: ${{ matrix.machine == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 150
    env:
      build_flags: >
        --build_dir ./build
        --skip_submodule_sync
        --use_cache
        --parallel
        --use_binskim_compliant_compile_flags
        --build_shared_lib
        --build_nodejs
        --build_objc
        --build_java
        --build_wheel
        ${{ matrix.target == 'arm64' && '--enable_arm_neon_nchwc' || '' }}
        ${{ inputs.use_webgpu && '--use_webgpu' || '' }}
        ${{ inputs.use_xnnpack && '--use_xnnpack' || '' }}
        ${{ inputs.use_coreml && '--use_coreml --skip_onnx_tests' || '' }}
        --use_vcpkg --use_vcpkg_ms_internal_asset_cache
        --config ${{ matrix.build_config }}
        --osx_arch ${{ matrix.target }}

      # A matrix entry may override the Xcode version via "xcode_version"; otherwise fall back to the default.
      # The Xcode version needs to be present on the image specified in the "runs-on" configuration.
      xcode_version: ${{ matrix.xcode_version || '26.3' }}

      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      # Bound transfer/storage costs across the matrix; retain ccache's default compression and safety checks.
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: >-
            ${{
              format(
                'macos-{0}-{1}-{2}-xcode-{3}-coreml-{4}-xnnpack-{5}-webgpu-{6}',
                matrix.machine,
                matrix.target,
                matrix.build_config,
                env.xcode_version,
                inputs.use_coreml,
                inputs.use_xnnpack,
                inputs.use_webgpu
              )
            }}

      - name: Get vcpkg tool info
        id: vcpkg-tool-info
        uses: ./.github/actions/get-vcpkg-tool-info
      - uses: microsoft/onnxruntime-github-actions/setup-build-tools@d19341fb036c43a947a2c0e4a53ad4d15e10bc5c # v0.0.9
        with:
          vcpkg-version: ${{ steps.vcpkg-tool-info.outputs.release_tag }}
          vcpkg-hash: ${{ steps.vcpkg-tool-info.outputs.sha512 }}
          cmake-version: '3.31.8'
          cmake-hash: 99cc9c63ae49f21253efb5921de2ba84ce136018abf08632c92c060ba91d552e0f6acc214e9ba8123dee0cf6d1cf089ca389e321879fd9d719a60d975bcffcc8
          add-cmake-to-path: 'true'
          disable-terrapin: 'true'

      - name: macOS CI pipeline prepare steps
        uses: ./.github/actions/macos-ci-setup
        with:
          platform_machine: ${{ matrix.machine }}
          python_version: ${{ inputs.python_version }}
          xcode_version: ${{ env.xcode_version }}
          use_cache: true

      - name: Identify compiler cache
        id: compiler-cache
        shell: bash
        env:
          CACHE_VARIANT: >-
            ${{ matrix.machine }}-${{ matrix.target }}-${{ matrix.build_config }}-python-${{ inputs.python_version
            }}-coreml-${{ inputs.use_coreml }}-xnnpack-${{ inputs.use_xnnpack }}-webgpu-${{ inputs.use_webgpu }}
        run: |
          set -euo pipefail
          # Do not restore across runner image, selected Xcode/SDK, or ccache upgrades.
          {
            printf '%s\n' "$ImageOS" "$ImageVersion"
            xcodebuild -version
            xcrun clang --version
            xcrun --sdk macosx --show-sdk-version
            ccache --version
          } > "$RUNNER_TEMP/ccache-toolchain.txt"
          toolchain_hash=$(shasum -a 256 "$RUNNER_TEMP/ccache-toolchain.txt" | cut -d ' ' -f 1)
          echo "prefix=macos-ccache-v1-${CACHE_VARIANT}-${toolchain_hash}-" >> "$GITHUB_OUTPUT"

      - name: Restore compiler cache
        id: restore-compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.prefix }}${{ github.sha }}
          restore-keys: |
            ${{ steps.compiler-cache.outputs.prefix }}

      - name: Reset compiler cache statistics
        shell: bash
        run: |
          ccache --show-config
          ccache --zero-stats

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: onnx-node-tests-cache
        with:
          path: ${{ github.workspace }}/js/test/
          key: onnxnodetests-${{ hashFiles('js/scripts/prepare-onnx-node-tests.ts') }}

      - name: Setup environment variables
        shell: bash
        run: |
          set -e -x
          export PATH=${{ github.workspace }}/build/installed/bin:$PATH
          export ONNX_ML=1
          export CMAKE_ARGS="-DONNX_GEN_PB_TYPE_STUBS=ON -DONNX_WERROR=OFF"
          python -m pip install -r '${{ github.workspace }}/tools/ci_build/github/linux/docker/scripts/requirements.txt'

      - name: Configure Build (build.py --update)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          rm -rf ${{ github.workspace }}/build/${{ matrix.build_config }}
          python ./tools/ci_build/build.py --update ${{ env.build_flags }}

      - name: Build (build.py --build)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python ./tools/ci_build/build.py --build ${{ env.build_flags }}

      - name: Compiler cache statistics
        if: ${{ always() && steps.restore-compiler-cache.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          ccache --show-stats -vv | tee "$RUNNER_TEMP/ccache-stats.txt"
          {
            echo '### Compiler cache'
            echo '```text'
            cat "$RUNNER_TEMP/ccache-stats.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Save after compilation, before tests, so a test timeout does not discard a warm cache.
      - name: Save compiler cache (main only)
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.restore-compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-compiler-cache.outputs.cache-primary-key }}

      - name: Install
        shell: bash
        run: |
          set -e -x
          rm -rf ${{ github.workspace }}/build/installed
          cd ${{ github.workspace }}/build/${{ matrix.build_config }}
          make install DESTDIR=${{ github.workspace }}/build/installed

      - name: Running Tests (build.py --test)
        # Skip tests when cross-compiling
        if: ${{ matrix.machine == matrix.target }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python ./tools/ci_build/build.py --test ${{ env.build_flags }}

      - name: WebGPU GEMV correctness (Metal)
        if: ${{ inputs.use_webgpu && matrix.machine == matrix.target }}
        shell: bash
        working-directory: ${{ github.workspace }}/build/${{ matrix.build_config }}
        env:
          PYTHONPATH: ${{ github.workspace }}/build/${{ matrix.build_config }}
        run: |
          python - <<'PY'
          import onnxruntime as ort
          assert any(device.ep_name == "WebGpuExecutionProvider" for device in ort.get_ep_devices()), \
              "A WebGPU device is required for GEMV CI; skipping is not allowed."
          PY
          python -m pytest -v transformers/test_webgpu_matmul.py
