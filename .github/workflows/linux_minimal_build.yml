name: Linux CPU Minimal Build E2E

on:
  push:
    branches:
      - main
      - rel-*
  pull_request:
    branches:
      - main
      - rel-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  BUILD_SOURCES_DIRECTORY: ${{ github.workspace }}

jobs:
  # Job 1: Build full onnxruntime and generate ORT format test files
  build_full_ort:
    name: 1. Build Full ORT and Generate ORT Files
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: linux-minimal-build-full-ort

      - uses: ./.github/actions/setup-build-tools

      - name: Install Python requirements
        run: python3 -m pip install --user -r tools/ci_build/github/linux/python/requirements.txt

      - name: Build Full ORT
        run: |
          python3 tools/ci_build/op_registration_validator.py
          python3 tools/ci_build/build.py \
            --build_dir "$RUNNER_TEMP" --cmake_generator Ninja --config Debug \
            --skip_submodule_sync --parallel \
            --use_vcpkg --use_vcpkg_ms_internal_asset_cache \
            --use_binskim_compliant_compile_flags \
            --build_wheel --skip_tests

      - name: Install built ORT wheel
        shell: bash
        run: |
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/Debug/dist/onnxruntime-*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one onnxruntime wheel, found ${#wheels[@]}"
            exit 1
          fi
          python3 -m pip install --user --force-reinstall --no-deps "${wheels[0]}"

      - name: Prepare Test Files
        run: python3 tools/ci_build/prepare_minimal_build_test_data.py --build-dir "$RUNNER_TEMP"

      - name: Upload Test Data Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test_data
          path: ${{ runner.temp }}/minimal_build_test_data/
          if-no-files-found: error # Fail if test data wasn't generated

  # Job 2: Build minimal onnxruntime [exceptions DISABLED, type reduction DISABLED]
  build_minimal_exceptions_disabled:
    name: 2. Build Minimal (Exceptions Disabled)
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions: # Permissions needed for build-docker-image
      contents: read
      packages: write
      id-token: write # If using OIDC for ACR login
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup CCache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache | linux_minimal_build.yml | build_minimal_exceptions_disabled
          path: ~/.cache/ccache

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: linux-minimal-exceptions-disabled

      - name: Get Docker Image using Action
        uses: ./.github/actions/build-docker-image
        id: build_docker_image_step
        with:
          dockerfile: ${{ github.workspace }}/tools/ci_build/github/linux/docker/inference/x86_64/default/cpu/Dockerfile
          image-name: ghcr.io/microsoft/onnxruntime/onnxruntimecpubuildcix64
          push: true
          azure-container-registry-name: onnxruntimebuildcache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Build 2 (Update)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: Debug # From original --config Debug
          mode: 'update' # CMake configure step
          extra_build_flags: >-
            --cmake_generator Ninja
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --skip_tests
            --minimal_build
            --disable_exceptions

      - name: Run Build 2 (Build)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: Debug # From original --config Debug
          mode: 'build' # Actual build step
          extra_build_flags: >-
            --cmake_generator Ninja
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --skip_tests
            --minimal_build
            --disable_exceptions

      - name: Save CCache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: ~/.cache/ccache

  # Job 3a: Build minimal onnxruntime [exceptions ENABLED, type reduction DISABLED, custom ops ENABLED] and run tests
  build_minimal_custom_ops:
    name: 3a. Build Minimal (Custom Ops)
    needs: build_full_ort # Depends on Job 1 for test data
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions: # Permissions needed for build-docker-image
      contents: read
      packages: write
      id-token: write # If using OIDC for ACR login
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup CCache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache | linux_minimal_build.yml | build_minimal_custom_ops
          path: ~/.cache/ccache

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: linux-minimal-custom-ops

      - uses: ./.github/actions/setup-build-tools
        with:
          install-ccache: 'true'

      - name: Build Full ORT and Prepare Test Files
        uses: microsoft/onnxruntime-github-actions/build-minimal-ort-and-run-tests@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          reduced-ops-config-file: required_ops.ort_models.config
          enable-custom-ops: 'true'
          binary-size-report-name-prefix: "3a"

      - name: Save CCache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: ~/.cache/ccache

  # Job 3b: Build minimal onnxruntime [exceptions ENABLED, type reduction ENABLED] and run tests
  build_minimal_type_reduction:
    name: 3b. Build Minimal (Type Reduction)
    needs: build_full_ort # Depends on Job 1 for test data
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions: # Permissions needed for build-docker-image
      contents: read
      packages: write
      id-token: write # If using OIDC for ACR login
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup CCache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache | linux_minimal_build.yml | build_minimal_type_reduction
          path: ~/.cache/ccache

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: linux-minimal-type-reduction

      - uses: ./.github/actions/setup-build-tools
        with:
          install-ccache: 'true'

      - name: Build Full ORT and Prepare Test Files
        uses: microsoft/onnxruntime-github-actions/build-minimal-ort-and-run-tests@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          reduced-ops-config-file: required_ops_and_types.ort_models.config
          enable-type-reduction: 'true'
          binary-size-report-name-prefix: "3b"

      - name: Save CCache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: ~/.cache/ccache

  # Job 4: Build minimal onnxruntime [exceptions ENABLED, type reduction ENABLED (globally allowed types)] and run tests
  build_minimal_globally_allowed_types:
    name: 4. Build Minimal (Globally Allowed Types)
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions: # Permissions needed for build-docker-image
      contents: read
      packages: write
      id-token: write # If using OIDC for ACR login
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup CCache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache | linux_minimal_build.yml | build_minimal_globally_allowed_types
          path: ~/.cache/ccache

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: linux-minimal-globally-allowed-types

      - uses: ./.github/actions/setup-build-tools
        with:
          install-ccache: 'true'

      - name: Build Full ORT and Prepare Test Files
        uses: microsoft/onnxruntime-github-actions/build-minimal-ort-and-run-tests@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          globally_allowed_types: 'bool,float,int8_t,uint8_t'
          enable-type-reduction: 'true'
          skip-model-tests: 'true'
          binary-size-report-name-prefix: "4"

      - name: Save CCache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: ~/.cache/ccache

  # Job 5: Build extended minimal onnxruntime and run tests
  build_extended_minimal:
    name: 5. Build Extended Minimal
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions: # Permissions needed for build-docker-image
      contents: read
      packages: write
      id-token: write # If using OIDC for ACR login
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup CCache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache | linux_minimal_build.yml | build_extended_minimal
          path: ~/.cache/ccache

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: linux-extended-minimal

      - name: Get Docker Image using Action
        uses: ./.github/actions/build-docker-image
        id: build_docker_image_step
        with:
          dockerfile: ${{ github.workspace }}/tools/ci_build/github/linux/docker/inference/x86_64/default/cpu/Dockerfile
          image-name: ghcr.io/microsoft/onnxruntime/onnxruntimecpubuildcix64
          push: true
          azure-container-registry-name: onnxruntimebuildcache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Run Build 5 (Update)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: Debug
          mode: 'update'
          extra_build_flags: >-
            --cmake_generator Ninja
            --build_shared_lib
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --minimal_build extended

      - name: Run Build 5 (Build)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: Debug
          mode: 'build'
          extra_build_flags: >-
            --cmake_generator Ninja
            --build_shared_lib
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --minimal_build extended

      - name: Run Build 5 (Test)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: Debug
          mode: 'test'
          extra_build_flags: >-
            --cmake_generator Ninja
            --build_shared_lib
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --minimal_build extended

      - name: Save CCache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: ~/.cache/ccache

  # Job 6a: Regular build with python and all optional features disabled.
  build_regular_no_optional:
    name: 6a. Build Regular (No Optional Features)
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions: # Permissions needed for build-docker-image
      contents: read
      packages: write
      id-token: write # If using OIDC for ACR login
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Get Docker Image using Action
        uses: ./.github/actions/build-docker-image
        id: build_docker_image_step
        with:
          dockerfile: ${{ github.workspace }}/tools/ci_build/github/linux/docker/inference/x86_64/default/cpu/Dockerfile
          image-name: ghcr.io/microsoft/onnxruntime/onnxruntimecpubuildcix64
          push: true
          azure-container-registry-name: onnxruntimebuildcache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: gen config
        shell: bash
        run: |
          mkdir -p ${{ runner.temp }}/.test_data
          touch ${{ runner.temp }}/.test_data/include_no_operators.config

      - name: Setup CCache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache | linux_minimal_build.yml | build_regular_no_optional
          path: ~/.cache/ccache

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: linux-regular-no-optional

      - name: Run Build 6a (Update)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: MinSizeRel
          mode: 'update'
          extra_build_flags: >-
            --cmake_generator Ninja
            --build_wheel
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --disable_ml_ops
            --disable_types string sparsetensor float4 float8 optional
            --include_ops_by_config /onnxruntime_src/build/.test_data/include_no_operators.config
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF

      - name: Run Build 6a (Build)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: MinSizeRel
          mode: 'build'
          extra_build_flags: >-
            --cmake_generator Ninja
            --build_wheel
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --disable_ml_ops
            --disable_types string sparsetensor float4 float8 optional
            --include_ops_by_config /onnxruntime_src/build/.test_data/include_no_operators.config
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF

      - name: Run Build 6a (Test)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: MinSizeRel
          mode: 'test'
          extra_build_flags: >-
            --cmake_generator Ninja
            --build_wheel
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --disable_ml_ops
            --disable_types string sparsetensor float4 float8 optional
            --include_ops_by_config /onnxruntime_src/build/.test_data/include_no_operators.config
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF

      - name: Save CCache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: ~/.cache/ccache

  # Job 6b: Minimal build with all optional features disabled.
  build_minimal_no_optional:
    name: 6b. Build Minimal (No Optional Features)
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions: # Permissions needed for build-docker-image
      contents: read
      packages: write
      id-token: write # If using OIDC for ACR login
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: gen config
        shell: bash
        run: |
          mkdir -p ${{ runner.temp }}/.test_data
          touch ${{ runner.temp }}/.test_data/include_no_operators.config

      - name: Get Docker Image using Action
        uses: ./.github/actions/build-docker-image
        id: build_docker_image_step
        with:
          dockerfile: ${{ github.workspace }}/tools/ci_build/github/linux/docker/inference/x86_64/default/cpu/Dockerfile
          image-name: ghcr.io/microsoft/onnxruntime/onnxruntimecpubuildcix64
          push: true
          azure-container-registry-name: onnxruntimebuildcache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup CCache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache | linux_minimal_build.yml | build_minimal_no_optional
          path: ~/.cache/ccache

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: linux-minimal-no-optional

      - name: Run Build 6b (Update)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: MinSizeRel # From original --config MinSizeRel
          mode: 'update'
          extra_build_flags: >-
            --cmake_generator Ninja
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --minimal_build
            --disable_exceptions
            --disable_ml_ops
            --skip_tests
            --enable_reduced_operator_type_support
            --disable_types string sparsetensor optional float4 float8
            --include_ops_by_config /onnxruntime_src/build/.test_data/include_no_operators.config
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF

      - name: Run Build 6b (Build)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: MinSizeRel # From original --config MinSizeRel
          mode: 'build'
          extra_build_flags: >-
            --cmake_generator Ninja
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --minimal_build
            --disable_exceptions
            --disable_ml_ops
            --skip_tests
            --enable_reduced_operator_type_support
            --disable_types string sparsetensor optional float4 float8
            --include_ops_by_config /onnxruntime_src/build/.test_data/include_no_operators.config
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF

      - name: Save CCache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: ~/.cache/ccache

  # Job 6c: Extended minimal build with all optional features disabled.
  build_extended_minimal_no_optional:
    name: 6c. Build Extended Minimal (No Optional Features)
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions: # Permissions needed for build-docker-image
      contents: read
      packages: write
      id-token: write # If using OIDC for ACR login
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: gen config
        shell: bash
        run: |
          mkdir -p ${{ runner.temp }}/.test_data
          touch ${{ runner.temp }}/.test_data/include_no_operators.config

      - name: Get Docker Image using Action
        uses: ./.github/actions/build-docker-image
        id: build_docker_image_step
        with:
          dockerfile: ${{ github.workspace }}/tools/ci_build/github/linux/docker/inference/x86_64/default/cpu/Dockerfile
          image-name: ghcr.io/microsoft/onnxruntime/onnxruntimecpubuildcix64
          push: true
          azure-container-registry-name: onnxruntimebuildcache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: gen config
        shell: bash
        run: |
          mkdir -p ${{ runner.temp }}/.test_data
          touch ${{ runner.temp }}/.test_data/include_no_operators.config

      - name: Setup CCache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache | linux_minimal_build.yml | build_extended_minimal_no_optional
          path: ~/.cache/ccache

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: linux-extended-minimal-no-optional

      - name: Run Build 6c (Update)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: MinSizeRel # From original --config MinSizeRel
          mode: 'update'
          extra_build_flags: >-
            --cmake_generator Ninja
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --minimal_build extended
            --disable_exceptions
            --disable_ml_ops
            --skip_tests
            --enable_reduced_operator_type_support
            --disable_types string sparsetensor optional float4 float8
            --include_ops_by_config /onnxruntime_src/build/.test_data/include_no_operators.config
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF

      - name: Run Build 6c (Build)
        uses: microsoft/onnxruntime-github-actions/run-build-script-in-docker@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
        with:
          docker_image: ${{ steps.build_docker_image_step.outputs.full-image-name }}
          build_config: MinSizeRel # From original --config MinSizeRel
          mode: 'build'
          extra_build_flags: >-
            --cmake_generator Ninja
            --parallel
            --use_binskim_compliant_compile_flags
            --use_cache
            --minimal_build extended
            --disable_exceptions
            --disable_ml_ops
            --skip_tests
            --enable_reduced_operator_type_support
            --disable_types string sparsetensor optional float4 float8
            --include_ops_by_config /onnxruntime_src/build/.test_data/include_no_operators.config
            --cmake_extra_defines onnxruntime_BUILD_UNIT_TESTS=OFF

      - name: Save CCache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: ~/.cache/ccache

  # Job 7: Extended minimal build with NNAPI EP for Android(arm64-v8a) and skip tests.
  # NOTE: Keeping this as direct docker run due to custom volume mounts needed for Android SDK/NDK
  build_extended_minimal_android:
    name: 7. Build Extended Minimal (Android NNAPI)
    needs: build_full_ort # Depends on Job 1 for test data
    runs-on: [ort-github-linux-16-amd-wcus-ss]
    timeout-minutes: 120
    permissions: # Permissions needed for build-docker-image
      contents: read
      packages: write
      id-token: write # If using OIDC for ACR login
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download Test Data Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test_data
          path: ${{ runner.temp }}/.test_data/

      - name: Get Docker Image using Action
        uses: ./.github/actions/build-docker-image
        id: build_docker_image_step
        with:
          dockerfile: ${{ github.workspace }}/tools/ci_build/github/linux/docker/inference/x86_64/default/cpu/Dockerfile
          image-name: ghcr.io/microsoft/onnxruntime/onnxruntimecpubuildcix64
          push: true
          azure-container-registry-name: onnxruntimebuildcache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android NDK
        uses: ./.github/actions/setup-android-ndk

      - name: Setup CCache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache | linux_minimal_build.yml | build_extended_minimal_android
          path: ~/.cache/ccache

      - name: Setup VCPKG Cache
        uses: ./.github/actions/setup-vcpkg-cache
        with:
          key: linux-extended-minimal-android

      - name: Run Build 7 (Using docker run)
        shell: bash
        run: |
          # Create the target dir for build output inside the runner's temp dir first
          mkdir -p ${{ runner.temp }}/7

          # Ensure ANDROID_NDK_HOME is available and get its real path
          if [ -z "$ANDROID_NDK_HOME" ]; then
            echo "ANDROID_NDK_HOME is not set."
            exit 1
          fi
          NDK_HOME_REALPATH=$(realpath $ANDROID_NDK_HOME)

          # Ensure ANDROID_HOME is available
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME is not set. Using default /usr/local/lib/android/sdk"
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi

          # mount `~/.cache` inside docker. assume `onnxruntimedev` is the container user (should match the docker-file specified earlier)
          mkdir -p ~/.cache/vcpkg

          docker run --rm \
            --volume ~/.cache:/home/onnxruntimedev/.cache \
            --volume ${{ env.BUILD_SOURCES_DIRECTORY }}:/onnxruntime_src \
            --volume ${{ runner.temp }}:/build \
            --volume $ANDROID_HOME:/android_home \
            --volume $NDK_HOME_REALPATH:/ndk_home \
            -e ALLOW_RELEASED_ONNX_OPSET_ONLY=1 \
            -e NIGHTLY_BUILD=1 -e RUNNER_TEMP=/build \
            ${{ steps.build_docker_image_step.outputs.full-image-name }} \
            bash -c "python3 -m pip install -r /onnxruntime_src/tools/ci_build/requirements/pybind/requirements.txt \
            && python3 /onnxruntime_src/tools/ci_build/build.py \
              --build_dir /build/7 \
              --cmake_generator Ninja \
              --config MinSizeRel \
              --skip_submodule_sync \
              --parallel \
              --use_binskim_compliant_compile_flags \
              --use_cache \
              --android \
              --android_sdk_path /android_home \
              --android_ndk_path /ndk_home \
              --android_abi=arm64-v8a \
              --android_api=29 \
              --use_nnapi \
              --minimal_build extended \
              --build_shared_lib \
              --disable_ml_ops \
              --disable_exceptions \
              --skip_tests"
        working-directory: ${{ env.BUILD_SOURCES_DIRECTORY }}

      - name: Save CCache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.ccache.outputs.cache-primary-key }}
          path: ~/.cache/ccache
