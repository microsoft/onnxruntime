name: Tooling Tests

on:
  push:
    branches:
    - main
    - rel-*
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling-tests:
    name: Tooling Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - uses: ./.github/actions/setup-build-tools

    - name: Install Python test dependencies
      run: python -m pip install -r requirements-dev.txt

    - name: Run Python tooling tests
      run: python -m pytest -c .github/workflows/tooling_tests.ini --rootdir=. -v --junitxml=tooling-test-results.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tooling-test-results-${{ matrix.os }}
        path: tooling-test-results.xml
