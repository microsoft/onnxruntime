name: Transformers Model Requirements

on:
  push:
    branches:
      - main
      - rel-*
    paths:
      - 'onnxruntime/python/tools/transformers/models/llama/requirements.txt'
      - 'onnxruntime/python/tools/transformers/models/stable_diffusion/requirements/**'
      - 'onnxruntime/python/tools/transformers/models/whisper/requirements.txt'
      - '.github/workflows/transformers_model_requirements.yml'
  pull_request:
    branches:
      - main
      - rel-*
    paths:
      - 'onnxruntime/python/tools/transformers/models/llama/requirements.txt'
      - 'onnxruntime/python/tools/transformers/models/stable_diffusion/requirements/**'
      - 'onnxruntime/python/tools/transformers/models/whisper/requirements.txt'
      - '.github/workflows/transformers_model_requirements.yml'

permissions:
  contents: read

jobs:
  llama-requirements:
    name: Validate Llama requirements
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: onnxruntime/python/tools/transformers/models/llama/requirements.txt

      - name: Install Llama requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r onnxruntime/python/tools/transformers/models/llama/requirements.txt
          python -m pip check

  stable-diffusion-requirements:
    name: Validate Stable Diffusion requirements
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: onnxruntime/python/tools/transformers/models/stable_diffusion/requirements/requirements.txt

      - name: Install Stable Diffusion requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r onnxruntime/python/tools/transformers/models/stable_diffusion/requirements/requirements.txt
          python -m pip check

  whisper-requirements:
    name: Validate Whisper requirements
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: onnxruntime/python/tools/transformers/models/whisper/requirements.txt

      - name: Install Whisper requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r onnxruntime/python/tools/transformers/models/whisper/requirements.txt
          python -m pip check
