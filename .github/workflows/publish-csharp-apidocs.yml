name: Update C# API Docs

# Run when the C# API changes or every week so that the artifact does not expire.
# Also runs on pull requests that touch relevant files so doc generation errors
# are caught early. The artifact is only published on the main branch.
on:
  push:
    branches:
      - main
    paths:
      - csharp/**
  pull_request:
    paths:
      - csharp/**
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: "apidocs-csharp-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: [ort-github-win-16-amd-scus-ss]
    timeout-minutes: 210
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Restore DocFX
      working-directory: csharp/ApiDocs
      run: dotnet tool restore
    # NOTE: We need to restore Microsoft.ML.OnnxRuntime.csproj manually to set IncludeMobileTargets=false
    # docfx doesn't seem to be able to do that properly resulting in build errors
    - name: Restore dependencies
      run: |
        dotnet restore csharp/ApiDocs/ApiDocs.csproj
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet restore /p:IncludeMobileTargets=false csharp/src/Microsoft.ML.OnnxRuntime/Microsoft.ML.OnnxRuntime.csproj
    - name: docfx metadata
      working-directory: csharp/ApiDocs
      run: dotnet tool run docfx metadata docfx.json
    - name: Build ApiDocs project
      run: |
        dotnet build csharp/ApiDocs/ApiDocs.csproj --no-restore
    - name: docfx build
      working-directory: csharp/ApiDocs
      run: |
        if (Test-Path -LiteralPath 'csharp') {
          Remove-Item -LiteralPath 'csharp' -Recurse -Force
        }
        dotnet tool run docfx build docfx.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        foreach ($path in @(
          'csharp\index.html',
          'csharp\index.json',
          'csharp\api\index.html',
          'csharp\api\toc.json',
          'csharp\api\Microsoft.ML.OnnxRuntime.html',
          'csharp\api\Microsoft.ML.OnnxRuntime.Tensors.html',
          'csharp\public\main.css',
          'csharp\logo.svg',
          'csharp\favicon.ico'
        )) {
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Generated C# documentation is missing $path"
          }
        }
        if (Test-Path -LiteralPath 'csharp\styles\docfx.vendor.js') {
          throw 'Generated C# documentation contains the legacy DocFX vendor bundle'
        }
    - name: Log source commit
      run: git rev-parse --short HEAD > csharp/ApiDocs/csharp/source-version.txt
    - name: Move C# docs into site
      shell: pwsh
      run: |
        New-Item -Path _site/docs/api -Force -ItemType "Directory" | Out-Null
        $OutputDirectory="_site/docs/api/csharp"
        if (Test-Path $OutputDirectory) { Remove-Item -Recurse -Force $OutputDirectory }
        Move-Item -Path csharp\ApiDocs\csharp -Destination $OutputDirectory
    - name: Upload docs artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: onnxruntime-csharp-apidocs
        path: _site
        retention-days: 10
