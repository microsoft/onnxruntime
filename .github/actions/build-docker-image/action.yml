name: Build Docker image with OIDC ACR read access
description: Resolve shared base-image pins and authenticate through GitHub OIDC with isolated credential cleanup. Requires id-token write permission.

inputs:
  azure-client-id:
    description: Client ID of the federated ACR reader identity; omitted or empty values use the ORT reader.
    required: false
  azure-tenant-id:
    description: Tenant ID of the federated ACR reader identity; omitted or empty values use the Microsoft tenant.
    required: false
  azure-container-registry-name:
    description: ACR registry name used for base-image read authentication.
    default: onnxruntimebuildcache
  azure-subscription-id:
    description: Azure subscription containing the ACR registry.
    default: 00c06639-6ee4-454e-8058-8d8b1703bd87
  dockerfile:
    description: Path to the Dockerfile.
    required: true
  image-name:
    description: Destination image repository, including the registry hostname.
    required: true
  base-image-family:
    description: Family from base-images.json; otherwise use the Dockerfile's configured default.
    default: ''
  build-args:
    description: Additional Docker build arguments.
    default: ''
  push:
    description: Allow image publication under the upstream action's trusted-branch restrictions.
    default: 'false'
  pull:
    description: Attempt to restore the cached image.
    default: 'true'

outputs:
  cache-hit:
    description: Whether the cached image was restored.
    value: ${{ steps.build.outputs.cache-hit }}
  image-tag:
    description: Calculated checksum tag.
    value: ${{ steps.build.outputs.image-tag }}
  full-image-name:
    description: Fully qualified image name and calculated tag.
    value: ${{ steps.build.outputs.full-image-name }}

runs:
  using: composite
  steps:
    - name: Resolve Docker base image
      id: resolve
      shell: bash
      env:
        DOCKERFILE: ${{ inputs.dockerfile }}
        BASE_IMAGE_FAMILY: ${{ inputs.base-image-family }}
        BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        # The resolved BASEIMAGE digest must be included in the Docker action's cache key.
        build_args="$(python3 "$GITHUB_WORKSPACE/tools/ci_build/resolve_docker_base_image.py" \
          --dockerfile "$DOCKERFILE" \
          --family "$BASE_IMAGE_FAMILY" \
          --build-args="$BUILD_ARGS")"
        printf 'build-args=%s\n' "$build_args" >> "$GITHUB_OUTPUT"

    - name: Prepare isolated authentication directories
      id: auth
      shell: bash
      env:
        CLIENT_ID: ${{ inputs.azure-client-id || 'c13bd353-9bcc-4d13-bb8c-a515a01efb25' }}
        TENANT_ID: ${{ inputs.azure-tenant-id || '72f988bf-86f1-41af-91ab-2d7cd011db47' }}
      run: |
        set -euo pipefail
        if [[ -z "$CLIENT_ID" || -z "$TENANT_ID" ]]; then
          echo "::error::azure-client-id and azure-tenant-id action inputs must be configured."
          exit 1
        fi
        auth_root="$(mktemp -d "$RUNNER_TEMP/acr-oidc.XXXXXX")"
        echo "root=$auth_root" >> "$GITHUB_OUTPUT"
        mkdir -m 700 "$auth_root/azure" "$auth_root/docker"

    - name: Authenticate to Azure using GitHub OIDC
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
      with:
        client-id: ${{ inputs.azure-client-id || 'c13bd353-9bcc-4d13-bb8c-a515a01efb25' }}
        tenant-id: ${{ inputs.azure-tenant-id || '72f988bf-86f1-41af-91ab-2d7cd011db47' }}
        subscription-id: ${{ inputs.azure-subscription-id }}
        audience: api://AzureADTokenExchange
      env:
        AZURE_CONFIG_DIR: ${{ steps.auth.outputs.root }}/azure
        AZURE_CORE_OUTPUT: none
        AZURE_LOGIN_POST_CLEANUP: 'false'

    - name: Authenticate Docker to ACR
      shell: bash
      env:
        AZURE_CONFIG_DIR: ${{ steps.auth.outputs.root }}/azure
        DOCKER_CONFIG: ${{ steps.auth.outputs.root }}/docker
        EXPECTED_CLIENT_ID: ${{ inputs.azure-client-id || 'c13bd353-9bcc-4d13-bb8c-a515a01efb25' }}
        ACR_NAME: ${{ inputs.azure-container-registry-name }}
        AZURE_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
      run: |
        set -euo pipefail
        actual_client_id="$(az account show --query user.name --output tsv)"
        actual_account_type="$(az account show --query user.type --output tsv)"
        if [[ "$actual_client_id" != "$EXPECTED_CLIENT_ID" ]]; then
          echo "::error::Azure client ID does not match the requested federated ACR reader identity."
          exit 1
        fi
        if [[ "$actual_account_type" != servicePrincipal ]]; then
          echo "::error::Azure account type must be servicePrincipal for the federated ACR reader identity."
          exit 1
        fi
        az acr login --name "$ACR_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --output none

    - name: Clear Azure credentials before building
      if: always() && steps.auth.outputs.root != ''
      shell: bash
      env:
        AZURE_CONFIG_DIR: ${{ steps.auth.outputs.root }}/azure
      run: |
        set -euo pipefail
        trap 'rm -rf -- "$AZURE_CONFIG_DIR"' EXIT
        az account clear

    - name: Build or restore Docker image
      id: build
      uses: microsoft/onnxruntime-github-actions/build-docker-image@8bad63a3c05d448311dfa8e5f531171c97471aa1 # v0.0.12
      with:
        dockerfile: ${{ inputs.dockerfile }}
        image-name: ${{ inputs.image-name }}
        build-args: ${{ steps.resolve.outputs.build-args }}
        push: ${{ inputs.push }}
        pull: ${{ inputs.pull }}
      env:
        DOCKER_CONFIG: ${{ steps.auth.outputs.root }}/docker

    - name: Clear isolated Docker credentials
      if: always() && steps.auth.outputs.root != ''
      shell: bash
      env:
        AUTH_ROOT: ${{ steps.auth.outputs.root }}
        DOCKER_CONFIG: ${{ steps.auth.outputs.root }}/docker
        ACR_NAME: ${{ inputs.azure-container-registry-name }}
      run: |
        set -euo pipefail
        trap 'rm -rf -- "$AUTH_ROOT"' EXIT
        docker logout "$ACR_NAME.azurecr.io"
