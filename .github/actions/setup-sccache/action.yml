name: Setup sccache
description: Reuse installed sccache, restore compiler outputs, and enable writes only on main.

inputs:
  key:
    description: Workflow/build variant and selected compiler/SDK identity. Configure the toolchain before calling.
    required: true
  cache-size:
    description: Maximum local compiler-cache size.
    default: 10G
  container-image:
    description: Optional build image with preinstalled sccache. No host install or host server is used.
    default: ''
  container-prefix:
    description: Toolchain PATH selection used by the pinned Docker build action.
    default: ''
  cache-prefix:
    description: Archive namespace for the workflow or pilot.
    default: sccache-v1

outputs:
  cache-primary-key:
    description: Snapshot key to pass to finish-sccache.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: Whether an exact snapshot was restored.
    value: ${{ steps.restore.outputs.cache-hit }}
  enabled:
    description: Main population or a successfully restored compatible snapshot.
    value: ${{ steps.select.outputs.enabled }}
  build-flags:
    description: Compiler launcher flags, empty for an unpopulated nonpublishing run.
    value: ${{ steps.select.outputs.build-flags }}

runs:
  using: composite
  steps:
    - name: Find installed sccache
      id: installed
      shell: python
      env:
        CACHE_CONTAINER_IMAGE: ${{ inputs.container-image }}
      run: |
        import os
        import shutil

        install = not os.environ["CACHE_CONTAINER_IMAGE"] and shutil.which("sccache") is None
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"install-required={str(install).lower()}\n")

    - name: Install sccache
      if: steps.installed.outputs.install-required == 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
        # finish-sccache reports statistics before stopping the server.
        disable_annotations: 'true'

    - name: Configure compiler cache
      id: configure
      shell: python
      env:
        CACHE_VARIANT: ${{ inputs.key }}
        CACHE_SIZE: ${{ inputs.cache-size }}
        CACHE_REF: ${{ github.ref }}
        CACHE_PREFIX: ${{ inputs.cache-prefix }}
        CACHE_CONTAINER_IMAGE: ${{ inputs.container-image }}
        CACHE_CONTAINER_PREFIX: ${{ inputs.container-prefix }}
      run: |
        import os
        import runpy

        runpy.run_path(os.path.join(os.environ["GITHUB_ACTION_PATH"], "cache.py"))["configure"]()

    - name: Restore compiler cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.configure.outputs.prefix }}${{ github.sha }}
        restore-keys: |
          ${{ steps.configure.outputs.prefix }}

    - name: Select compiler cache
      id: select
      shell: python
      env:
        CACHE_REF: ${{ github.ref }}
        CACHE_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        import os
        import runpy

        runpy.run_path(os.path.join(os.environ["GITHUB_ACTION_PATH"], "cache.py"))["select"]()

    - name: Start host compiler cache
      if: steps.select.outputs.enabled == 'true' && inputs.container-image == ''
      shell: python
      run: |
        import subprocess

        subprocess.run(["sccache", "--start-server"], check=True)
        subprocess.run(["sccache", "--zero-stats"], check=True)
