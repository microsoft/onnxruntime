name: Setup sccache
description: Install sccache, restore compiler outputs, and enable writes only on main.

inputs:
  key:
    description: Workflow/build variant and selected compiler/SDK identity. Configure the toolchain before calling.
    required: true
  cache-size:
    description: Maximum local compiler-cache size.
    default: 10G

outputs:
  cache-primary-key:
    description: Snapshot key to pass to finish-sccache.
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: Whether an exact snapshot was restored.
    value: ${{ steps.restore.outputs.cache-hit }}
  enabled:
    description: Whether this run can read a restored snapshot or populate the main baseline.
    value: ${{ steps.select.outputs.enabled }}
  build-flags:
    description: Compiler-cache flags, empty on non-main runs without a compatible snapshot.
    value: ${{ steps.select.outputs.build-flags }}

runs:
  using: composite
  steps:
    - name: Detect preinstalled sccache
      id: detect
      shell: python
      run: |
        import os
        import runpy
        from pathlib import Path

        runpy.run_path(str(Path(os.environ["GITHUB_ACTION_PATH"]) / "cache.py"))["detect"]()

    - name: Install sccache
      if: steps.detect.outputs.installed != 'true'
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.19.0
        # finish-sccache reports statistics before stopping the server.
        disable_annotations: 'true'

    - name: Configure compiler cache
      id: configure
      shell: python
      env:
        CACHE_VARIANT: ${{ inputs.key }}
        CACHE_SIZE: ${{ inputs.cache-size }}
        CACHE_REF: ${{ github.ref }}
      run: |
        import os
        import runpy
        from pathlib import Path

        runpy.run_path(str(Path(os.environ["GITHUB_ACTION_PATH"]) / "cache.py"))["configure"]()

    - name: Restore compiler cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: ${{ steps.configure.outputs.prefix }}${{ github.sha }}
        restore-keys: |
          ${{ steps.configure.outputs.prefix }}

    - name: Select compiler cache
      id: select
      shell: python
      env:
        CACHE_REF: ${{ github.ref }}
        CACHE_MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        import os
        import runpy
        from pathlib import Path

        runpy.run_path(str(Path(os.environ["GITHUB_ACTION_PATH"]) / "cache.py"))["select"]()

    - name: Start compiler cache
      if: steps.select.outputs.enabled == 'true'
      shell: python
      run: |
        import subprocess

        subprocess.run(["sccache", "--start-server"], check=True)
        subprocess.run(["sccache", "--zero-stats"], check=True)
