resources:
  pipelines:
  # Completion triggers are evaluated from the default branch. Keep the legacy
  # alias aligned with rel-1.30.1's YAML so its artifacts come from the right pipeline.
  - pipeline: build
    source: 'Zip-Nuget-Java-Nodejs Packaging Pipeline'
    trigger:
      branches:
        include:
        - refs/heads/rel-1.30.1
    branch: main
  - pipeline: buildCuda13
    source: 'Nuget - Packaging - CUDA13'
    trigger:
      branches:
        exclude:
        - refs/heads/rel-1.30.1
    branch: main
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
- template: templates/component-governance-variables.yml
- name: mavenVersion
  value: '3.9.8'

extends:
  # The pipeline extends the 1ES PT which will inject different SDL and compliance tasks.
  # For non-production pipelines, use "Unofficial" as defined below.
  # For productions pipelines, use "Official".
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    featureFlags:
      binskimScanAllExtensions: true
    sdl:
      binskim:
        enabled: true
        scanOutputDirectoryOnly: true
      sourceAnalysisPool:
        name: onnxruntime-Win-CPU-2022
        os: windows
      componentgovernance:
        ignoreDirectories: ${{ variables.componentGovernanceIgnoreDirectories }}
      spotBugs:
        enabled: false
        justificationForDisabling: "Getting ##[error]1. SpotBugs Error gdn.unknownFormatResult - File: spotbugs.xml, which indicates that SpotBugs found one or more errors, which are not handled by the Guardian right now."
      codeql:
        compiled:
          enabled: false
          justificationForDisabling: 'CodeQL is taking nearly 6 hours resulting in timeouts in our production pipelines'
      tsa:
        enabled: true
      codeSignValidation:
        enabled: true
        break: true
      policheck:
        enabled: true
        exclusionsFile: '$(Build.SourcesDirectory)\tools\ci_build\policheck_exclusions.xml'

    stages:
    - template: templates/final-jar-testing-win.yml
      parameters:
        PoolName: 'onnxruntime-Win-CPU-2022'
        PipelineResource: buildCuda13

    - template: templates/final-jar-testing-linux.yml
      parameters:
        OS: linux
        PoolName: 'onnxruntime-Ubuntu2204-AMD-CPU'
        PipelineResource: buildCuda13

    - template: templates/final-jar-testing-linux.yml
      parameters:
        OS: macOS
        PoolName: 'AcesShared'
        PoolDemands: 'ImageOverride -equals ACES_VM_SharedPool_Sequoia'
        PipelineResource: buildCuda13

    - template: templates/final-jar-testing-gpu.yml
      parameters:
        PipelineResource: buildCuda13
