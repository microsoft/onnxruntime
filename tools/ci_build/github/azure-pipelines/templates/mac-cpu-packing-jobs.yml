parameters:
- name: AdditionalBuildFlags
  displayName: Additional build flags for build.py
  type: string
  default: ''

# Must be 1 or 0
- name: AllowReleasedOpsetOnly
  displayName: Whether unreleased onnx opsets are allowed
  type: number
  default: 1
  values:
  - 1
  - 0

jobs:
  - job: MacOS_C_API_Packaging_CPU_arm64
    workspace:
      clean: all
    variables:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      ALLOW_RELEASED_ONNX_OPSET_ONLY: ${{ parameters.AllowReleasedOpsetOnly }}
    pool:
     name: AcesShared
     os: macOS
     demands:
     - ImageOverride -equals ACES_VM_SharedPool_Sequoia
    timeoutInMinutes: 300
    steps:
    - template: mac-cpu-packaging-steps.yml
      parameters:
        MacosArch: arm64
        ArtifactName: onnxruntime-osx-arm64
        BuildJavaNodejs: true
        AdditionalBuildFlags: ${{ parameters.AdditionalBuildFlags }} --use_coreml --use_webgpu --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=arm64

  - job: MacOS_C_API_Packaging_CPU_arm64_NuGet
    workspace:
      clean: all
    variables:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      ALLOW_RELEASED_ONNX_OPSET_ONLY: ${{ parameters.AllowReleasedOpsetOnly }}
    pool:
     name: AcesShared
     os: macOS
     demands:
     - ImageOverride -equals ACES_VM_SharedPool_Sequoia
    timeoutInMinutes: 300
    steps:
    - template: mac-cpu-packaging-steps.yml
      parameters:
        MacosArch: arm64
        ArtifactName: onnxruntime-osx-arm64-nuget
        BuildJavaNodejs: false
        AdditionalBuildFlags: ${{ parameters.AdditionalBuildFlags }} --use_coreml --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=arm64
