parameters:
- name: JobName
  type: string

- name: ArtifactName
  type: string

- name: BuildJavaNodejs
  type: boolean
  default: false

- name: AdditionalBuildFlags
  displayName: Additional build flags for build.py
  type: string
  default: ''

# Must be 1 or 0
- name: AllowReleasedOpsetOnly
  displayName: Whether unreleased onnx opsets are allowed
  type: number
  default: 1
  values:
  - 1
  - 0

jobs:
- job: ${{ parameters.JobName }}
  workspace:
    clean: all
  variables:
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    ALLOW_RELEASED_ONNX_OPSET_ONLY: ${{ parameters.AllowReleasedOpsetOnly }}
  pool:
    name: AcesShared
    os: macOS
    demands:
    - ImageOverride -equals ACES_VM_SharedPool_Sequoia
  timeoutInMinutes: 300
  steps:
  - template: jobs/checkout-and-git-redirect.yml

  - template: use-xcode-version.yml

  - template: setup-build-tools.yml
    parameters:
      host_cpu_arch: arm64

  - template: set-version-number-variables-step.yml

  - bash: |
      set -euxo pipefail
      export ONNX_ML=1
      export CMAKE_ARGS="-DONNX_GEN_PB_TYPE_STUBS=ON -DONNX_WERROR=OFF"
      python3 -m pip install -r "${BUILD_SOURCESDIRECTORY}/tools/ci_build/github/linux/docker/scripts/requirements.txt"
    displayName: "PIP install docker script requirements"

  - ${{ if eq(parameters.BuildJavaNodejs, true) }}:
    - script: |
        set -e -x
        if ! /usr/libexec/java_home -v 17 >/dev/null 2>&1; then
          brew install --cask temurin@17
        fi
        JAVA_HOME=$(/usr/libexec/java_home -v 17)

        # Do not output ##vso[] commands with `set -x` or they may be parsed again and include a trailing quote.
        set +x

        echo "JAVA_HOME is set to: $JAVA_HOME"
        echo "##vso[task.setvariable variable=JAVA_HOME]$JAVA_HOME"
        echo "##vso[task.prependpath]$JAVA_HOME/bin"
      displayName: 'Install JDK 17'

  - template: setup-vcpkg-cache.yml

  - script: |
        set -e -x
        rm -rf $(Build.BinariesDirectory)/Release
        build_java_nodejs_flags=()
        case '${{ parameters.BuildJavaNodejs }}' in
          True|true) build_java_nodejs_flags+=(--build_java --build_nodejs) ;;
        esac
        python3 $(Build.SourcesDirectory)/tools/ci_build/build.py --update --build ${{ parameters.AdditionalBuildFlags }} --use_coreml --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=arm64 "${build_java_nodejs_flags[@]}" --build_dir $(Build.BinariesDirectory) --skip_submodule_sync --parallel --use_vcpkg --use_vcpkg_ms_internal_asset_cache --use_binskim_compliant_compile_flags --build_shared_lib --config Release
        cd $(Build.BinariesDirectory)/Release
        make install DESTDIR=$(Build.BinariesDirectory)/installed
    displayName: 'Build arm64'

  - task: ShellScript@2
    displayName: 'Copy build artifacts for zipping'
    inputs:
      scriptPath: 'tools/ci_build/github/linux/copy_strip_binary.sh'
      args: '-r $(Build.BinariesDirectory) -a onnxruntime-osx-arm64-$(OnnxRuntimeVersion) -l libonnxruntime.$(OnnxRuntimeVersion).dylib -c Release -s $(Build.SourcesDirectory) -t $(Build.SourceVersion)'
      workingDirectory: '$(Build.BinariesDirectory)/Release'

  - bash: |
      mkdir -p $(Build.BinariesDirectory)/onnxruntime-osx-arm64-$(OnnxRuntimeVersion)/testdata
      cp $(Build.BinariesDirectory)/Release/libcustom_op_library.dylib $(Build.BinariesDirectory)/onnxruntime-osx-arm64-$(OnnxRuntimeVersion)/testdata/libcustom_op_library.dylib
      # Copy to testdata/testdata so EndToEndTests can find it when running in Debug configuration
      mkdir -p $(Build.BinariesDirectory)/testdata/testdata
      cp $(Build.BinariesDirectory)/Release/libcustom_op_library.dylib $(Build.BinariesDirectory)/testdata/testdata/libcustom_op_library.dylib
    displayName: 'Copy custom op library'
    condition: succeeded()

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(Build.BinariesDirectory)/onnxruntime-osx-arm64-$(OnnxRuntimeVersion)'
      includeRootFolder: true
      archiveType: 'tar' # Options: zip, 7z, tar, wim
      tarCompression: 'gz'
      archiveFile: '$(Build.ArtifactStagingDirectory)/onnxruntime-osx-arm64-$(OnnxRuntimeVersion).tgz'
      replaceExistingArchive: true

  - task: 1ES.PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifactName: '${{ parameters.ArtifactName }}'

  - ${{ if eq(parameters.BuildJavaNodejs, true) }}:
    - template: java-api-artifacts-package-and-publish-steps-posix.yml
      parameters:
        arch: 'osx-arm64'
        buildConfig: 'Release'
        artifactName: 'onnxruntime-java-osx-arm64'
        libraryName: 'libonnxruntime.dylib'
        nativeLibraryName: 'libonnxruntime4j_jni.dylib'

  - ${{ if eq(parameters.BuildJavaNodejs, true) }}:
    - template: nodejs-artifacts-package-and-publish-steps-posix.yml
      parameters:
        arch: arm64
        os: 'darwin'
        artifactName: 'drop-onnxruntime-nodejs-osx-arm64'
