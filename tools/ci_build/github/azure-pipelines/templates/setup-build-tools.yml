# Setup python/nodejs/cmake/vcpkg tools. Also, setup telemetry header file if the current OS is Windows.

parameters:
# for selecting python binary
- name: host_cpu_arch
  type: string

- name: python_version
  type: string
  default: '3.12'

steps:
- template: telemetry-steps.yml

- template: setup-feeds-and-python-steps.yml
  parameters:
    versionSpec: ${{ parameters.python_version }}
    architecture: ${{ parameters.host_cpu_arch }}

- task: UseNode@1
  inputs:
    version: '24.x'

- script: |
    node -v
    npm -v
  displayName: 'Display Node.js Version'

- script: |
    python3 -m pip install requests truststore
  displayName: 'Install Python requests package'

- powershell: |
    Write-Host "Process: $env:NO_PROXY"
    Write-Host "User:    $([Environment]::GetEnvironmentVariable('NO_PROXY', 'User'))"
    Write-Host "Machine: $([Environment]::GetEnvironmentVariable('NO_PROXY', 'Machine'))"
  displayName: Inspect proxy environment

- powershell: |
    $env:NO_PROXY = (($env:NO_PROXY -split ',') |
      Where-Object { $_ -ne '::1' -and $_ -notmatch '/' }) -join ','

    # Update the action version and SHA-512 together.
    $actionVersion = 'v0.0.9'
    $actionSha512 = '8908433e40233090887bf2eff16f73cfc29b40d5a5f95c8868ba7f30784850409e3fe1566bdf02ee8b565d8fa52c53efa8848c1e7e77b6d43488e305a8eb3f12'
    python tools/ci_build/run_setup_build_tools_gh_action.py $actionVersion $actionSha512
  displayName: Run setup-build-tools GitHub Action via Python Wrapper
