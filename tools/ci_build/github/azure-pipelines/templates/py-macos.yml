parameters:
- name: arch
  type: string

# Only used when multi_python_wheel is false.
- name: python_version
  type: string
  default: ''

# Only used when multi_python_wheel is true.
- name: python_versions
  type: object
  default: []

- name: multi_python_wheel
  displayName: >
    Build the native libraries once, recompile only the CPython extension module for every version in
    python_versions and merge the results into a single wheel that carries all of them.
  type: boolean
  default: false

- name: cmake_build_type
  type: string
  default: 'Release'
  values:
  - Debug
  - Release
  - RelWithDebInfo
  - MinSizeRel

- name: extra_build_arg
  type: string
  default: ''

jobs:
- ${{ if ne(parameters.multi_python_wheel, true) }}:
  - job: Mac_${{ parameters.arch }}_${{ replace(parameters.python_version,'.','_') }}
    timeoutInMinutes: 240
    workspace:
      clean: all
    pool:
      name: AcesShared
      os: macOS
      demands:
      - ImageOverride -equals ACES_VM_SharedPool_Sequoia
    templateContext:
      outputs:
      - output: pipelineArtifact
        targetPath: $(Build.SourcesDirectory)/build/Release/dist/fixed_wheels
        artifactName: onnxruntime-macos-${{ parameters.arch }}_${{ replace(parameters.python_version,'.','_') }}

    variables:
    - name: MACOSX_DEPLOYMENT_TARGET
      value: '14.0'

    steps:
    - checkout: self
      clean: true
      submodules: none

    - template: use-xcode-version.yml

    - template: setup-build-tools.yml
      parameters:
        host_cpu_arch: ${{ parameters.arch }}
        python_version: ${{ parameters.python_version }}

    - script: |
        set -e -x
        export _PYTHON_HOST_PLATFORM=macosx-${{variables.MACOSX_DEPLOYMENT_TARGET}}-${{ parameters.arch }}
        python3 -m pip install -r '$(Build.SourcesDirectory)/tools/ci_build/github/linux/docker/scripts/requirements.txt'
        python3 $(Build.SourcesDirectory)/tools/ci_build/build.py \
          --build_dir $(Build.SourcesDirectory)/build \
          --use_vcpkg --use_vcpkg_ms_internal_asset_cache \
          --use_binskim_compliant_compile_flags \
          --config Release \
          --build_wheel \
          --use_coreml ${{ parameters.extra_build_arg }} \
          --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=${{ parameters.arch }} \
          --update --skip_submodule_sync --build --parallel
        python -m pip install --upgrade delocate
        cd '$(Build.SourcesDirectory)/build/Release/dist'
        ls
        for file in *.whl
        do
          delocate-listdeps "$file"
          delocate-wheel --require-archs=${{ parameters.arch }} -w fixed_wheels -v "$file"
        done

- ${{ if eq(parameters.multi_python_wheel, true) }}:
  - job: Mac_${{ parameters.arch }}_multi_python
    timeoutInMinutes: 360
    workspace:
      clean: all
    pool:
      name: AcesShared
      os: macOS
      demands:
      - ImageOverride -equals ACES_VM_SharedPool_Sequoia
    templateContext:
      outputs:
      - output: pipelineArtifact
        targetPath: $(Build.SourcesDirectory)/build/Release/dist/merged_wheel
        artifactName: onnxruntime-macos-${{ parameters.arch }}

    variables:
    - name: MACOSX_DEPLOYMENT_TARGET
      value: '14.0'
    - name: python_exes_file
      value: $(Agent.TempDirectory)/python_exes.txt

    steps:
    - checkout: self
      clean: true
      submodules: none

    - template: use-xcode-version.yml

    - template: setup-build-tools.yml
      parameters:
        host_cpu_arch: ${{ parameters.arch }}
        python_version: ${{ parameters.python_versions[0] }}

    - script: rm -f '$(python_exes_file)'
      displayName: 'Reset the interpreter list'

    # An ${{ each }} directive cannot be expanded inside a block scalar, so the interpreters are
    # collected into a file that the build step below reads back.
    - ${{ each version in parameters.python_versions }}:
      - task: UsePythonVersion@0
        displayName: 'Install Python ${{ version }}'
        inputs:
          versionSpec: ${{ version }}
          architecture: ${{ parameters.arch }}

      - script: |
          set -e -x
          python3 -c 'import sys; print(sys.version)'
          which python3 >> '$(python_exes_file)'
        displayName: 'Record the Python ${{ version }} interpreter'

    - script: |
        set -e -x
        export _PYTHON_HOST_PLATFORM=macosx-${{variables.MACOSX_DEPLOYMENT_TARGET}}-${{ parameters.arch }}
        build_dir='$(Build.SourcesDirectory)/build'
        package_capi_dir="$build_dir/Release/onnxruntime/capi"
        native_lib_backup="$build_dir/native_lib_backup"

        run_build () {
          local python_exe=$1
          shift
          "$python_exe" $(Build.SourcesDirectory)/tools/ci_build/build.py \
            --build_dir "$build_dir" \
            --use_vcpkg --use_vcpkg_ms_internal_asset_cache \
            --use_binskim_compliant_compile_flags \
            --config Release \
            --use_coreml ${{ parameters.extra_build_arg }} \
            --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=${{ parameters.arch }} \
            --skip_submodule_sync --parallel "$@"
        }

        is_first_python="true"
        # macOS ships bash 3.2, which has no mapfile, so read the list with a plain while loop.
        while IFS= read -r python_exe
        do
          if [ -z "$python_exe" ]; then
            continue
          fi
          "$python_exe" -m pip install -r '$(Build.SourcesDirectory)/tools/ci_build/github/linux/docker/scripts/requirements.txt'

          if [ "$is_first_python" = "true" ]; then
            run_build "$python_exe" --update --build --build_wheel
            # Keep the native libraries that were just built. They contain no CPython symbols, so a
            # single copy serves every interpreter, but they have to stay byte identical for the
            # merge step to accept them.
            rm -rf "$native_lib_backup"
            mkdir -p "$native_lib_backup"
            find "$package_capi_dir" -maxdepth 1 -name '*.dylib' -exec cp -a {} "$native_lib_backup"/ \;
            ls -l "$native_lib_backup"
          else
            # Re-running CMake with a different interpreter can relink the native libraries, so the
            # extension module is built first and the saved libraries are restored before packaging.
            run_build "$python_exe" --update --build --target onnxruntime_pybind11_state
            cp -a "$native_lib_backup"/. "$package_capi_dir"/
            run_build "$python_exe" --build --build_wheel --target onnxruntime_pybind11_state
          fi
          is_first_python="false"
        done < '$(python_exes_file)'
      displayName: 'Build one wheel per Python version'

    - script: |
        set -e -x
        python3 -m pip install --upgrade delocate
        cd '$(Build.SourcesDirectory)/build/Release/dist'
        ls
        for file in *.whl
        do
          delocate-listdeps "$file"
          delocate-wheel --require-archs=${{ parameters.arch }} -w fixed_wheels -v "$file"
        done
        # Every wheel is delocated on its own first, because that is the well tested path. The merge
        # step then verifies that everything except the extension module is byte identical and fails
        # loudly if delocate produced different copies of the shared libraries.
        python3 $(Build.SourcesDirectory)/tools/ci_build/merge_python_wheels.py \
          --out-dir '$(Build.SourcesDirectory)/build/Release/dist/merged_wheel' \
          fixed_wheels/*.whl
      displayName: 'Merge the wheels'
