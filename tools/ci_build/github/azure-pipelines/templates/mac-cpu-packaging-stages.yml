# This stage fetch built macOS binaries from other stages, sign the binaries, then repack them

parameters:
- name: AdditionalBuildFlags
  displayName: Additional build flags for build.py
  type: string
  default: ''

# Must be 1 or 0
- name: AllowReleasedOpsetOnly
  displayName: Whether unreleased onnx opsets are allowed
  type: number
  default: 1
  values:
  - 1
  - 0

- name: DoESRP
  displayName: Do ESRP
  type: boolean
  default: false

stages:
- stage: MacOS_C_API_Packaging_CPU
  dependsOn: []
  jobs:
  - template: mac-cpu-packaging-job.yml
    parameters:
      JobName: MacOS_C_API_Packaging_CPU_arm64
      ArtifactName: onnxruntime-osx-arm64
      BuildJavaNodejs: true
      AllowReleasedOpsetOnly: ${{ parameters.AllowReleasedOpsetOnly }}
      AdditionalBuildFlags: ${{ parameters.AdditionalBuildFlags }} --use_webgpu

  - template: mac-cpu-packaging-job.yml
    parameters:
      JobName: MacOS_C_API_Packaging_CPU_arm64_NuGet
      ArtifactName: onnxruntime-osx-arm64-nuget
      BuildJavaNodejs: false
      AllowReleasedOpsetOnly: ${{ parameters.AllowReleasedOpsetOnly }}
      AdditionalBuildFlags: ${{ parameters.AdditionalBuildFlags }}

- stage: MacOS_C_API_Package_Publish
  dependsOn: MacOS_C_API_Packaging_CPU
  jobs:
  - template: mac-cpu-package-sign-job.yml
    parameters:
      JobName: MacOS_C_API_Package_Publish
      InputArtifactName: onnxruntime-osx-arm64
      OutputArtifactName: onnxruntime-osx

  - template: mac-cpu-package-sign-job.yml
    parameters:
      JobName: MacOS_C_API_Package_Publish_NuGet
      InputArtifactName: onnxruntime-osx-arm64-nuget
      OutputArtifactName: onnxruntime-osx-nuget
