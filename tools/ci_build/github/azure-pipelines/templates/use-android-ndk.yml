# Selects the Android NDK and sets ANDROID_NDK_HOME and ANDROID_NDK_ROOT to refer to it.

  parameters:
  - name: AndroidNdkVersion
    type: string
    default: "28"

  steps:
  - bash: |
      set -e

      NDK_PATH=$(python3 tools/ci_build/resolve_android_ndk.py \
        --android-sdk-root "${ANDROID_SDK_ROOT}" --ndk-version "${NDK_VERSION}")

      # Do not output ##vso[] commands with `set -x` or they may be parsed again and include a trailing quote.
      set +x

      set_var() {
        local VAR_NAME=${1:?}
        local VAR_VALUE=${2:?}
        echo "##vso[task.setvariable variable=${VAR_NAME}]${VAR_VALUE}"
        echo "${VAR_NAME}: ${VAR_VALUE}"
      }

      set_var "ANDROID_NDK_HOME" "${NDK_PATH}"
      set_var "ANDROID_NDK_ROOT" "${NDK_PATH}"

    displayName: Use Android NDK ${{ parameters.AndroidNdkVersion }}
    env:
      NDK_VERSION: ${{ parameters.AndroidNdkVersion }}
