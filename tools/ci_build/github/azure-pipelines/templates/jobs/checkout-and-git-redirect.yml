parameters:
- name: submodules
  type: string
  default: false

steps:

# Checkout implicitly sets up git if it's not set up. Checkout first to set up environment.
- checkout: self
  clean: true
  persistCredentials: ${{ ne(parameters.submodules, 'false') }}

# Set up git variables.
- pwsh: |
    git config --global --add url."https://PAT:${env:TOKEN}@aiinfra.visualstudio.com/Lotus-Dependencies/_git/".insteadOf "https://chromium.googlesource.com/chromium/src/third_party/"
    git config --global --add url."https://github.com/".insteadOf "https://chromium.googlesource.com/external/github.com/"
  displayName: Redirect chromium hosted dependencies to GitHub and Lotus-Dependencies
  env:
    TOKEN: $(System.AccessToken)

# Checkout submodules/clean checkout if needed.
- ${{ if ne(parameters.submodules, 'false') }}:
  - pwsh: |
      git submodule sync --recursive
      git submodule update --init --recursive
    displayName: Checkout submodules
