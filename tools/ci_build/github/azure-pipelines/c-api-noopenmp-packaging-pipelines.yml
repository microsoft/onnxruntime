parameters:
- name: RunOnnxRuntimeTests
  displayName: Run Tests?
  type: boolean
  default: true

- name: UseIncreasedTimeoutForTests
  displayName: Increase timeout for tests? Set it to false if you are doing an Onnx Runtime release.
  type: boolean
  default: false

- name: IsReleaseBuild
  displayName: Is a release build? Set it to true if you are doing an ONNX Runtime release.
  type: boolean
  default: false

- name: PreReleaseVersionSuffixString
  displayName: Suffix added to pre-release package version. Only used if IsReleaseBuild is true. Denotes the type of pre-release package.
  type: string
  values:
  - alpha
  - beta
  - rc
  - none
  default: none

- name: PreReleaseVersionSuffixNumber
  displayName: Number added to pre-release package version. Only used if IsReleaseBuild is true. Denotes the sequence of a pre-release package.
  type: number
  default: 0

# these 2 parameters are used for debugging.
- name: SpecificArtifact
  displayName: Use Specific Artifact (Debugging only)
  type: boolean
  default: false

- name: BuildId
  displayName: Pipeline BuildId, you could find it in the URL
  type: string
  default: '0'

- name: NugetPackageSuffix
  displayName: Suffix to append to nuget package
  type: string
  default: 'NONE'

- name: AdditionalBuildFlag
  displayName: Build flags to append to build command
  type: string
  default: '--use_azure'

# Do not update this to a version that does not exist for the qnn-runtime Maven package:
# https://mvnrepository.com/artifact/com.qualcomm.qti/qnn-runtime
- name: QnnSdk
  displayName: QNN SDK Version
  type: string
  default: 2.42.0.251225

- name: CudaVersion
  displayName: CUDA version
  type: string
  default: '12.8'
  values:
  - 12.8
  - 13.0

resources:
  repositories:
  - repository: onnxruntime-inference-examples # The name used to reference this repository in the checkout step
    type: github
    endpoint: ort-examples
    name: microsoft/onnxruntime-inference-examples
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

variables:
- template: templates/common-variables.yml
- name: win_trt_home
  ${{ if eq(parameters.CudaVersion, '12.8') }}:
    value: $(Agent.TempDirectory)\${{ variables.win_trt_folder_cuda12 }}
  ${{ if eq(parameters.CudaVersion, '13.0') }}:
    value: $(Agent.TempDirectory)\${{ variables.win_trt_folder_cuda13 }}
- name: win_cuda_home
  ${{ if eq(parameters.CudaVersion, '12.8') }}:
    value: $(Agent.TempDirectory)\v12.8
  ${{ if eq(parameters.CudaVersion, '13.0') }}:
    value: $(Agent.TempDirectory)\v13.0
- name: win_cudnn_home
  ${{ if eq(parameters.CudaVersion, '12.8') }}:
    value: ''
  ${{ if eq(parameters.CudaVersion, '13.0') }}:
    value: $(Agent.TempDirectory)\9.14.0.64_cuda13
- name: CudaArchs
  ${{ if eq(parameters.CudaVersion, '12.8') }}:
    value: '61-real;75-real;86-real;89-real;120-real;120-virtual'
  ${{ if eq(parameters.CudaVersion, '13.0') }}:
    value: '75-real;80-real;86-real;89-real;90-real;100-real;120-real;120-virtual'

extends:
  # The pipeline extends the 1ES PT which will inject different SDL and compliance tasks.
  # For non-production pipelines, use "Unofficial" as defined below.
  # For productions pipelines, use "Official".
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    featureFlags:
      binskimScanAllExtensions: true
    sdl:
      binskim:
        enabled: true
        scanOutputDirectoryOnly: true
      sourceAnalysisPool:
        name: onnxruntime-Win-CPU-VS2022-Latest
        os: windows
      componentgovernance:
        ignoreDirectories: '$(Build.Repository.LocalPath)/cmake/external/emsdk/upstream/emscripten/tests,$(Build.Repository.LocalPath)/cmake/external/onnx/third_party/benchmark,$(Build.Repository.LocalPath)/cmake/external/onnx/third_party/pybind11,$(Build.Repository.LocalPath)/cmake/external/onnx/third_party/pybind11/tests,$(Build.Repository.LocalPath)/cmake/external/onnxruntime-extensions,$(Build.Repository.LocalPath)/js/react_native/e2e/node_modules,$(Build.Repository.LocalPath)/js/node_modules,$(Build.Repository.LocalPath)/onnxruntime-inference-examples,$(Build.SourcesDirectory)/cmake/external/emsdk/upstream/emscripten/tests,$(Build.SourcesDirectory)/cmake/external/onnx/third_party/benchmark,$(Build.SourcesDirectory)/cmake/external/onnx/third_party/pybind11,$(Build.SourcesDirectory)/cmake/external/onnx/third_party/pybind11/tests,$(Build.SourcesDirectory)/cmake/external/onnxruntime-extensions,$(Build.SourcesDirectory)/js/react_native/e2e/node_modules,$(Build.SourcesDirectory)/js/node_modules,$(Build.SourcesDirectory)/onnxruntime-inference-examples,$(Build.BinariesDirectory)'
      sourceRepositoriesToScan:
        exclude:
        - repository: onnxruntime-inference-examples
      spotBugs:
        enabled: false
        justificationForDisabling: "Getting ##[error]1. SpotBugs Error gdn.unknownFormatResult - File: spotbugs.xml, which indicates that SpotBugs found one or more errors, which are not handled by the Guardian right now."
      codeql:
        compiled:
          enabled: false
          justificationForDisabling: 'CodeQL is taking nearly 6 hours resulting in timeouts in our production pipelines'
      tsa:
        enabled: true
      codeSignValidation:
        enabled: true
        break: true
      policheck:
        enabled: true
        exclusionsFile: '$(Build.SourcesDirectory)\tools\ci_build\policheck_exclusions.xml'

    stages:
    - stage: SeedVcpkgTelemetryAssets
      displayName: Seed vcpkg telemetry source assets
      jobs:
      - job: SeedVcpkgTelemetryAssets
        pool:
          name: onnxruntime-Win-CPU-VS2022-Latest
          os: windows
        templateContext:
          sdl:
            tsa:
              enabled: false
        steps:
        - checkout: none
        - pwsh: |
            $terrapin = 'C:\local\Terrapin\TerrapinRetrievalTool.exe'
            if (-not (Test-Path -LiteralPath $terrapin)) {
              throw "TerrapinRetrievalTool.exe was not found at $terrapin"
            }

            $assets = @(
              @{
                Url = 'https://github.com/microsoft/cpp_client_telemetry/archive/v3.10.173.1.tar.gz'
                Sha512 = 'e55bc35274236f57757660073c4dccccab3462342c8566212f1df4bf8824295a2bb3d3d79a11f3950e7c9252641827e9dd3d7c28c421dea3bdaee277e4f2ce32'
                FileName = 'microsoft-cpp_client_telemetry-v3.10.173.1.tar.gz'
              },
              @{
                Url = 'https://github.com/Mbed-TLS/mbedtls/archive/v3.6.5.tar.gz'
                Sha512 = 'd7a1e0098fed7b000ac2e4de31d43f427e8a046aeace91719f58222e1289470e15af5ed2a5390cf3693cf93a1efd79f34de9a6a960dc63cc0fd135072809e6e4'
                FileName = 'Mbed-TLS-mbedtls-v3.6.5.tar.gz'
              }
            )

            foreach ($asset in $assets) {
              $destination = Join-Path $env:AGENT_TEMPDIRECTORY $asset.FileName
              & $terrapin `
                -b 'https://vcpkg.storage.devpackages.microsoft.io/artifacts/' `
                -a true `
                -u Environment `
                -p $asset.Url `
                -s $asset.Sha512 `
                -d $destination
              Remove-Item -LiteralPath $destination -Force -ErrorAction SilentlyContinue

              $cacheUrl = "https://vcpkg.storage.devpackages.microsoft.io/artifacts/$($asset.Sha512)"
              $response = Invoke-WebRequest -Method Head -Uri $cacheUrl -UseBasicParsing
              if ($response.StatusCode -ne 200) {
                throw "Terrapin cache did not retain $($asset.Url)"
              }
            }
          displayName: Seed and verify telemetry assets
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    - template: stages/set_packaging_variables_stage.yml
      parameters:
        IsReleaseBuild: ${{ parameters.IsReleaseBuild }}
        PreReleaseVersionSuffixString: ${{ parameters.PreReleaseVersionSuffixString }}
        PreReleaseVersionSuffixNumber: ${{ parameters.PreReleaseVersionSuffixNumber }}

    - template: templates/c-api-cpu.yml
      parameters:
        RunOnnxRuntimeTests: ${{ parameters.RunOnnxRuntimeTests }}
        IsReleaseBuild: ${{ parameters.IsReleaseBuild }}
        PreReleaseVersionSuffixString: ${{ parameters.PreReleaseVersionSuffixString }}
        PreReleaseVersionSuffixNumber: ${{ parameters.PreReleaseVersionSuffixNumber }}
        ${{ if eq(parameters.NugetPackageSuffix, 'NONE') }}:
          OrtNugetPackageId: 'Microsoft.ML.OnnxRuntime'
        ${{ else }}:
          OrtNugetPackageId: 'Microsoft.ML.OnnxRuntime${{ parameters.NugetPackageSuffix }}'
        AdditionalBuildFlags: ''
        AdditionalWinBuildFlags: '--enable_onnx_tests ${{parameters.AdditionalBuildFlag}}'
        BuildVariant: 'default'
        QnnSDKVersion: ${{ parameters.QnnSdk }}
        is1ES: true

    - template: stages/java-cuda-packaging-stage.yml

    - template: stages/nuget-combine-cuda-stage.yml
      parameters:
        CudaVersion: ${{ parameters.CudaVersion }}
        RunOnnxRuntimeTests: ${{ parameters.RunOnnxRuntimeTests }}
        UseIncreasedTimeoutForTests: ${{ parameters.UseIncreasedTimeoutForTests }}
        win_trt_home: ${{ variables.win_trt_home }}
        win_cuda_home: ${{ variables.win_cuda_home }}
        DoEsrp: true
        IsReleaseBuild: ${{ parameters.IsReleaseBuild }}
        buildJava: true
        buildNodejs: true
        SpecificArtifact: ${{ parameters.SpecificArtifact }}
        BuildId: ${{ parameters.BuildId }}
        PreReleaseVersionSuffixString: ${{ parameters.PreReleaseVersionSuffixString }}
        PreReleaseVersionSuffixNumber: ${{ parameters.PreReleaseVersionSuffixNumber }}
        CudaArchs: ${{ variables.CudaArchs }}
        win_cudnn_home: ${{ variables.win_cudnn_home }}

    - template: stages/nodejs-win-packaging-stage.yml
      parameters:
        IsReleaseBuild: ${{ parameters.IsReleaseBuild }}
        ArtifactName: 'drop-onnxruntime-nodejs-win-x64'
        StageName: 'Windows_Nodejs_Packaging_x64'
        BuildCommand: --skip_submodule_sync --build_shared_lib --enable_onnx_tests --enable_wcos --use_dml --use_webgpu --build_nodejs --cmake_generator "Visual Studio 17 2022" --enable_generic_interface
        BuildArch: 'x64'
        EnvSetupScript: 'setup_env.bat'
        sln_platform: 'x64'
        DoEsrp: true
        PublishWebGpuBuildTools: true

    - template: stages/nodejs-win-packaging-stage.yml
      parameters:
        IsReleaseBuild: ${{ parameters.IsReleaseBuild }}
        ArtifactName: 'drop-onnxruntime-nodejs-win-arm64'
        StageName: 'Windows_Nodejs_Packaging_arm64'
        BuildCommand: --arm64 --skip_submodule_sync --build_shared_lib --enable_onnx_tests --enable_wcos --use_dml --use_webgpu --build_nodejs --cmake_generator "Visual Studio 17 2022" --enable_generic_interface
        BuildArch: 'x64'
        EnvSetupScript: 'setup_env.bat'
        sln_platform: 'arm64'
        DoEsrp: true
        DependsOnStageName: Windows_Nodejs_Packaging_x64
