parameters:
- name: stage_name
  type: string

- name: display_name
  type: string

- name: machine_pool
  type: string

- name: os
  type: string
  values:
  - linux
  - windows

- name: arch
  type: string
  values:
  - x64
  - arm64

- name: rid
  type: string

- name: package_id
  type: string

- name: package_expected
  type: string

stages:
- stage: ${{ parameters.stage_name }}
  displayName: ${{ parameters.display_name }}
  dependsOn: []
  jobs:
  - job: NuGet_Package_Assets_Test
    timeoutInMinutes: 30
    workspace:
      clean: all
    pool:
      name: ${{ parameters.machine_pool }}
      os: ${{ parameters.os }}
      ${{ if eq(parameters.arch, 'arm64') }}:
        hostArchitecture: Arm64
      ${{ if and(eq(parameters.os, 'windows'), eq(parameters.arch, 'arm64')) }}:
        demands:
        - Agent.Version -equals 4.264.2
    variables:
    - template: ../templates/common-variables.yml
    - name: CudaTestProject
      value: '$(Build.SourcesDirectory)/plugin-ep-cuda/csharp/test/CudaEpNuGetTest/CudaEpNuGetTest.csproj'
    steps:
    - checkout: self
      clean: true
      submodules: none

    - template: ../templates/read-cuda-plugin-metadata-steps.yml

    - download: build
      artifact: $(CudaPluginNuGetArtifactName)
      displayName: 'Download NuGet packages'

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $packageId = '${{ parameters.package_id }}'
        $packageExpected = '${{ parameters.package_expected }}' -eq 'true'
        $artifactDir = "$(Pipeline.Workspace)/build/$(CudaPluginNuGetArtifactName)"
        $nupkg = Get-ChildItem "$artifactDir/$packageId.*.nupkg" | Select-Object -First 1

        if (-not $nupkg) {
          if ($packageExpected) {
            throw "$packageId was expected but not found under $artifactDir"
          }
          Write-Host "##vso[task.logissue type=warning]$packageId was not produced by this packaging run; skipping its test."
          Write-Host "##vso[task.setvariable variable=CudaPluginNuGetPackageAvailable]false"
          exit 0
        }

        $localFeedDir = "$(Build.BinariesDirectory)/local_feed"
        New-Item -ItemType Directory -Path $localFeedDir -Force | Out-Null
        Copy-Item $nupkg.FullName $localFeedDir -Force

        if ($nupkg.BaseName -notmatch ('^' + [regex]::Escape($packageId) + '\.(\d.*)$')) {
          throw "Could not extract version from .nupkg filename: $($nupkg.Name)"
        }

        $packageVersion = $Matches[1]
        $minOrtVersionFile = "$(Build.SourcesDirectory)/plugin-ep-cuda/MIN_ONNXRUNTIME_VERSION"
        $minOrtVersion = (Get-Content $minOrtVersionFile -Raw).Trim()
        $nugetConfig = "$(Build.SourcesDirectory)/plugin-ep-cuda/csharp/test/CudaEpNuGetTest/nuget.config"

        Set-Content -Path $nugetConfig -Encoding UTF8 -Value @"
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <add key="local" value="$localFeedDir" />
          </packageSources>
        </configuration>
        "@

        Write-Host "Testing $packageId $packageVersion on ${{ parameters.os }}-${{ parameters.arch }}"
        Write-Host "##vso[task.setvariable variable=CudaPluginNuGetPackageAvailable]true"
        Write-Host "##vso[task.setvariable variable=OrtCudaPackageVersion]$packageVersion"
        Write-Host "##vso[task.setvariable variable=OrtCoreTestVersion]$minOrtVersion"
      displayName: 'Prepare RID-specific NuGet package'

    - task: UseDotNet@2
      displayName: 'Use .NET 8 SDK'
      condition: eq(variables['CudaPluginNuGetPackageAvailable'], 'true')
      inputs:
        packageType: sdk
        version: 8.x

    - task: NuGetAuthenticate@1
      condition: eq(variables['CudaPluginNuGetPackageAvailable'], 'true')

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        dotnet run --project "$(CudaTestProject)" --configuration Release `
          -p:OrtCudaPackageId=${{ parameters.package_id }} `
          -p:OrtCudaPackageVersion=$(OrtCudaPackageVersion) `
          -p:OrtCoreTestVersion=$(OrtCoreTestVersion) `
          -- --validate-package-assets ${{ parameters.rid }}
      displayName: 'Restore and validate RID-specific native asset'
      condition: eq(variables['CudaPluginNuGetPackageAvailable'], 'true')
