parameters:
- name: MACHINE_POOL
  type: string
  default: 'onnxruntime-Win2022-GPU-A10'

# Package name suffix
- name: EP_NAME
  type: string

- name: PYTHON_VERSION
  type: string

# Only used when multi_python_wheel is true. PYTHON_VERSION is then only a naming suffix.
- name: PYTHON_VERSIONS
  type: object
  default: []

- name: multi_python_wheel
  displayName: >
    Build the native libraries once, recompile only the CPython extension module for every version in
    PYTHON_VERSIONS and merge the results into a single wheel that carries all of them.
  type: boolean
  default: false

- name: EP_BUILD_FLAGS
  type: string

- name: BUILD_PY_PARAMETERS
  displayName: >
    Extra parameters to pass to build.py. Don't put newlines in here.
  type: string
  default: ''

- name: CudaVersion
  type: string
  default: '12.8'
  values:
    - 12.8
    - 13.0

- name: cmake_build_type
  type: string
  displayName: 'Linux packages cmake build type. Linux Only.'
  default: 'Release'
  values:
   - Debug
   - Release
   - RelWithDebInfo
   - MinSizeRel

- name: use_tensorrt
  type: boolean
  default: false

stages:
  - stage: Win_py_${{ parameters.EP_NAME }}_Wheels_${{ replace(parameters.PYTHON_VERSION,'.','_') }}_Build
    dependsOn: []
    jobs:
    - job: Win_py_${{ parameters.EP_NAME }}_Wheels_${{ replace(parameters.PYTHON_VERSION,'.','_') }}_Build
      ${{ if eq(parameters.multi_python_wheel, true) }}:
        timeoutInMinutes: 720
      ${{ else }}:
        timeoutInMinutes: 360
      workspace:
        clean: all
      pool:
        name: onnxruntime-Win-CPU-VS2022-Latest
        os: windows
      templateContext:
        sdl:
          codeSignValidation:
            enabled: true
            # TODO: check why pyd file was not signed
            break: false
            additionalTargetsGlobPattern: f|**\*.pyd
          psscriptanalyzer:
            enabled: true
          binskim:
            enabled: true
            scanOutputDirectoryOnly: true
        outputs:
        - output: pipelineArtifact
          targetPath: $(Build.ArtifactStagingDirectory)
          artifactName: win_${{ parameters.EP_NAME }}_wheel_${{ parameters.PYTHON_VERSION }}
      variables:
      - template: ../templates/common-variables.yml
      - name: GRADLE_OPTS
        value: '-Dorg.gradle.daemon=false'
      - name: VSGenerator
        value: 'Visual Studio 17 2022'
      - name: CUDA_MODULE_LOADING
        value: 'LAZY'
      - name: win_trt_folder
        ${{ if eq(parameters.CudaVersion, '12.8') }}:
          value: ${{ variables.win_trt_folder_cuda12 }}
        ${{ if eq(parameters.CudaVersion, '13.0') }}:
          value: ${{ variables.win_trt_folder_cuda13 }}
      - name: trt_build_flag
        ${{ if eq(parameters.use_tensorrt, true) }}:
          value: '--use_tensorrt --tensorrt_home="$(Agent.TempDirectory)\${{ variables.win_trt_folder }}"'
        ${{ if eq(parameters.use_tensorrt, false) }}:
          value: ''
      - name: build_wheel_flag
        ${{ if contains(parameters.EP_BUILD_FLAGS, 'use_cuda') }}:
          value: '--cuda_version=${{ parameters.CudaVersion }}'
        ${{ if contains(parameters.EP_BUILD_FLAGS, 'use_dml') }}:
          value: ''
      steps:
      - checkout: self
        clean: true
        submodules: none

      - template: ../templates/setup-build-tools.yml
        parameters:
          host_cpu_arch: 'x64'
          ${{ if eq(parameters.multi_python_wheel, true) }}:
            python_version: ${{ parameters.PYTHON_VERSIONS[0] }}
          ${{ else }}:
            python_version: ${{ parameters.PYTHON_VERSION }}

      - template: ../templates/jobs/download_win_gpu_library.yml
        parameters:
          CudaVersion: ${{ parameters.CudaVersion }}
          ${{ if or(contains(parameters.EP_BUILD_FLAGS, 'use_cuda'), eq(parameters.use_tensorrt, true)) }}:
            DownloadCUDA: true
          DownloadTRT: ${{ parameters.use_tensorrt }}


      - template: ../templates/set-nightly-build-option-variable-step.yml

      - ${{ if ne(parameters.multi_python_wheel, true) }}:
        - task: PythonScript@0
          displayName: 'Build'
          inputs:
            scriptPath: '$(Build.SourcesDirectory)\tools\ci_build\build.py'
            arguments: >-
              --config ${{ parameters.cmake_build_type }}
              --build_dir $(Build.BinariesDirectory)
              --skip_submodule_sync
              --cmake_generator "$(VSGenerator)"
              --enable_pybind
              --enable_onnx_tests
              --parallel
              --nvcc_threads 1
              --flash_nvcc_threads 1
              --use_vcpkg
              --use_vcpkg_ms_internal_asset_cache
              --use_binskim_compliant_compile_flags
              --update
              --build
              $(TelemetryOption)
              ${{ parameters.BUILD_PY_PARAMETERS }}
              ${{ parameters.EP_BUILD_FLAGS }}
              ${{ variables.trt_build_flag }}
            workingDirectory: '$(Build.BinariesDirectory)'


        - ${{if or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/rel-'))}}:
          - template: ../templates/publish-symbolrequestprod-api.yml
            parameters:
              ${{if eq(variables['Build.SourceBranch'], 'refs/heads/main')}}:
                symbolExpiryTime: 60
              includePublicSymbolServer: true
              symbolsArtifactName: onnxruntime_gpu_win_x64_${{ parameters.PYTHON_VERSION }}
              symbolsVersion: $(Build.BuildId)
              symbolProject: 'ONNX Runtime'
              subscription: 'OnnxrunTimeCodeSign_20240611'
              searchPattern: |
                $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime.pdb
                $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime_providers_shared.pdb
                $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime_providers_cuda.pdb
                $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime_providers_tensorrt.pdb
                $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime_providers_dml.pdb
                $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime_pybind11_state.pdb


        # Esrp signing
        - template: ../templates/win-esrp-dll.yml
          parameters:
            FolderPath: '$(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime\capi'
            DisplayName: 'ESRP - Sign Native dlls'
            DoEsrp: true
            Pattern: '*.pyd,*.dll'

        - task: PythonScript@0
          displayName: 'Build wheel'
          inputs:
            scriptPath: '$(Build.SourcesDirectory)\setup.py'
            arguments: 'bdist_wheel ${{ parameters.BUILD_PY_PARAMETERS }} $(NightlyBuildOption) --wheel_name_suffix=${{ parameters.EP_NAME }} ${{ variables.build_wheel_flag }}'
            workingDirectory: '$(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}'

        - task: CopyFiles@2
          displayName: 'Copy Python Wheel to: $(Build.ArtifactStagingDirectory)'
          inputs:
            SourceFolder: '$(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\dist'
            Contents: '*.whl'
            TargetFolder: '$(Build.ArtifactStagingDirectory)'

      - ${{ else }}:
        - ${{ each version in parameters.PYTHON_VERSIONS }}:
          - task: UsePythonVersion@0
            displayName: 'Use Python ${{ version }}'
            inputs:
              versionSpec: ${{ version }}
              architecture: 'x64'

          - script: python -m pip install -r $(Build.SourcesDirectory)\tools\ci_build\github\windows\python\requirements.txt
            displayName: 'Install build requirements for Python ${{ version }}'
            env:
              TMPDIR: "$(Agent.TempDirectory)"

          # The first interpreter builds everything, including the CUDA and TensorRT providers that
          # dominate this package. The remaining ones only recompile the CPython extension module.
          - ${{ if eq(version, parameters.PYTHON_VERSIONS[0]) }}:
            - task: PythonScript@0
              displayName: 'Build - Python ${{ version }}'
              inputs:
                scriptPath: '$(Build.SourcesDirectory)\tools\ci_build\build.py'
                arguments: >-
                  --config ${{ parameters.cmake_build_type }}
                  --build_dir $(Build.BinariesDirectory)
                  --skip_submodule_sync
                  --cmake_generator "$(VSGenerator)"
                  --enable_pybind
                  --enable_onnx_tests
                  --parallel
                  --nvcc_threads 1
                  --flash_nvcc_threads 1
                  --use_vcpkg
                  --use_vcpkg_ms_internal_asset_cache
                  --use_binskim_compliant_compile_flags
                  --update
                  --build
                  $(TelemetryOption)
                  ${{ parameters.BUILD_PY_PARAMETERS }}
                  ${{ parameters.EP_BUILD_FLAGS }}
                  ${{ variables.trt_build_flag }}
                workingDirectory: '$(Build.BinariesDirectory)'
          - ${{ else }}:
            - task: PythonScript@0
              displayName: 'Build extension module - Python ${{ version }}'
              inputs:
                scriptPath: '$(Build.SourcesDirectory)\tools\ci_build\build.py'
                arguments: >-
                  --config ${{ parameters.cmake_build_type }}
                  --build_dir $(Build.BinariesDirectory)
                  --skip_submodule_sync
                  --cmake_generator "$(VSGenerator)"
                  --enable_pybind
                  --enable_onnx_tests
                  --parallel
                  --nvcc_threads 1
                  --flash_nvcc_threads 1
                  --use_vcpkg
                  --use_vcpkg_ms_internal_asset_cache
                  --use_binskim_compliant_compile_flags
                  --update
                  --build
                  --target onnxruntime_pybind11_state
                  $(TelemetryOption)
                  ${{ parameters.BUILD_PY_PARAMETERS }}
                  ${{ parameters.EP_BUILD_FLAGS }}
                  ${{ variables.trt_build_flag }}
                workingDirectory: '$(Build.BinariesDirectory)'

            # Re-running CMake with a different interpreter can relink the native libraries, which
            # would also drop the signature they already carry, so restore the saved copies.
            - task: PowerShell@2
              displayName: 'Restore the signed native dlls - Python ${{ version }}'
              inputs:
                targetType: inline
                script: |
                  $capi = "$(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime\capi"
                  Copy-Item -Path "$(Build.BinariesDirectory)\native_lib_backup\*.dll" -Destination $capi -Force
                  Get-ChildItem $capi | Format-Table Name, Length

          - ${{if or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/rel-'))}}:
            - template: ../templates/publish-symbolrequestprod-api.yml
              parameters:
                ${{if eq(variables['Build.SourceBranch'], 'refs/heads/main')}}:
                  symbolExpiryTime: 60
                includePublicSymbolServer: true
                symbolsArtifactName: onnxruntime_gpu_win_x64_${{ version }}
                symbolsVersion: $(Build.BuildId)
                symbolProject: 'ONNX Runtime'
                subscription: 'OnnxrunTimeCodeSign_20240611'
                searchPattern: |
                  $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime.pdb
                  $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime_providers_shared.pdb
                  $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime_providers_cuda.pdb
                  $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime_providers_tensorrt.pdb
                  $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime_providers_dml.pdb
                  $(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime_pybind11_state.pdb

          # Esrp signing. The native dlls are signed once, together with the first extension module.
          # The later interpreters only produce a new .pyd, so only that one has to be signed again.
          - template: ../templates/win-esrp-dll.yml
            parameters:
              FolderPath: '$(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime\capi'
              DisplayName: 'ESRP - Sign Native dlls - Python ${{ version }}'
              DoEsrp: true
              ${{ if eq(version, parameters.PYTHON_VERSIONS[0]) }}:
                Pattern: '*.pyd,*.dll'
              ${{ else }}:
                Pattern: '*.pyd'

          - ${{ if eq(version, parameters.PYTHON_VERSIONS[0]) }}:
            - task: PowerShell@2
              displayName: 'Save the signed native dlls'
              inputs:
                targetType: inline
                script: |
                  $backup = "$(Build.BinariesDirectory)\native_lib_backup"
                  Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $backup
                  New-Item -ItemType Directory -Force -Path $backup | Out-Null
                  $capi = "$(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\onnxruntime\capi"
                  Copy-Item -Path "$capi\*.dll" -Destination $backup -Force
                  Get-ChildItem $backup | Format-Table Name, Length

          - task: PythonScript@0
            displayName: 'Build wheel - Python ${{ version }}'
            inputs:
              scriptPath: '$(Build.SourcesDirectory)\setup.py'
              arguments: 'bdist_wheel ${{ parameters.BUILD_PY_PARAMETERS }} $(NightlyBuildOption) --wheel_name_suffix=${{ parameters.EP_NAME }} ${{ variables.build_wheel_flag }}'
              workingDirectory: '$(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}'

        - task: PowerShell@2
          displayName: 'Merge the wheels'
          inputs:
            targetType: inline
            script: |
              $dist = "$(Build.BinariesDirectory)\${{ parameters.cmake_build_type }}\${{ parameters.cmake_build_type }}\dist"
              $wheels = @(Get-ChildItem -Path $dist -Filter *.whl | ForEach-Object { $_.FullName })
              Write-Host "merging $($wheels.Count) wheels"
              python $(Build.SourcesDirectory)\tools\ci_build\merge_python_wheels.py --out-dir "$(Build.ArtifactStagingDirectory)" @wheels
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - script: |
          7z x *.whl
        workingDirectory: '$(Build.ArtifactStagingDirectory)'
        displayName: 'unzip the package'


  - stage: Win_py_${{ parameters.EP_NAME }}_Wheels_${{ replace(parameters.PYTHON_VERSION,'.','_') }}_Tests
    dependsOn: Win_py_${{ parameters.EP_NAME }}_Wheels_${{ replace(parameters.PYTHON_VERSION,'.','_') }}_Build
    jobs:
    - job: Win_py_${{ parameters.EP_NAME }}_Wheels_${{ replace(parameters.PYTHON_VERSION,'.','_') }}_Tests
      workspace:
        clean: all
      pool:
        name: ${{parameters.MACHINE_POOL}}
        os: windows
      templateContext:
        inputs:
        - input: pipelineArtifact
          artifactName: win_${{ parameters.EP_NAME }}_wheel_${{ parameters.PYTHON_VERSION }}
          targetPath: '$(Build.ArtifactStagingDirectory)'
      steps:
        - checkout: self
          clean: true
          submodules: none

        - template: ../templates/setup-feeds-and-python-steps.yml
          parameters:
            ${{ if eq(parameters.multi_python_wheel, true) }}:
              versionSpec: ${{ parameters.PYTHON_VERSIONS[0] }}
            ${{ else }}:
              versionSpec: ${{ parameters.PYTHON_VERSION }}
            architecture: 'x64'

        - template: ../templates/jobs/download_win_gpu_library.yml
          parameters:
            CudaVersion: ${{ parameters.CudaVersion }}
            ${{ if or(contains(parameters.EP_BUILD_FLAGS, 'use_cuda'), eq(parameters.use_tensorrt, true)) }}:
              DownloadCUDA: true
            DownloadTRT: ${{ parameters.use_tensorrt }}

        - script: python -m pip install -r $(Build.SourcesDirectory)\tools\ci_build\github\windows\python\requirements.txt
          env:
            TMPDIR: "$(Agent.TempDirectory)"

        - powershell: |
            $ErrorActionPreference = "Stop"
            python -m pip uninstall -y onnxruntime onnxruntime-${{ parameters.EP_NAME }} -qq
            dir $(Build.ArtifactStagingDirectory)
            python -m pip --disable-pip-version-check install --no-index --find-links $(Build.ArtifactStagingDirectory) onnxruntime-${{ parameters.EP_NAME }}
            mkdir -p $(Agent.TempDirectory)\ort_test_data
            Copy-Item -Path $(Build.sourcesDirectory)/onnxruntime/test/python/onnx_backend_test_series.py -Destination $(Agent.TempDirectory)\ort_test_data
            Copy-Item -Recurse -Path $(Build.sourcesDirectory)/onnxruntime/test/testdata -Destination $(Agent.TempDirectory)\ort_test_data
            cd $(Agent.TempDirectory)\ort_test_data
            python -m pip install psutil py-cpuinfo py3nvml
            python -c "import onnxruntime; onnxruntime.print_debug_info()"
            python onnx_backend_test_series.py
          workingDirectory: '$(Build.sourcesDirectory)'
          displayName: 'Run Python Tests'
