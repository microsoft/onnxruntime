parameters:
- name: stage_name
  type: string

- name: arch
  type: string
  values:
  - x64
  - aarch64

- name: machine_pool
  type: string

- name: package_version
  type: string

- name: version_file
  type: string

- name: cmake_build_type
  type: string
  values:
   - Debug
   - Release
   - RelWithDebInfo
   - MinSizeRel

- name: docker_base_image
  type: string

- name: docker_repository
  type: string

- name: artifact_name
  type: string

- name: python_artifact_name
  type: string

stages:
- stage: ${{ parameters.stage_name }}
  dependsOn: []
  jobs:
  - job: ${{ parameters.stage_name }}
    timeoutInMinutes: 240
    workspace:
      clean: all
    pool:
      name: ${{ parameters.machine_pool }}
      os: linux
      ${{ if eq(parameters.arch, 'aarch64') }}:
        hostArchitecture: Arm64
    templateContext:
      outputs:
      - output: pipelineArtifact
        targetPath: $(Build.ArtifactStagingDirectory)
        artifactName: ${{ parameters.artifact_name }}
    variables:
      - template: ../templates/common-variables.yml
    steps:
      - checkout: self
        clean: true
        submodules: recursive

      - template: ../templates/set-nightly-build-option-variable-step.yml

      - template: ../templates/set-plugin-ep-build-variables-step.yml
        parameters:
          package_version: ${{ parameters.package_version }}
          version_file: ${{ parameters.version_file }}

      - template: ../templates/setup-feeds-and-python-steps.yml
        parameters:
          architecture: ${{ parameters.arch }}

      - template: ../templates/get-docker-image-steps.yml
        parameters:
          Dockerfile: tools/ci_build/github/linux/docker/inference/shared/python/webgpu/Dockerfile
          Context: tools/ci_build/github/linux/docker/inference/shared/python/webgpu
          DockerBuildArgs: "--build-arg BASEIMAGE=${{ parameters.docker_base_image }} --build-arg BUILD_UID=$( id -u )"
          Repository: ${{ parameters.docker_repository }}

      - script: $(Build.SourcesDirectory)/tools/ci_build/github/linux/build_webgpu_plugin_package.sh -i ${{ parameters.docker_repository }} -c ${{ parameters.cmake_build_type }}
        workingDirectory: $(Build.SourcesDirectory)
        displayName: 'Build WebGPU Plugin'
        env:
          EXTRA_CMAKE_DEFINES: $(PluginEpVersionDefine)

      - script: |
          set -e -x
          mkdir -p $(Build.ArtifactStagingDirectory)/bin
          plugin_path="$(Build.BinariesDirectory)/${{ parameters.cmake_build_type }}/libonnxruntime_providers_webgpu.so"
          if [ ! -f "$plugin_path" ]; then
            echo "Error: Expected plugin binary not found at '$plugin_path'. Failing build to avoid publishing an invalid package."
            exit 1
          fi
          cp "$plugin_path" "$(Build.ArtifactStagingDirectory)/bin/"
        displayName: 'Copy plugin binaries'

      - script: |
          set -e -x
          mkdir -p "$(Build.ArtifactStagingDirectory)/version"
          touch "$(Build.ArtifactStagingDirectory)/version/$(PluginPackageVersion)"
        displayName: 'Create version marker file'

  # Python package build job
  - job: ${{ parameters.stage_name }}_Python_Package
    dependsOn: ${{ parameters.stage_name }}
    timeoutInMinutes: 60
    workspace:
      clean: all
    pool:
      name: ${{ parameters.machine_pool }}
      os: linux
      ${{ if eq(parameters.arch, 'aarch64') }}:
        hostArchitecture: Arm64
    templateContext:
      outputs:
      - output: pipelineArtifact
        targetPath: $(Build.ArtifactStagingDirectory)/python
        artifactName: ${{ parameters.python_artifact_name }}
    variables:
    - template: ../templates/common-variables.yml
    steps:
    - checkout: self
      clean: true
      submodules: none

    - template: ../templates/set-nightly-build-option-variable-step.yml

    - template: ../templates/set-plugin-ep-build-variables-step.yml
      parameters:
        package_version: ${{ parameters.package_version }}
        version_file: ${{ parameters.version_file }}

    - template: ../templates/setup-feeds-and-python-steps.yml
      parameters:
        architecture: ${{ parameters.arch }}

    - template: ../templates/get-docker-image-steps.yml
      parameters:
        Dockerfile: tools/ci_build/github/linux/docker/inference/shared/python/webgpu/Dockerfile
        Context: tools/ci_build/github/linux/docker/inference/shared/python/webgpu
        DockerBuildArgs: "--build-arg BASEIMAGE=${{ parameters.docker_base_image }} --build-arg BUILD_UID=$( id -u )"
        Repository: ${{ parameters.docker_repository }}

    - task: DownloadPipelineArtifact@2
      displayName: 'Download plugin build artifacts'
      inputs:
        artifactName: ${{ parameters.artifact_name }}
        targetPath: '$(Build.BinariesDirectory)/plugin_artifacts'

    - script: |
        set -e -x
        $(Build.SourcesDirectory)/tools/ci_build/github/linux/build_webgpu_plugin_python_package.sh \
          -i ${{ parameters.docker_repository }} \
          -v "$(PluginPythonPackageVersion)"
      displayName: 'Build Python wheel'
