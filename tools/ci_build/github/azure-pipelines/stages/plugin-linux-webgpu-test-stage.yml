parameters:
- name: arch
  type: string
  values:
  - x64
  - aarch64

stages:
# Test stage.
#
# This stage runs against a software Vulkan implementation (SwiftShader,
# built from source in the Docker image). It does not require a GPU agent,
# so it uses the standard CPU pool. The ICD selection is pinned at
# `docker run` time via VK_ICD_FILENAMES / VK_DRIVER_FILES (see below) so
# the image remains reusable for a potential future real-GPU test job.
- stage: Linux_plugin_webgpu_${{ parameters.arch }}_Test
  dependsOn: []
  pool:
    ${{ if eq(parameters.arch, 'aarch64') }}:
      name: onnxruntime-linux-ARM64-CPU-2019
      os: linux
      hostArchitecture: Arm64
    ${{ else }}:
      name: onnxruntime-Ubuntu2404-AMD-CPU
      os: linux
  variables:
    ${{ if eq(parameters.arch, 'aarch64') }}:
      DockerBaseImage: onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cpu_aarch64_almalinux8_gcc14:20251017.1
      DockerRepository: onnxruntimewebgpupluginaarch64
    ${{ else }}:
      DockerBaseImage: onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cpu_x64_almalinux8_gcc14:20251017.1
      DockerRepository: onnxruntimewebgpuplugin
  jobs:
  - job: Linux_plugin_webgpu_${{ parameters.arch }}_Test_Python_Test
    timeoutInMinutes: 60
    workspace:
      clean: all
    steps:
    - template: ../templates/jobs/checkout-and-git-redirect.yml

    - template: ../templates/setup-feeds-and-python-steps.yml
      parameters:
        architecture: ${{ parameters.arch }}

    - template: ../templates/get-docker-image-steps.yml
      parameters:
        Dockerfile: tools/ci_build/github/linux/docker/inference/shared/python/webgpu/Dockerfile
        Context: tools/ci_build/github/linux/docker/inference/shared/python/webgpu
        DockerBuildArgs: "--build-arg BASEIMAGE=$(DockerBaseImage) --build-arg BUILD_UID=$( id -u )"
        Repository: $(DockerRepository)

    # Download the Python wheel produced by the packaging pipeline run that
    # triggered this pipeline (or that was selected at queue time).
    - download: build
      artifact: webgpu_plugin_python_linux_${{ parameters.arch }}
      displayName: 'Download Python wheel'

    - script: |
        set -e -x
        mkdir -p "$(Build.BinariesDirectory)/python_wheel"
        cp -R "$(Pipeline.Workspace)/build/webgpu_plugin_python_linux_${{ parameters.arch }}/"* "$(Build.BinariesDirectory)/python_wheel/"
      displayName: 'Stage Python wheel for test container'

    - script: |
        set -e -x

        # VK_ICD_FILENAMES and VK_DRIVER_FILES pin Vulkan to SwiftShader (software Vulkan, built from source in the
        # Docker image) so the test does not require a GPU agent.
        # ORT device discovery does not identify SwiftShader as GPU hardware, so ORT_WEBGPU_EP_ALLOW_SOFTWARE_ADAPTER
        # opts in to advertising WebGPU against the CPU device.
        # Keeping these environment variables at `docker run` time (rather than baking them into the image) leaves the
        # image reusable for a potential future real-GPU test job.

        swiftshader_icd=/opt/swiftshader/vk_swiftshader_icd.json

        min_ort_version_file="$(Build.SourcesDirectory)/plugin-ep-webgpu/MIN_ONNXRUNTIME_VERSION"
        min_ort_version=$(tr -d '\r\n' < "$min_ort_version_file")
        echo "using minimum onnxruntime version ${min_ort_version} from ${min_ort_version_file}"

        docker run --rm \
          --volume "$(Build.SourcesDirectory):/onnxruntime_src" \
          --volume "$(Build.BinariesDirectory):/build" \
          --env "PIP_INDEX_URL=${PIP_INDEX_URL}" \
          --env "VK_ICD_FILENAMES=${swiftshader_icd}" \
          --env "VK_DRIVER_FILES=${swiftshader_icd}" \
          --env "ORT_WEBGPU_EP_ALLOW_SOFTWARE_ADAPTER=1" \
          --env "ORT_TEST_VERBOSE=$(OrtTestVerbose)" \
          --env "ORT_WEBGPU_TEST_REQUIRE_EP_DEVICE=1" \
          --env "MIN_ORT_VERSION=${min_ort_version}" \
          $(DockerRepository) \
          /bin/bash -c '
            set -e -x
            python3 -m venv /build/test_venv
            source /build/test_venv/bin/activate
            python3 -m pip install onnx "onnxruntime==${MIN_ORT_VERSION}" numpy
            wheel=$(find /build/python_wheel -name "onnxruntime_ep_webgpu-*.whl" | head -1)
            python3 -m pip install "$wheel"
            python3 -u /onnxruntime_src/plugin-ep-webgpu/python/test/test_webgpu_plugin_ep.py
          '
      displayName: 'Install and test Python package'
