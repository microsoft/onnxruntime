parameters:
  AgentPool: ''
  StageSuffix: ''
  NodeVersion: '24.x'
stages:
- stage: Nodejs_Test_${{ parameters.StageSuffix }}
  dependsOn:
  - Setup
  jobs:
  - job: Nodejs_Test_${{ parameters.StageSuffix }}
    workspace:
      clean: all
    timeoutInMinutes: 120
    pool:
      name: ${{ parameters.AgentPool }}
      ${{ if or(eq(parameters.AgentPool, 'onnxruntime-Ubuntu2204-AMD-CPU'), eq(parameters.AgentPool, 'onnxruntime-Ubuntu2404-AMD-CPU')) }}:
        demands:
        - ImageOverride -equals onnxruntime-ubuntu2404-nvme-x64

    variables:
    - name: OnnxRuntimeBuildDirectory
      value: '$(Build.BinariesDirectory)'
    steps:
    - task: UseNode@1
      inputs:
        version: ${{ parameters.NodeVersion }}
    - template: test.yml
