# Experimental CUDA 13 wheels for CPython 3.11-3.14 (including Linux free-threaded builds).
# Runs daily at 09:00 UTC on main; wheels are published only as pipeline artifacts.
trigger: none
pr: none

schedules:
- cron: '0 9 * * *'
  displayName: CUDA 13 combined wheels nightly build
  branches:
    include:
    - main
  always: true

# The `resources` specify the location and version of the 1ES PT.
resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

parameters:
  - name: cmake_build_type
    type: string
    default: 'Release'
    values:
      - Debug
      - Release
      - RelWithDebInfo
      - MinSizeRel

variables:
- template: templates/component-governance-variables.yml
- name: NIGHTLY_BUILD
  value: '1'

extends:
  # Keep the existing packaging pipeline's 1ES and native-library signing configuration.
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    settings:
      networkIsolationPolicy: CFSClean,CFSClean2,CFSClean3,DefaultDeny
    sdl:
      componentgovernance:
        ignoreDirectories: ${{ variables.componentGovernanceIgnoreDirectories }}
        alertWarningLevel: High
        failOnAlert: false
        verbosity: Normal
        timeout: 3600
      tsa:
        enabled: true
      codeSignValidation:
        enabled: true
        break: true
      policheck:
        enabled: true
        exclusionsFile: '$(Build.SourcesDirectory)\tools\ci_build\policheck_exclusions.xml'
      codeql:
        compiled:
          enabled: false
          justificationForDisabling: 'CodeQL is taking nearly 6 hours resulting in timeouts in our production pipelines'
    pool:
      name: 'onnxruntime-Win-CPU-VS2022-Latest'  # Name of your hosted pool
      os: windows  # OS of the image. This value cannot be a variable. Allowed values: windows, linux, macOS

    stages:
      - template: stages/py-win-gpu-unified-stage.yml
        parameters:
          cmake_build_type: ${{ parameters.cmake_build_type }}
          cuda_version: '13.0'
          EP_BUILD_FLAGS: --enable_lto --use_cuda --cuda_home=$(Agent.TempDirectory)\v13.0 --cudnn_home=$(Agent.TempDirectory)\9.14.0.64_cuda13 --cmake_extra_defines "CMAKE_CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;120-real"
          use_tensorrt: true

      - template: stages/py-linux-gpu-unified-stage.yml
        parameters:
          stage_name: Linux_py_GPU_Unified_Wheel_x86_64
          arch: 'x86_64'
          machine_pool: 'onnxruntime-Ubuntu2404-AMD-CPU'
          test_machine_pool: 'Onnxruntime-Linux-GPU-A10'
          cmake_build_type: ${{ parameters.cmake_build_type }}
          cuda_version: '13.0'
          docker_base_image: 'onnxruntimebuildcache.azurecr.io/internal/azureml/onnxruntime/build/cuda13_x64_almalinux8_gcc14:20251107.1'
          wheel_artifact_name: onnxruntime_gpu_unified_x86_64
          build_intermediates_artifact_name: linux_gpu_unified_wheel_x86_64

      - template: stages/py-linux-gpu-unified-stage.yml
        parameters:
          stage_name: Linux_py_GPU_Unified_Wheel_aarch64
          arch: 'aarch64'
          machine_pool: 'onnxruntime-linux-ARM64-CPU-2019'
          cmake_build_type: ${{ parameters.cmake_build_type }}
          cuda_version: '13.0'
          docker_base_image: 'onnxruntimebuildcache.azurecr.io/public/azureml/onnxruntime_build_cuda13_aarch64_almalinux9_gcc14:20260323.1'
          wheel_artifact_name: onnxruntime_gpu_unified_aarch64
          build_intermediates_artifact_name: linux_gpu_unified_wheel_aarch64
